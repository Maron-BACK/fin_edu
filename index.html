교육 내용에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["초등학교 사회 과목에는 금융 내용이 전혀 없다.","중학교 사회 과목에 1개 중단원 분량으로 금융 내용이 처음 등장한다.","고등학교 1학년 통합사회에도 1개 중단원 분량의 금융 내용이 있다.","초등학교부터 고1까지 금융 내용이 충분히 배치되어 금융역량 개발에 부족함이 없다."],"a":4,"e":"정규 교육과정을 통한 금융교육은 <b>매우 부실</b>하며 학생들의 금융역량을 개발하기에 미흡하다는 것이 교재의 평가다."},{"t":"우리나라 학교 금융교육","q":"2022 개정 교육과정에 처음 도입된 고등학교 선택 과목은?","o":["금융과 경제생활","실용금융","금융소비자보호","개인재무설계"],"a":1,"e":"「<b>금융과 경제생활</b>」이 사상 처음으로 고등학교 선택 과목으로 도입되었다. 다만 <b>선택률</b>이 최대 걸림돌로 지적된다."},{"t":"학교 밖 금융교육","q":"학교 금융교육과 학교 밖 금융교육을 구분하는 기준은?","o":["교육이 이루어지는 장소","금융교육을 제공·실행하는 주체","교육 대상자의 연령","교육에 소요되는 비용의 부담 주체"],"a":2,"e":"구분 기준은 <b>제공·실행 주체</b>다. 금융회사가 학교 교실을 찾아가 실행하는 교육도 <b>학교 밖 금융교육</b>이다."},{"t":"금융소비자보호법","q":"금융소비자보호법의 금융교육 관련 조항에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융소비자의 기본 권리 6가지 중 하나가 '합리적인 금융 소비 생활을 위해 필요한 교육을 받을 권리'다.","금융위원회는 금융교육과 학교 교육·평생교육을 연계하는 시책을 수립·시행해야 한다.","금융위원회는 3년마다 금융소비자의 금융역량에 관한 조사를 해야 한다.","금융교육 업무는 금융위원회가 직접 수행해야 하며 위탁할 수 없다."],"a":4,"e":"금융위원회는 금융교육 업무를 <b>금융감독원장 또는 금융교육 관련 기관·단체에 위탁</b>할 수 있다(제30조 제5항)."},{"t":"금융교육협의회","q":"금융교육협의회에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2009년 자발적 협의체로 출범했다가 금소법 제정으로 공식 법적 기구가 되었다.","의장 1명을 포함해 25명 이내의 위원으로 구성되며 의장은 금융위원회 부위원장이 맡는다.","대상자 집단별로 특화된 금융교육 실행기관을 구분해 놓고 있다.","매월 정기 회의를 개최한다."],"a":4,"e":"금융교육협의회는 <b>1년에 두 차례</b>, 상반기와 하반기에 정기 회의를 연다."},{"t":"학교 밖 금융교육","q":"우리나라 학교 밖 금융교육의 과제로 <u>옳지 않은</u> 것은?","o":["일관적이며 체계적인 금융교육 시스템을 구축해야 한다.","언제, 어디서나, 누구나 쉽게 금융교육을 받을 수 있는 환경을 구축해야 한다.","금융소비자의 수요에 부합하는 맞춤형 교육 제공을 확대해야 한다.","만족도 조사만으로 교육 효과를 충분히 검증할 수 있으므로 별도 평가는 불필요하다."],"a":4,"e":"만족도 조사는 <b>제대로 된 평가가 아니며</b>, 교육 후 학습자의 금융역량이 얼마나 변화했는지를 체계적으로 측정해야 한다."},{"t":"금융감독원의 금융교육","q":"금융감독원의 금융교육 사업에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2015년부터 금융회사 본·지점과 인근 학교가 결연하는 '1사 1교 금융교육'을 추진하고 있다.","2016년부터 대학 '실용 금융' 강좌를 지원하며 강사·교재·교수자료를 제공한다.","2015년 9월 '금융교육 전문강사 인증제'를 도입했다.","2002년부터 시행한 금융교육은 취약계층을 제외한 일반 국민만을 대상으로 한다."],"a":4,"e":"북한이탈주민·다문화가족·군장병 등 <b>금융 취약계층</b>에 대한 금융교육도 꾸준히 확대하고 있다."},{"t":"금융이해력 조사","q":"전 국민 금융이해력 조사에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융감독원이 한국은행과 공동으로 OECD 설문지를 이용해 2년마다 시행한다.","2012년부터 시작했으며 전국 18~79세 성인 2,400명을 면접 조사한다.","금융지식·금융행위·금융태도 문항으로 구성된다.","2024년 조사에서 우리나라는 금융태도 점수가 가장 높게 나타났다."],"a":4,"e":"2024년 결과는 금융지식 73.6점, 금융행위 64.7점, <b>금융태도 53.7점</b>으로 금융태도가 가장 낮았고 OECD 평균(58.0)보다도 낮았다."},{"t":"금융이해력 조사","q":"2024년 우리나라 성인 금융이해력 조사 결과로 <u>옳지 않은</u> 것은?","o":["한국 성인의 금융이해력은 65.7점으로 OECD 20개국 단순 평균(62.7점)보다 조금 높다.","30~50대의 금융역량이 높고 20대와 60~70대가 상대적으로 낮다.","금융역량에서 뚜렷한 성별 차이가 나타났다.","미래나 노후 대비보다 현재의 소비를 중시하는 성향의 한국인이 많다."],"a":3,"e":"금융역량에서의 <b>성별 차이는 없는</b> 것으로 나타났다. 취약계층은 사회생활을 시작하는 청년과 고령자다."}]},{"id":"p2c03","part":2,"no":"03","title":"교육과정의 이해","src":"pp.295–310","qs":[{"t":"교육과정의 의의","q":"교육과정(curriculum)의 어원과 의미에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["라틴어 'currere'에서 유래했으며 '뛴다, 달린다'라는 뜻이다.","학습자가 배워야 할 학습 내용이나 경험의 내용을 담고 있다.","그 내용을 일정한 순서로 배열한 학습의 코스를 담고 있다.","'무엇을 공부하는가'만을 다루며 '어떤 순서로 공부하는가'는 포함하지 않는다."],"a":4,"e":"교육과정은 <b>'무엇을 공부하는가'와 '어떤 순서로 공부하는가'를 모두 포괄</b>하는 개념이다."},{"t":"교육과정 이론","q":"경험중심 교육과정(Experience-centered Curriculum)의 특징으로 <u>옳지 않은</u> 것은?","o":["교육과정의 중점을 교과가 아닌 학습자에게 둔다.","교재는 사전에 조직되는 것이 아니라 학습 현장에서 결정한다.","분산된 사실을 가르치기보다 통합된 의미의 체험을 중시한다.","교육과정은 교사가 일방적으로 부여하고 학습자는 이를 따른다."],"a":4,"e":"경험중심 교육과정에서 교육과정은 교사가 일방적으로 부여하는 것이 아니라 <b>모든 학습자의 협동적인 참여</b>로 진행된다."},{"t":"교육과정 이론","q":"학문중심 교육과정(Discipline-centered Curriculum)에 대한 설명으로 옳은 것은?","o":["이성적 심성을 개발하고 학생들이 과학자처럼 지식 탐구 활동을 하게 하는 것이 목적이다.","자아실현의 이상이 핵심이며 학생과 교사 간 정서적 유대감을 강조한다.","소수 기득권 세력의 영향을 배제하고 민중이 주도력을 갖는 것을 강조한다.","미리 정해진 결론을 정확하게 암기하는 것을 가장 중시한다."],"a":1,"e":"②는 인간주의, ③은 사회재건주의 교육과정의 설명이다. 학문중심 교육과정은 최근 <b>고차 사고력(higher order thinking)</b>과 <b>발견 학습</b>을 강조한다."},{"t":"교육과정 이론","q":"다음 설명에 해당하는 교육과정 접근 방법은?","box":"사회가 기득권을 누리는 소수 그룹 때문에 다수가 추구하는 이상적 가치를 실현하기 어렵다고 본다. 따라서 교육은 그러한 가치가 실현될 수 있는 사회를 만드는 데 필요한 의식과 능력을 학습자에게 길러주어야 하며, 인류가 당면한 심각하고 위기적인 문제들을 학습자가 대면하도록 구성된다.","o":["경험중심 교육과정","학문중심 교육과정","인간주의 교육과정","사회재건주의 교육과정"],"a":4,"e":"사회재건주의 교육과정의 설명이다. 이런 문제들은 사회 교과뿐 아니라 <b>경제학·미학·화학·수학 등 모든 학문</b>의 관심사가 되어야 한다고 주장한다."},{"t":"금융교육 표준안","q":"우리나라 「초·중·고 금융교육 표준안」에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융감독원이 2011년 한국교육과정평가원과 함께 개발했다.","2012년 이를 바탕으로 「초·중·고 금융교육 표준교재」를 발간했다.","2020년 개정되었고 2022년에는 표준교재도 개정되었다.","표준안은 학교 정규 교육과정만을 대상으로 하며 학교 밖 금융교육에는 활용되지 않는다."],"a":4,"e":"표준안은 공식 교육과정에서 다루지 못한 내용을 파악해 <b>학교 밖 금융교육을 통해 보완</b>하는 데도 도움을 주었다."},{"t":"금융교육 표준안","q":"2020년 금융교육 표준안 개정의 배경과 방향으로 <u>옳지 않은</u> 것은?","o":["디지털 금융서비스 확대 등 금융환경 변화를 반영한다.","금융교육의 목표가 금융지식 중심에서 금융역량 중심으로 변화했다.","핵심 성취기준을 선별하고 문서 체제를 변경해 활용도를 높인다.","성취기준의 수를 최대한 늘려 모든 세부 내용을 빠짐없이 담는다."],"a":4,"e":"개정 방향은 오히려 <b>핵심 성취기준을 선별</b>하고 문서 체제를 변경해 표준안의 <b>활용도를 제고</b>하는 것이었다."},{"t":"금융교육 표준안","q":"2020년 개정 금융교육 표준안의 구성으로 옳은 것은?","o":["3개 대영역, 8개 중영역","5개 대영역, 12개 중영역","7개 대영역, 15개 중영역","4개 대영역, 10개 중영역"],"a":2,"e":"<b>5개 대영역, 12개 중영역</b>으로 구성된다. 대영역은 Ⅰ.금융과 의사결정, Ⅱ.수입과 지출관리, Ⅲ.저축과 투자, Ⅳ.신용과 부채관리, Ⅴ.보험과 은퇴설계다."},{"t":"금융교육 표준안","q":"금융교육 표준안의 5개 대영역에 해당하지 <u>않는</u> 것은?","o":["금융과 의사결정","수입과 지출관리","신용과 부채관리","기업 재무와 자본조달"],"a":4,"e":"금융교육은 <b>개인 금융</b>에 특화된 교육이므로 기업 재무는 대영역에 포함되지 않는다."},{"t":"표준안의 적용","q":"금융교육 표준안을 학교 안으로 유입하는 방법에 해당하지 <u>않는</u> 것은?","o":["정규 교과 교육과정(학교자율시간, 「금융과 경제생활」)","창의적 체험활동","중학교 자유학기제","대학수학능력시험 필수 과목 지정"],"a":4,"e":"표준안을 학교 안으로 들여오는 방법은 <b>정규 교과 교육과정, 창의적 체험활동, 자유학기제</b>와의 연계다."},{"t":"표준안의 적용","q":"'학교자율시간'에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["『2022 개정 교육과정』에서 새로 도입되었다.","기존 교과 외에 새로운 과목이나 활동을 개설해 운영할 수 있다.","연간 34주 기준으로 한 주에 2시간씩 한 학기 과목을 편성할 수 있다.","개설 과목은 교육부가 일괄 지정하며 학교가 결정할 수 없다."],"a":4,"e":"학교자율시간에 운영하는 과목·활동은 지역과 학교 여건, 학생의 필요에 따라 <b>학교가 결정</b>한다(시·도 교육감이 정하는 지침에 따른 절차 필요)."},{"t":"금융과 경제생활","q":"고등학교 「금융과 경제생활」 과목에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["이전 교육과정에서 「경제」의 한 단원이던 개인 금융 내용을 독립 과목으로 만든 최초의 시도다.","2020년 개정 금융교육 표준안의 체계와 내용을 많이 참고해 개발되었다.","2025학년도 기준 전국 일반고등학교의 약 67.3%가 편성했다.","수능 필수 과목이자 상대평가 과목이어서 교사의 재량이 제한적이다."],"a":4,"e":"<b>수능 준비 부담이 없고 내신도 절대평가</b>로 이루어져 교사가 상당한 재량을 가지고 운영할 수 있다."},{"t":"창의적 체험활동","q":"창의적 체험활동에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["자율·자치활동, 동아리 활동, 진로 활동의 세 영역으로 구성된다.","교과와 상호 보완적 관계 속에서 실시하는 교과 이외의 활동이다.","금융교육 표준안 적용과 관련해 주목할 영역은 '자율활동'이다.","모든 계획은 교사가 단독으로 수립하고 학생은 참여만 한다."],"a":4,"e":"창의적 체험활동에서는 모든 학교급에서 <b>학생과 교사가 공동으로 계획을 수립</b>하고 역할을 분담하여 실천한다."},{"t":"자유학기제","q":"중학교 자유학기제에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["한 학기 동안 시험 부담에서 벗어나 학생 참여형 수업으로 운영한다.","오후에는 주로 주제선택 활동, 진로탐색 활동 등 자유학기 활동이 이루어진다.","평가는 관찰평가·형성평가·포트폴리오 평가 등을 활용하되 일제식 지필평가는 지양한다.","금융교육은 자유학기제와 연계할 수 없다."],"a":4,"e":"오후 <b>주제선택 활동</b>(경제·금융 등)에 참여하는 방안으로 금융교육을 실시할 수 있으며, 중학교 「생활금융」이 17차시용 프로그램으로 활용 가능하다."}]},{"id":"p2c04","part":2,"no":"04","title":"교수법의 이해","src":"pp.311–346","qs":[{"t":"학습 이론","q":"행동주의와 구성주의의 비교로 <u>옳지 않은</u> 것은?","o":["행동주의는 지식을 객관적으로, 구성주의는 주관적으로 본다.","행동주의의 교수자 역할은 지식의 전달자, 구성주의는 학습 촉진자·안내자다.","행동주의는 연습·훈련·반복 학습을, 구성주의는 자기주도적 학습을 수업 전략으로 한다.","구성주의는 교수자가 주도해 개발·제시하는 학습 방법을 적극 권장한다."],"a":4,"e":"구성주의는 학습자에게 많은 선택권과 자율권을 부여하므로 <b>교수자가 주도해 제시하는 학습 방법은 권장하지 않는다</b>."},{"t":"좋은 강의","q":"좋은 강의를 판단하는 핵심 기준 세 가지로 옳은 것은?","o":["효과성 — 효율성 — 매력도","정확성 — 신속성 — 경제성","객관성 — 타당성 — 신뢰성","전문성 — 대중성 — 지속성"],"a":1,"e":"<b>효과성</b>(학업 성취도), <b>효율성</b>(시간·내용의 효율적 관리), <b>매력도</b>(학습 동기)가 핵심 기준이다."},{"t":"교수 원리","q":"좋은 강의를 위한 교수 원리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["교육 내용을 유의미하게 조직해야 학습자가 빠르게 배우고 오래 기억한다.","학습자들이 교수자의 교수 방법에 억지로 적응하도록 유도해야 한다.","학습자가 성취감을 느끼게 하는 것이 강력한 동기 유발 요인이다.","칭찬은 즉각적으로 이루어질 때 효과가 극대화된다."],"a":2,"e":"반대다. <b>학습자들이 선호하는 학습 방법에 맞춰 교수자가 교수 방법을 조정</b>해야 한다."},{"t":"수행 전략","q":"좋은 강의를 위한 수행 전략으로 <u>옳지 않은</u> 것은?","o":["내용 범위와 수준을 적절하게 설정한다.","학습 목표에서 인지·기능·정의 사이의 균형을 유지한다.","교수자에게 가장 익숙하고 자신 있는 하나의 교수 방법을 일관되게 사용한다.","실생활 문제와 사례, 학습자의 사전 경험을 활용한다."],"a":3,"e":"획일적 교수법에 의존하면 흥미 유발에 실패하므로 <b>다양한 교수 방법을 고루 활용</b>해야 한다."},{"t":"교수 설계","q":"교수 설계의 일반적인 절차 순서로 옳은 것은?","o":["교수 내용 분석 → 학습자 특성 파악 → 학습 목표 설정 → 평가 계획 수립 → 교수 방법 선정 → 교수 매체 선정","학습 목표 설정 → 교수 내용 분석 → 교수 매체 선정 → 학습자 특성 파악 → 평가 계획 수립 → 교수 방법 선정","교수 방법 선정 → 교수 내용 분석 → 학습자 특성 파악 → 학습 목표 설정 → 교수 매체 선정 → 평가 계획 수립","학습자 특성 파악 → 평가 계획 수립 → 교수 내용 분석 → 학습 목표 설정 → 교수 매체 선정 → 교수 방법 선정"],"a":1,"e":"교수 목적 확인과 <b>교수 내용 분석</b>이 가장 먼저이고, 이어 학습자 특성 파악 → 학습 목표 설정 → 평가 계획 → 교수 방법 → 교수 매체 순이다."},{"t":"학습자 특성","q":"학습자 특성별 고려 사항으로 <u>옳지 않은</u> 것은?","o":["소수(30명 미만)는 참여식 학습을 진행하고 내용을 좁혀 깊이 있게 다룬다.","다수(30명 이상)는 시각 자료에 한계가 있음을 인지하고 세심한 계획이 필요하다.","나이가 높은 학습자에게는 현실적·논리적 설명과 예의 바른 태도가 필요하다.","지식 수준이 낮은 학습자에게는 전문용어와 통계를 적극 사용해 설명한다."],"a":4,"e":"지식 수준이 낮은 학습자에게는 <b>전문용어를 자제</b>하고 눈높이에 맞춰 <b>생활 속 사례</b>를 제시해야 한다."},{"t":"학습 목표","q":"학습 목표를 기술할 때의 유의사항으로 <u>옳지 않은</u> 것은?","o":["관찰 가능한 외현적 동사(설명한다, 제시한다 등)를 사용한다.","학습자가 동작의 주체가 되는 문장으로 표현한다.","'안다', '감상한다' 같은 내현적 동사를 사용하는 것이 바람직하다.","한 개의 목표에 하나의 행동만 포함해 기술하는 것이 좋다."],"a":3,"e":"'안다', '감상한다'는 교수자가 성취 여부를 <b>관찰할 수 없는 내현적 동사</b>이므로 학습 목표 기술에 부적절하다."},{"t":"학습 목표","q":"다음 중 학습 목표로 올바르게 서술된 것은?","o":["투자 의사결정에서 비용-편익 분석을 적용시킨다.","자산 포트폴리오 구성에 대해 논의한다.","금융상품의 종류와 특성","금융상품의 종류와 특성을 비교할 수 있다."],"a":4,"e":"①은 교수 활동을, ②는 과정을, ③은 강의 주제(소제목)를 기술한 것이다. 학습 목표는 <b>학습자가 강의 후 할 수 있는 행동</b>으로 서술해야 한다."},{"t":"교수 매체","q":"교수 매체 활용의 효과에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["그림·동영상 등은 학습자의 주의를 집중시키고 동기를 유발해 강의 매력도를 높인다.","인간은 시각을 통해 가장 많이(약 83%) 학습한다는 연구 결과가 있다.","교수 매체는 짧은 시간에 많은 정보를 전달해 강의 효율성을 높인다.","교수 매체는 학습 목표와 무관하게 최신 기술일수록 무조건 사용하는 것이 좋다."],"a":4,"e":"교수 매체는 <b>실용성, 학습자 특성, 적합성</b>이라는 기준으로 학습 목표와 교수 방법에 맞게 선정해야 한다."},{"t":"교수-학습과정안","q":"교수-학습과정안 작성 시 유의할 점으로 <u>옳지 않은</u> 것은?","o":["질문할 내용, 설명할 사례, 예상되는 학습자의 대답까지 구체적으로 기록한다.","타인이 보더라도 이해할 수 있도록 명확하고 체계적으로 작성한다.","도입, 전개, 정리의 3단계로 구성하는 것이 일반적이다.","도입과 정리는 각각 전체 강의 시간의 30% 이상을 배정하는 것이 바람직하다."],"a":4,"e":"도입과 정리는 각각 전체 강의 시간의 <b>5~10%를 넘지 않도록</b> 하는 것이 바람직하다."},{"t":"전달 기술","q":"강의 중 시선 처리와 움직임에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["강의실을 네 구역으로 나눠 각 구획의 호의적인 학습자를 돌아가며 쳐다본다.","한 학습자와 2~3초 동안 눈을 마주치고 표정을 읽는 것이 좋다.","강의 중 서너 걸음 정도 천천히 움직이는 것이 주의 집중에 도움이 된다.","학습자를 대충 빠르게 훑어보거나 스크린을 오래 보는 것이 안정적이다."],"a":4,"e":"학습자를 대충 훑어보거나 <b>장시간 스크린·강의 원고만 보는 행동은 반드시 피해야 한다</b>."},{"t":"신뢰감 형성","q":"학습자로부터 신뢰감을 얻기 위한 방법으로 <u>옳지 않은</u> 것은?","o":["학습자에 대한 부정적 표현이나 무시하는 발언을 피한다.","학습자에게 관심을 보이고 그들의 사고와 문화에 동화하려는 태도를 보인다.","열정적으로 강의하고 강의 내용을 철저하게 숙지한다.","강의 후에는 연락처를 알려주지 않고 관계를 명확히 끊는 것이 바람직하다."],"a":4,"e":"나중에라도 <b>도움이 필요하면 언제든 문이 열려 있다</b>는 점을 강조하고 필요하면 이메일 주소를 알려주는 것이 신뢰감 형성에 좋다."},{"t":"질문 기술","q":"강의 중 질문에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["도입 단계 질문은 선행 지식 파악과 학습 동기 유발 기능을 한다.","전개 단계 질문은 피드백 유도와 주의 집중 환기에 효과적이다.","마무리 단계 질문은 학습 내용을 요약해 오래 기억하게 만든다.","학습자의 반응을 유도하는 데는 '예/아니오'로 답하는 폐쇄형 질문이 더 효과적이다."],"a":4,"e":"광범위하게 생각하고 다양하게 답할 수 있는 <b>개방형 질문</b>이 학습자의 반응을 유도하는 데 효과적이다."},{"t":"응답 관리","q":"학습자의 응답을 관리하는 기술로 <u>옳지 않은</u> 것은?","o":["생각하고 답변할 시간을 충분히 주고, 틀려도 좋다고 말해 동기를 자극한다.","부정확한 응답에도 마음이 상하지 않도록 격려하는 반응을 보인다.","학습자의 응답이 없으면 교수자가 즉시 스스로 답을 말해 진행을 서두른다.","답하기 어려운 질문이 나오면 다른 학습자에게 묻는 중계 질문 기법을 쓸 수 있다."],"a":3,"e":"교수자가 성급하게 답을 말해버리면 <b>다음 질문부터 학습자가 답하려 하지 않는다</b>. 질문을 좁히거나 학습자를 지명하는 방식이 낫다."},{"t":"프레젠테이션","q":"프레젠테이션 자료 제작 시 유의사항으로 <u>옳지 않은</u> 것은?","o":["일반적으로 슬라이드 한 장당 2분 내외의 분량이 적당하다.","완전한 문장보다는 구나 절로 제시하고 여백을 둔다.","핵심 내용을 강조하기 위해 색깔은 다섯 가지 이상 다양하게 사용한다.","뒷자리 학습자를 배려해 슬라이드 하부 1/6 정도는 여백으로 남긴다."],"a":3,"e":"색깔이 너무 다양하면 오히려 핵심 파악에 방해가 되므로 <b>세 가지 이상의 색깔 사용은 피한다</b>."},{"t":"동영상 활용","q":"동영상 활용에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["활용 목적(동기 유발, 보충 설명, 사례 제시)을 명확히 결정한 후 선택한다.","동영상은 5분을 넘기지 않는 것이 좋다.","상영 후 보충 설명을 하거나 학습자의 의견·소감을 유도한다.","동영상을 제시하는 것만으로도 학습 효과가 보장된다."],"a":4,"e":"동영상 제시만으로 <b>학습 효과가 보장되지는 않는다</b>. 저작권 확인, 적절한 편집, 상영 전후 안내와 논의가 함께 이루어져야 한다."},{"t":"학습 피라미드","q":"학습 피라미드(평균 기억률)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["강의를 들은 것은 평균 5%만 기억한다.","토론한 것은 50%, 직접 해본 것은 75%를 기억한다.","서로 가르친 것은 약 90%를 기억한다.","수동적 강의 방법이 참여적 방법보다 기억 지속에 효과적이다."],"a":4,"e":"학습자가 <b>주도적으로 참여하도록 유도하는 강의 방법</b>이 학습 효과를 오래 지속시키는 데 훨씬 효과적이다."},{"t":"강의식","q":"강의식 교수 방법의 특징으로 <u>옳지 않은</u> 것은?","o":["많은 학습자를 대상으로 할 수 있고 교수자가 주도적으로 진행할 수 있다.","학습 내용이 단순하고 가르칠 내용이 많은 경우에 적합하다.","학습자의 고급 지적 활동을 촉진하고 수준별 학습을 하기에 유리하다.","학습자가 수동적으로 학습하고 이해 수준을 판단하기 어렵다."],"a":3,"e":"강의식은 <b>고급 지적 활동 촉진이 어렵고 수준별 학습도 어려우며</b> 전적으로 교수자 개인의 능력에 의존한다는 단점이 있다."},{"t":"토의·토론식","q":"토의·토론식 교수 방법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["비판적 사고력, 문제 해결 능력, 의사소통 능력을 향상할 수 있다.","강의식에 비해 시간이 적게 소요된다는 장점이 있다.","일부 학습자가 주도하고 나머지는 무관심해질 우려가 있다.","교수자는 토의 과정에 지나치게 간섭하지 않고 자신의 의견 제시도 피한다."],"a":2,"e":"여러 학습자의 의견을 골고루 들어야 하므로 강의식에 비해 <b>시간이 많이 소요</b>된다."},{"t":"토의 기법","q":"다음 설명에 해당하는 토의 기법은?","box":"학습자들을 소집단으로 편성해 특정 주제를 토의하게 하는 기법이다. 필립스가 개발했으며 6명이 6분 동안 토의한다는 점에서 '필립스 66'이라고도 불린다. 각 모둠의 대표와 기록자를 선정하고 토의가 끝나면 기록자가 내용을 발표한다.","o":["브레인스토밍","버즈(buzz) 그룹","직소Ⅱ 모형","플립드 러닝"],"a":2,"e":"버즈 그룹의 설명이다. 브레인스토밍은 더 많은 학습자를 대상으로 자유롭게 아이디어를 제시하게 하며, 교수자는 진행 도중 <b>학습자의 의견을 평가하지 않는다</b>."},{"t":"문제해결식","q":"문제해결식 교수 방법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["자기 주도적 학습과 협동 학습으로 요약할 수 있다.","일상생활 문제에 해결책을 탐구한다는 점에서 실용적이다.","교수자는 문제개발자, 자원안내자, 상담자, 동기부여자, 학습촉진자 역할을 한다.","모든 학습자 수준에 적합한 문제를 찾기 쉽고 시간도 적게 소요된다."],"a":4,"e":"다양한 수준의 학습자 모두에게 적절한 문제 상황을 <b>찾아내기가 쉽지 않고 시간도 많이 소요</b>되어 강의실에서 자주 사용되는 방법은 아니다."},{"t":"협동식","q":"협동식 교수 방법의 '직소(Jigsaw)Ⅱ 모형' 진행 단계로 옳은 것은?","o":["도입 → 과제 제시 및 선택 → 전문가 집단 활동 → 원집단 활동 → 마무리","도입 → 원집단 활동 → 과제 제시 및 선택 → 전문가 집단 활동 → 마무리","과제 제시 및 선택 → 도입 → 원집단 활동 → 전문가 집단 활동 → 마무리","도입 → 전문가 집단 활동 → 과제 제시 및 선택 → 원집단 활동 → 마무리"],"a":1,"e":"같은 하위 주제를 맡은 학습자끼리 <b>전문가 집단</b>에서 집중 논의한 뒤, <b>원집단</b>으로 돌아와 자신이 학습한 내용을 구성원들에게 가르치는 것이 핵심이다."},{"t":"협동식","q":"협동식 교수 방법의 유의점으로 <u>옳지 않은</u> 것은?","o":["능력이 뛰어난 일부 학습자가 학습을 주도하고 소극적 학습자가 소외될 우려가 있다.","학습자들의 학습 능력과 특성을 고려해 상호 이질적인 4~6명으로 집단을 구성하는 것이 바람직하다.","학습 성과가 노력과 관계없이 공유된다는 문제가 있다.","단기 교육에서는 학습자 능력 파악이 쉬우므로 집단 구성에 어려움이 없다."],"a":4,"e":"단기 교육에서는 <b>학습자 능력 파악이 불가능</b>하므로 임의로 구분할 수밖에 없다는 한계가 있다."},{"t":"시뮬레이션식","q":"시뮬레이션식 교수 방법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["실제 상황과 유사한 상황을 인위적으로 제시하고 학습자가 의사결정을 하게 한다.","적은 비용으로 사실적인 경험을 할 수 있고 흥미 유도에 효과적이다.","실제 세계를 단순화하는 과정에서 지나치게 비현실적이 될 위험이 있다.","활동이 끝나면 별도의 정리 없이 마치는 것이 여운을 남겨 효과적이다."],"a":4,"e":"활동 후 무엇을·왜 했는지 모르는 학습자가 생길 수 있으므로 교수자는 <b>반드시 시뮬레이션에 대해 논의하거나 정리하는 시간</b>을 가져야 한다."},{"t":"기타 교수법","q":"플립드 러닝(거꾸로식)과 프로젝트식에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["플립드 러닝은 사전에 제공된 자료를 스스로 학습해 오고 강의 시간에는 심화 학습을 한다.","플립드 러닝은 강의 시간에 단순 지식 전달이 아닌 심화 학습을 할 수 있다는 장점이 있다.","프로젝트식은 학습자 스스로 계획을 세우고 자신이 제시한 문제를 해결하게 한다.","프로젝트식에서 교수자는 지식의 일방적 전달자 역할에 집중한다."],"a":4,"e":"프로젝트식에서 교수자는 <b>학습 촉진자·보조자·조력자</b> 역할을 하며 학습자가 학습 활동을 효율적으로 이끌어가도록 지원한다."},{"t":"AI와 교수법","q":"AI를 활용한 교수법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["강의 전에는 사전 설문 분석으로 학습자 배경지식·수준을 파악해 교수 설계에 반영할 수 있다.","강의 중 AI 챗봇을 병행 운영하면 '평균의 함정'에서 벗어나는 데 도움이 된다.","강의 후에는 맞춤형 복습 자료 제공이나 질문 분석을 통한 후속 특강 설계가 가능하다.","AI가 유능하므로 교수자의 역량과 무관하게 교육 효과가 보장된다."],"a":4,"e":"AI가 유능하더라도 <b>교수자의 역량이 전제되어야</b> AI 활용 교수법이 교육 효과를 높이는 데 도움이 된다."}]},{"id":"p2c05","part":2,"no":"05","title":"금융교육 전문강사 윤리","src":"pp.347–353","qs":[{"t":"윤리규범","q":"윤리규범에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["인간 행동의 옳고 그름에 대한 표준 규범을 말한다.","공동체 생활을 위해 마땅히 따라야 하는 올바른 행동의 기준이다.","특정한 행위나 역할을 수행하는 사람에게 요구되는 행동규범도 포함한다.","위반하면 법률과 동일하게 법적 처벌과 불이익을 받는다."],"a":4,"e":"윤리규범은 법률과 달리 위반해도 <b>법적 처벌이나 불이익을 당하지는 않지만 사회적 비난과 지탄</b>을 받을 수 있다."},{"t":"교육자의 윤리","q":"교육자가 윤리규범을 준수해야 하는 이유로 <u>옳지 않은</u> 것은?","o":["교육자의 권위는 교육 성과에 영향을 미치는 중요한 요인이다.","교수 능력은 효과적 교육의 필요조건이지만 충분조건은 아니다.","학생의 도덕적 품성 성장은 부모나 교사의 인간성에 영향을 받는다.","교육자의 권위는 오로지 가르치는 기술에서만 나온다."],"a":4,"e":"교육자의 권위는 가르치는 기술이 아니라 <b>교육자로서 얼마나 모범적인 모습을 보여주는지</b>에 달려 있다."},{"t":"최소 요구역량","q":"금융교육 전문강사 최소 요구역량의 세 요소로 옳은 것은?","o":["내용 지식 — 교수적 지식 — 윤리지침 준수","금융 자격증 — 강의 경력 — 학력","상품 판매 실적 — 고객 관리 — 마케팅 능력","이론 연구 — 논문 발표 — 학회 활동"],"a":1,"e":"전문강사의 최소 요구역량은 <b>내용 지식(content knowledge), 교수적 지식(pedagogical knowledge), 윤리지침 준수</b>의 세 가지다."},{"t":"최소 요구역량","q":"금융교육 전문강사 최소 요구역량에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["은행·증권·보험 등 금융회사에서 5년 이상 경력을 가진 금융전문가와 동일 수준의 금융지식을 갖춰야 한다.","금융상품의 특성을 금융회사 관점에서 파악해 전달할 수 있어야 한다.","새로운 금융제도·환경을 지속적으로 학습해 시의성 있는 정보를 전달할 수 있어야 한다.","학습자의 특성을 파악해 알맞은 강의안을 작성할 수 있어야 한다."],"a":2,"e":"금융상품의 특성을 명확히 파악하여 <b>금융소비자 관점</b>에서 활용방안을 전달할 수 있어야 한다."},{"t":"윤리지침","q":"금융교육 전문강사 윤리지침에 <u>위배되는</u> 행동은?","o":["법규를 준수하고 청렴성·친절성·성실성 등 기본 소양을 갖춘다.","사회공헌활동의 일환으로 금융교육을 수행한다.","강의 중 소속 금융회사의 신상품을 소개하고 가입을 권유한다.","타당한 근거 없는 비객관적 정보 제공을 삼간다."],"a":3,"e":"전문강사는 <b>특정상품 마케팅이나 특정 금융회사 선전을 목적으로 금융교육을 해서는 안 된다</b>."},{"t":"윤리지침","q":"금융교육 전문강사 윤리지침에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융상품 마케팅 목적이 아니라면 특정 금융회사를 선전하는 것은 허용된다.","타당한 근거 없이 혼란을 초래할 수 있는 오인 가능한 정보를 제공해서는 안 된다.","정치·종교·성별에 관한 차별적 발언을 해서는 안 된다.","비윤리적이거나 인신 공격적 발언·행동으로 학습자에게 피해를 주면 안 된다."],"a":1,"e":"마케팅 목적이 아니더라도 <b>특정 금융회사를 선전하기 위한 목적으로 금융교육을 해서는 안 된다</b>."},{"t":"바람직한 전문강사","q":"학생들이 좋아하는 전문강사 유형에 대한 설명으로 옳은 것은?","o":["25가지 유형 중 '내용을 많이 알고 잘 가르치는' 유형이 압도적으로 많다.","'학생을 잘 이해하려 노력하고 정서적으로 접근하려는' 유형이 더 많다.","학생들은 엄격하고 완고한 전문강사를 가장 선호한다.","유머 감각이나 약속 준수는 선호 요인과 무관하다."],"a":2,"e":"흥미롭게도 25가지 유형 중 <b>학생을 이해하고 정서적으로 접근하려는 유형</b>이 지식 전달 능력 관련 유형보다 더 많다."},{"t":"바람직한 전문강사","q":"중학생이 응답한 '싫어하는 교사(전문강사)의 특성' 가운데 금융교육 현장에도 적용될 수 있는 항목으로 교재가 지적한 것에 해당하지 <u>않는</u> 것은?","o":["설명이 너무 빠르고 서툴다","독단적이고 잘난 체 한다","언어가 불분명하다","숙제를 적게 낸다"],"a":4,"e":"교재는 '설명이 너무 빠르고 서툴다', '독단적이고 잘난 체 한다', '언어가 불분명하다', '<b>시간을 안 지킨다</b>'를 금융교육 현장에도 적용될 수 있는 항목으로 지적했다."},{"t":"행동지침","q":"바람직한 금융교육 전문강사의 행동지침으로 <u>옳지 않은</u> 것은?","o":["학생의 인권을 존중하고 특성을 이해하며 최선을 다해 지도한다.","학생의 가능성을 인정하고 늘 긍정적인 태도로 금융교육에 임한다.","학생을 일방적으로 인도하여 정해진 결론에 도달하게 한다.","학생의 창의성을 존중하고 스스로 금융 지식·정보를 찾아갈 능력을 기르게 한다."],"a":3,"e":"전문강사는 학생을 일방적으로 인도하기보다 <b>학생과의 효과적인 상호작용</b>을 통해 금융교육의 목적을 달성해야 한다."},{"t":"행동지침","q":"금융교육 전문강사가 금융교육에 대해 실천해야 할 사항으로 <u>옳지 않은</u> 것은?","o":["금융교육을 통해 국가와 사회에 공헌한다는 이상을 가져야 한다.","단순한 금융지식 전달을 넘어 학생의 삶의 변화에 영향을 주어야 한다.","금융교육에 대한 투철한 자기 철학과 뚜렷한 가치·윤리의식을 가져야 한다.","자기희생과 봉사정신 없이도 충분한 성과를 기대할 수 있다."],"a":4,"e":"전문강사는 금융교육 수행 과정에서 <b>자기희생과 봉사정신 없이는 성과를 기대할 수 없다</b>는 점을 인식해야 한다."}]}],"mocks":[{"id":"mock1","title":"실전 모의고사 1회","mock":true,"qs":[{"t":"금융의 개관","q":"실질 이자율에 대한 설명으로 옳은 것은?","o":["명목금리 3%, 물가상승률 1%면 실질금리는 2%이다.","명목금리 3%, 물가상승률 1%면 실질금리는 4%이다.","실질금리는 언제나 명목금리보다 높다.","금융회사가 제공하는 금리는 모두 실질금리 기준이다."],"a":1},{"t":"금융의 개관","q":"환율이 하락(원화 강세)할 때 나타나는 현상으로 옳은 것은?","o":["외화표시 부채 보유 기업의 금융비용 부담이 늘어난다.","수입물가가 올라 기업·가계의 구매력이 떨어진다.","수출품의 달러 환산 가격이 올라 수출이 줄어든다.","국내 금리 하락으로 해외자본이 유입된 결과이다."],"a":3},{"t":"금융의 개관","q":"우리나라 주가지수에 대한 설명으로 옳은 것은?","o":["코스피지수의 기준시점은 1983년 1월이다.","코스닥지수는 현재 기준지수가 100이다.","KRX300은 코스닥 종목을 제외하고 구성한다.","코스피200은 대표성 있는 200종목으로 산출하며 1994년 6월부터 발표된다."],"a":4},{"t":"금융상품과 금융시장","q":"금융시장의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기업어음시장과 콜시장은 단기금융시장에 속한다.","자산유동화증권시장은 장기금융시장(자본시장)에 속한다.","발행시장에서 인기가 없는 증권은 유통시장에서도 인기가 없다.","장외시장은 거래상대방의 익명성이 철저히 보장되는 표준화된 시장이다."],"a":4},{"t":"금융상품과 금융시장","q":"예금보험공사의 보호를 받지 <u>않는</u> 금융회사는?","o":["종합금융회사","상호저축은행","보험회사","신용협동조합"],"a":4},{"t":"저축과 투자","q":"연 8% 복리상품에 가입했을 때 '72의 법칙'에 따른 원금 2배 도달 기간은?","o":["약 6년","약 9년","약 12년","약 16년"],"a":2},{"t":"저축과 투자","q":"자기자금 50만 원에 대출 50만 원을 더해 100만 원을 투자했을 때의 투자 레버리지는?","o":["1.0배","1.5배","2.0배","2.5배"],"a":3},{"t":"저축과 투자","q":"MMF에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["이체 및 결제 기능이 있고 예금자보호 대상이다.","가입·환매가 청구 당일 즉시 이루어져 입출금이 자유롭다.","CP·CD·RP·콜 등 단기금융상품에 투자하는 실적배당상품이다.","은행뿐 아니라 증권회사에서도 취급한다."],"a":1},{"t":"저축과 투자","q":"우리나라 주식 매매제도에 대한 설명으로 옳은 것은?","o":["매매체결은 시간우선원칙이 가격우선원칙보다 앞선다.","일일 가격제한폭은 전일 종가 대비 ±30%이다.","매매 체결 주식의 결제는 당일(D+0)에 이루어진다.","시초가와 종가는 시간우선원칙에 따라 순차 체결된다."],"a":2},{"t":"저축과 투자","q":"시장이자율이 하락할 때 채권가격과 듀레이션에 대한 설명으로 옳은 것은?","o":["채권가격은 상승하며, 할인채의 듀레이션은 만기와 같다.","채권가격은 하락하며, 할인채의 듀레이션은 만기보다 짧다.","채권가격은 상승하며, 이표채의 듀레이션은 만기보다 길다.","채권가격은 변하지 않으며 듀레이션도 일정하다."],"a":1},{"t":"투자상품","q":"펀드 평가지표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["베타가 0.8이면 벤치마크가 10% 하락할 때 펀드는 8% 하락하는 경향이 있다.","MDD가 클수록 안정적인 펀드임을 뜻한다.","샤프지수가 높을수록 위험 한 단위당 수익이 크다.","알파가 양(+)이면 벤치마크보다 좋은 성과를 냈다는 의미다."],"a":2},{"t":"투자상품","q":"ELS·ELB·DLS·DLB의 원금보장 여부로 옳은 것은?","o":["ELS·DLS는 원금보장, ELB·DLB는 원금 비보장","ELB·DLB는 원금보장, ELS·DLS는 원금 비보장","네 상품 모두 원금보장","네 상품 모두 원금 비보장"],"a":2},{"t":"투자상품","q":"선물과 옵션에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["선물은 매입·매도 쌍방이 모두 계약이행 의무를 진다.","옵션 매입자는 유리하면 행사하고 불리하면 포기할 수 있다.","선물옵션을 행사하면 현물이 아닌 선물계약을 갖게 된다.","미국식 옵션은 만기일에만 권리를 행사할 수 있다."],"a":4},{"t":"부채관리","q":"대출 규제 지표에 대한 설명으로 옳은 것은?","o":["DSR은 모든 금융부채의 연간 원리금 상환액 합계를 연소득으로 나눈 비율이다.","LTV는 연간 소득에 대한 원리금 상환액의 비율이다.","DTI는 주택가격 대비 대출금의 비율이다.","현재는 LTV가 유일한 핵심 관리 지표이다."],"a":1},{"t":"부채관리","q":"대출금 상환방식에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["원금균등분할상환은 매월 상환액이 점차 줄어든다.","원리금균등분할상환은 매월 상환액이 같아 자금계획 수립이 쉽다.","거치식상환은 거치기간에도 원금이 줄어 총 이자가 가장 적다.","만기일시상환은 만기 부담이 커 금융당국이 장려하지 않는다."],"a":3},{"t":"부채관리","q":"연체이자율과 금리인하요구권에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융회사는 금리인하요구에 대해 수용 여부를 통지할 의무가 없다.","연체이자율도 법정 최고이자율(연 20%)을 넘을 수 없다.","금리인하요구는 일반적으로 대출 후 3개월 경과 후 신청한다.","연체이자율은 약정금리 + 최대 3%p 이내로 제한된다."],"a":1},{"t":"신용관리","q":"연체정보의 등록에 대한 설명으로 옳은 것은?","o":["3개월 미만의 단기연체는 어떤 기관에도 반영되지 않는다.","3개월(90일) 이상 연체하면 한국신용정보원에 신용도판단정보로 등록된다.","연체 원리금을 상환하면 신용평가회사의 이력도 즉시 삭제된다.","본인이 자신의 신용정보를 조회하면 신용점수가 하락한다."],"a":2},{"t":"신용관리","q":"신용회복지원제도의 연체기간 요건으로 옳은 것은?","o":["신속채무조정 — 90일 이상","개인워크아웃 — 30일 이하","사전채무조정(프리워크아웃) — 31~89일","신속채무조정 — 31~89일"],"a":3},{"t":"보험","q":"보험의 적용원리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["수지상등의 원칙은 순보험료 총액과 보험금 총액이 같아야 한다는 원칙이다.","이득금지의 원칙은 보험금이 실제 손해를 초과할 수 없다는 원칙이다.","보험은 전통적으로 투기적 위험을 주된 대상으로 발달해 왔다.","일반손해보험은 사고 발생 건수가 적어 대수의 법칙 적용이 어려운 분야가 있다."],"a":3},{"t":"보험","q":"보험료 산정의 3이원 방식에서 예정률과 보험료의 관계로 옳은 것은?","o":["예정사망률이 낮아지면 사망보험료는 비싸진다.","예정이율이 높아지면 보험료는 비싸진다.","예정사업비율이 높아지면 보험료는 싸진다.","예정이율이 높아지면 보험료는 싸진다."],"a":4},{"t":"보험","q":"보험계약의 성격과 소멸에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험계약은 불요식·낙성계약이며 유상·쌍무·부합계약이다.","이미 발생한 사고를 보험사고로 하는 계약도 유효하다.","계약의 해지는 장래에 대해서만 효력을 소멸시킨다.","보험회사의 책임개시는 원칙적으로 최초 보험료를 받은 때부터다."],"a":2},{"t":"보험","q":"자동차보험 담보 중 의무가입 대상인 것으로 옳게 묶인 것은?","o":["대인배상Ⅰ, 대물배상(2천만 원)","대인배상Ⅱ, 자기차량손해","자기신체사고, 무보험자동차 상해","대인배상Ⅰ, 자기차량손해"],"a":1},{"t":"보험","q":"실손의료보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["정액보험이 아니므로 중복 가입해도 실제 부담 의료비를 초과 보상받을 수 없다.","1년 또는 3~5년 단위로 갱신되는 대표적 갱신형 보험이다.","4세대의 재가입 주기는 5년이다.","중복 가입 여부는 확인할 방법이 없어 해지도 불가능하다."],"a":4},{"t":"인생설계와 연금","q":"재무설계에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["재무설계는 정기적으로 수정·보완되는 과정이다.","자산부채상태표는 특정 시점의 자산·부채 상태를 파악하는 표다.","다양한 재무목표를 동시에 고려한 재무설계를 단일재무설계라 한다.","현금흐름표는 일정 기간의 유입과 유출을 파악하는 표다."],"a":3},{"t":"인생설계와 연금","q":"국민연금 조기노령연금에 대한 설명으로 옳은 것은?","o":["개시를 1년 앞당길 때마다 수령액이 6%씩 감소한다.","개시를 1년 앞당길 때마다 수령액이 6%씩 증가한다.","개시 시기와 관계없이 수령액은 동일하다.","가입기간이 5년 이상이면 누구나 신청할 수 있다."],"a":1},{"t":"인생설계와 연금","q":"퇴직연금 DB형과 DC형에 대한 설명으로 옳은 것은?","o":["DB형은 근로자가 적립금을 직접 운용한다.","임금상승률이 높고 장기근속이 가능한 근로자에게는 DB형이 유리하다.","DC형의 운용손익은 회사에 귀속된다.","임금피크제에 진입한 근로자에게는 DB형이 유리하다."],"a":2},{"t":"인생설계와 연금","q":"주택연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["부부 중 1명이 만 55세 이상이면 가입할 수 있다.","부부 중 한 사람이 사망해도 감액 없이 종신 지급한다.","한국주택금융공사가 보증하는 국가 보증 금융상품이다.","연금지급총액이 주택 처분가격을 초과하면 상속인에게 차액을 청구한다."],"a":4},{"t":"금융소비자보호","q":"금융소비자보호법상 6대 판매규제에 해당하지 <u>않는</u> 것은?","o":["적합성 원칙","적정성 원칙","광고규제","최저보증이율 적용의무"],"a":4},{"t":"금융소비자보호","q":"적합성 원칙과 적정성 원칙의 적용 상황으로 옳은 것은?","o":["두 원칙 모두 예금성 상품에 우선 적용된다.","적합성은 소비자가 자발적으로 구매할 때, 적정성은 권유가 있을 때 적용된다.","적합성은 판매업자의 권유가 있을 때, 적정성은 소비자가 자발적으로 계약 의사를 밝혔을 때 적용된다.","적정성 원칙의 대상 상품 범위가 적합성보다 넓다."],"a":3},{"t":"금융소비자보호","q":"금융분쟁조정에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융감독원이 양측 주장과 사실관계를 확인해 조정안을 제시한다.","금융감독원에 민원을 제기하면 보험금 청구권의 소멸시효가 중단된다.","소액 분쟁은 소비자만 수락해도 법적 구속력이 발생할 수 있다.","양 당사자가 조정안을 수락하면 화해가 성립된다."],"a":2},{"t":"금융소비자보호","q":"전기통신금융사기 수법에 대한 설명으로 옳은 것은?","o":["스미싱은 문자 링크로 악성 앱을 설치하게 해 정보를 탈취하는 수법이다.","파밍은 전화 통화만으로 이체를 유도하는 수법이다.","메신저피싱은 반드시 모르는 사람 명의로만 이루어진다.","보이스피싱은 정보 취약계층에서만 발생한다."],"a":1},{"t":"금융소비자보호","q":"불완전판매의 방지 노력에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융회사는 신의성실 및 이해상충 관리 의무를 진다.","소비자는 서명 전 위험·비용·만기구조·중도해지 제한을 다시 점검해야 한다.","설명 항목을 최대한 늘리고 일괄 서명을 받으면 소비자 보호가 강화된다.","거래 화면이나 교부 문서를 보관하면 사후 분쟁에서 도움이 된다."],"a":3},{"t":"금융소비자보호","q":"개인정보보호에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["익명 처리되어 식별이 불가능한 정보는 개인정보에 해당하지 않는다.","최소수집에 대한 입증책임은 개인정보처리자에게 있다.","2020년 데이터 3법 개정으로 가명정보 개념이 도입되었다.","개인정보침해신고센터는 금융감독원이 운영하며 대표번호는 1332이다."],"a":4},{"t":"디지털 금융","q":"블록체인과 디파이에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["디파이에서 서비스 이행 주체는 서비스를 만든 개발자다.","네트워크의 51%가 동의하면 원장 변경이 가능하다.","블록체인은 참여자 전체가 공동으로 장부를 소유·유지하는 분산원장이다.","디파이 생태계에서는 가치 안정성 때문에 스테이블코인이 거래매체로 쓰인다."],"a":1},{"t":"디지털 금융","q":"디지털 금융 관련 법률에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["특금법은 가상자산사업자(VASP)를 규제 대상에서 제외한다.","금융혁신지원 특별법은 금융규제 샌드박스의 근거 법률이다.","혁신금융서비스로 지정되면 최대 4년간 규제 제약 없이 실험할 수 있다.","전자금융거래법은 접근매체 관리의무와 고객보호원칙을 규정한다."],"a":1},{"t":"디지털 금융","q":"디지털 금융서비스의 위험 대응방안으로 <u>옳지 않은</u> 것은?","o":["실시간 이상거래 감지 시스템과 다중 인증 체계를 고도화한다.","알고리즘의 설명 가능성과 투명성을 개선한다.","고령소비자 소외 해소를 위해 대면 통합지점과 고령층 전용앱을 활용한다.","생성형 AI가 제공하는 금융정보는 정확하므로 그대로 수용하도록 교육한다."],"a":4},{"t":"금융교육의 이해","q":"금융교육(financial education)의 범위로 옳은 것은?","o":["정부 예산과 재정 건전성을 다루는 거시 금융 중심","기업의 자금조달을 다루는 기업 금융 중심","개인·가계의 돈 흐름과 자산관리를 다루는 개인 금융 중심","세 영역을 균등하게 다룸"],"a":3},{"t":"금융교육의 이해","q":"우리나라 성인 금융이해력 조사(2024)에 대한 설명으로 옳은 것은?","o":["금융지식 점수가 세 범주 중 가장 낮다.","금융태도 점수가 세 범주 중 가장 낮고 OECD 평균보다도 낮다.","금융역량에서 뚜렷한 성별 차이가 확인되었다.","20대와 60~70대의 금융역량이 30~50대보다 높다."],"a":2},{"t":"교수법","q":"교수-학습과정안 작성에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["도입, 전개, 정리의 3단계로 구성하는 것이 일반적이다.","타인이 이해할 필요는 없으므로 본인만 아는 약어로 작성해도 무방하다.","경험이 풍부하지 않은 교수자일수록 상세하게 작성해야 한다.","도입과 정리는 각각 전체 강의 시간의 5~10%를 넘지 않도록 한다."],"a":2},{"t":"강사윤리","q":"금융교육 전문강사 윤리지침에 <u>위배되는</u> 것은?","o":["사회공헌활동의 일환으로 금융교육을 수행한다.","타당한 근거 없는 비객관적 정보 제공을 삼간다.","마케팅 목적이 아니라면 특정 금융회사를 선전한다.","정치·종교·성별에 관한 차별적 발언을 하지 않는다."],"a":3}]},{"id":"mock2","title":"실전 모의고사 2회","mock":true,"qs":[{"t":"금융의 개관","q":"국민경제의 순환에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["생산물시장은 재화·서비스가, 요소시장은 노동·자본·원재료가 거래되는 시장이다.","개인은 생애 초기에 흑자주체였다가 경제활동이 본격화되면 적자주체가 된다.","정부는 재정적자 시 한국은행 차입이나 국채 발행으로 자금을 조달한다.","가계는 요소시장에서 공급자, 생산물시장에서 수요자가 된다."],"a":2},{"t":"금융의 개관","q":"한국은행 기준금리와 시장금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기준금리는 증권을 담보로 7일간 차입·대출할 때 적용하는 초단기 금리다.","금융통화위원회는 연 8회 회의를 열어 기준금리를 결정한다.","단기금리 기준으로는 콜금리, RP 수익률, CD 수익률이 쓰인다.","장단기금리차가 확대되는 것은 경기 침체 진입의 신호로 해석된다."],"a":4},{"t":"금융의 개관","q":"1억 원을 예금해 1년간 이자 800만 원이 발생했고 이자소득세율이 15.4%일 때, 세후 이자율에 가장 가까운 것은?","o":["약 5.5%","약 6.8%","약 7.2%","약 8.0%"],"a":2},{"t":"금융상품과 금융시장","q":"금융상품의 3대 속성에 대한 설명으로 옳은 것은?","o":["수익성이 좋다는 것은 그만큼 투자 위험이 크다는 의미다.","유동성은 원금을 얼마나 보존할 수 있는가를 뜻한다.","안전성이 높을수록 수익성도 함께 높아지는 것이 일반적이다.","저축상품은 안전성보다 수익성이 높은 상품이다."],"a":1},{"t":"금융상품과 금융시장","q":"금융감독의 유형에 대한 설명으로 옳은 것은?","o":["시스템 감독은 개별 금융회사의 자본적정성을 점검하는 것이다.","영업행위 감독은 공시·정직·공정한 영업관행 유지를 점검하는 소비자보호 중심 감독이다.","건전성 감독은 금융시스템 전체 안정성 확보에 주력하는 가장 넓은 개념이다.","세 유형의 감독은 모두 한국은행이 담당한다."],"a":2},{"t":"저축과 투자","q":"기대수익률이 각각 8%, 14%인 두 자산에 각각 50%씩 투자한 포트폴리오의 기대수익률은?","o":["10%","11%","12%","13%"],"a":2},{"t":"저축과 투자","q":"분산투자와 상관관계에 대한 설명으로 옳은 것은?","o":["구성자산 간 상관계수가 +1에 가까울수록 분산효과가 커진다.","구성자산 간 상관관계가 낮을수록 포트폴리오 리스크가 감소한다.","포트폴리오의 리스크는 항상 개별자산 리스크의 가중평균과 같다.","우산과 우비를 함께 파는 것이 우산과 아이스크림을 함께 파는 것보다 분산효과가 크다."],"a":2},{"t":"저축과 투자","q":"양도성예금증서(CD)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["무기명식으로 발행되어 거액 부동자금 운용수단으로 활용된다.","액면금액보다 할인 발행되는 방식으로 이자가 계산된다.","최소 발행단위는 1,000만 원, 만기는 최소 30일 이상이다.","만기 전 중도환매가 자유롭다."],"a":4},{"t":"저축과 투자","q":"보통주와 우선주에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["우선주는 이익배당과 잔여재산 분배에서 우선적 지위를 갖는다.","우선주에는 의결권이 없다.","액면가액은 상법상 10,000원을 넘을 수 없다.","우리나라에서 우선주 주가는 보통 보통주보다 20~40% 낮게 형성된다."],"a":3},{"t":"저축과 투자","q":"우리나라 주식 유통시장에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["코넥스는 창업 초기 중소기업을 위해 2013년 개장했다.","K-OTC는 한국금융투자협회가 운영하는 제도화된 장외시장이다.","K-OTC는 경쟁매매 방식으로 거래가 이루어진다.","코스닥은 2005년 통합거래소 체제 편입으로 장내시장의 하나가 되었다."],"a":3},{"t":"저축과 투자","q":"기본적 분석과 기술적 분석에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기본적 분석은 증권의 내재가치를 분석해 과소·과대평가를 판단한다.","기술적 분석은 과거 가격·거래량 패턴으로 미래 가격을 예측한다.","효율적 시장가설은 기술적 분석으로만 초과수익이 가능하다고 본다.","기술적 분석은 비이성적·심리적 요인도 가격 결정에 작용한다고 전제한다."],"a":3},{"t":"투자상품","q":"ETF와 ETN에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["ETF는 지수 연동 성과라는 점에서 인덱스펀드와 유사하나 상장되어 유동성이 강화되었다.","일반적으로 액티브 ETF가 패시브 ETF보다 운용보수가 높다.","ETN은 발행주체가 증권사이므로 신용위험에 노출된다.","ETN은 만기가 없어 상장폐지 절차가 존재하지 않는다."],"a":4},{"t":"투자상품","q":"금융투자상품 투자 시 유의사항으로 <u>옳지 않은</u> 것은?","o":["금융회사가 위법 행위를 하지 않았어도 손실이 나면 회사에 책임을 물을 수 있다.","투자에 실패해도 생활에 지장이 없는 여유자금으로 투자해야 한다.","자본시장법은 적합성 원칙, 설명의무, 부당권유 금지를 규정한다.","원금보장형 상품이라도 발행회사가 파산하면 원금손실 가능성이 있다."],"a":1},{"t":"부채관리","q":"고정금리와 변동금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["고정금리는 대출기간 동안 약정금리가 변하지 않는다.","고정금리는 일반적으로 대출 시점의 변동금리보다 낮게 책정된다.","금리 하락이 예상되면 변동금리가 유리할 수 있다.","주택담보대출에서는 혼합형(고정기간부 변동금리)도 널리 이용된다."],"a":2},{"t":"부채관리","q":"원금 100만 원을 1년간 빌리면서 선이자 10만 원을 미리 떼고 90만 원을 받았다면 실질 이자율에 가장 가까운 것은?","o":["약 9%","약 10%","약 11%","약 12%"],"a":3},{"t":"부채관리","q":"P2P(온라인투자연계금융)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2020년 온라인투자연계금융업법 시행 이후 등록업체만 영업할 수 있다.","원금과 수익의 보장이 금지되어 있어 손실 가능성이 있다.","등록 여부, 연체·부실률, 담보와 우선순위를 확인해야 한다.","투자상품은 예금자보호 대상이므로 원금이 보호된다."],"a":4},{"t":"신용관리","q":"신용카드 분실·도난 시 보상에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["회원의 가족·동거인에 의한 부정사용도 전액 보상 대상이다.","카드 뒷면에 서명하지 않은 상태에서 분실해 부정사용된 경우 회원이 책임질 수 있다.","신고 접수일로부터 60일 전 이후 발생한 제3자 부정사용은 보상 신청이 가능하다.","비밀번호 유출로 인한 부정사용은 회원이 책임질 수 있다."],"a":1},{"t":"신용관리","q":"해외에서 신용카드를 사용할 때 유의사항으로 옳은 것은?","o":["원화(DCC)로 결제하면 수수료가 절약되어 유리하다.","출입국정보 활용서비스는 해외 부정사용을 오히려 늘린다.","현지 통화로 결제하는 것이 원화결제보다 유리하다.","긴급대체카드는 귀국 후에도 계속 사용할 수 있다."],"a":3},{"t":"보험","q":"위험의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["순수 위험은 이득의 기회가 없는 상황으로 화재·지진·사망 등이 해당한다.","투기적 위험은 손실과 이득의 기회가 모두 존재한다.","배상책임위험은 제3자에게 피해를 입혀 법적 배상책임을 지는 위험이다.","발생 확률이 1이거나 0인 경우도 위험에 포함된다."],"a":4},{"t":"보험","q":"보험료의 구성에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["영업보험료는 순보험료와 부가보험료로 구성된다.","순보험료는 위험보험료와 저축보험료로 나뉜다.","저축성보험은 납입 원금 전액에 이자가 붙어 은행 예금과 동일하다.","부가보험료는 신계약비와 유지비 등의 재원이다."],"a":3},{"t":"보험","q":"보험계약의 성립과 승낙에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험료 상당액을 받은 때부터 30일 내에 승낙 여부를 통지해야 한다.","30일이 지나도 통지가 없으면 거절한 것으로 본다.","생명보험은 신체검사를 받은 날부터 30일을 기산한다.","승낙 전 사고라도 거절 사유가 없는 한 보험금 지급책임이 있다."],"a":2},{"t":"보험","q":"제3보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["손해보험회사는 취급할 수 없고 생명보험회사만 취급할 수 있다.","상해보험, 질병보험, 간병보험으로 구분된다.","생명보험의 정액보상적 특성과 손해보험의 실손보상적 특성을 동시에 갖는다.","상해사고는 급격하고 우연한 외래의 사고여야 한다."],"a":1},{"t":"보험","q":"보험 가입·유지·지급 단계의 유의사항으로 <u>옳지 않은</u> 것은?","o":["약관 미전달·중요내용 미설명·자필서명 누락 시 성립일부터 3개월 이내 취소할 수 있다.","보험설계사는 고지의무 수령권이 없으므로 청약서 질문표에 사실대로 기재해야 한다.","보험금 청구권의 소멸시효는 5년이며 내용증명으로 중단된다.","손해보험은 직업·직무 변경 등 계약 후 알릴 의무사항이 생기면 지체 없이 알려야 한다."],"a":3},{"t":"인생설계와 연금","q":"재무설계의 과정 순서로 옳은 것은?","o":["재무목표 설정 → 대안 모색 및 실행 → 재무상태 분석 → 점검 및 수정","재무상태 분석 → 재무목표 설정 → 대안 모색 및 실행 → 점검 및 수정","대안 모색 및 실행 → 재무상태 분석 → 재무목표 설정 → 점검 및 수정","재무목표 설정 → 재무상태 분석 → 대안 모색 및 실행 → 점검 및 수정"],"a":4},{"t":"인생설계와 연금","q":"국민연금 유족연금의 최우선 순위 유족 순서로 옳은 것은?","o":["배우자 → 부모 → 자녀 → 조부모 → 손자녀","부모 → 배우자 → 자녀 → 조부모 → 손자녀","자녀 → 배우자 → 부모 → 손자녀 → 조부모","배우자 → 자녀 → 부모 → 손자녀 → 조부모"],"a":4},{"t":"인생설계와 연금","q":"세제적격연금(연금저축)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["연금 수령 시 세금이 전혀 부과되지 않는다.","총급여 5,500만 원 이하는 16.5%의 공제율이 적용된다.","가입기간 5년 이상, 만 55세 이후 10년 이상 나누어 수령해야 한다.","연간 최대 600만 원까지 세액공제를 받을 수 있다."],"a":1},{"t":"인생설계와 연금","q":"농지연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["한국농어촌공사가 만 60세 이상, 영농경력 5년 이상 고령농업인에게 지급한다.","연금 수령 중에도 담보농지를 직접 경작하거나 임대할 수 있다.","부부 중 한 사람이 사망하면 배우자 승계가 불가능하다.","연금채무 상환 시 부족액이 발생해도 상속인에게 청구하지 않는다."],"a":3},{"t":"금융소비자보호","q":"금융소비자보호법상 금융소비자의 기본적 권리에 해당하지 <u>않는</u> 것은?","o":["위법한 영업행위로 인한 재산상 손해로부터 보호받을 권리","합리적인 금융생활을 위해 필요한 교육을 받을 권리","권익 증진을 위해 단체를 조직하고 활동할 권리","금융상품 판매수수료를 면제받을 권리"],"a":4},{"t":"금융소비자보호","q":"OECD 금융소비자보호 10대 원칙에 해당하지 <u>않는</u> 것은?","o":["소비자에 대한 공정하고 공평한 대우","공시와 투명성 강화","금융회사 임직원의 성과급 확대","경쟁적 환경조성을 통한 선택권 보장"],"a":3},{"t":"금융소비자보호","q":"비대면 금융거래 확대에 따른 소비자 문제로 <u>옳지 않은</u> 것은?","o":["디지털역량이 부족한 계층도 접근성이 크게 향상된다.","수익률 상위·계열사 상품이 먼저 노출되어 적합성원칙 구현이 어렵다.","자기책임원칙이 강조되어 소비자에게 책임이 전가될 수 있다.","설명서·약관을 충분히 이해했는지 확인하기 어려워 불완전판매 위험이 있다."],"a":1},{"t":"금융소비자보호","q":"대출사기에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융회사·공공기관을 사칭해 대출을 미끼로 수수료를 편취한다.","보증보험료, 공증료, 공탁금 명목으로 금전을 요구하는 유형이 있다.","정상적인 금융회사는 어떤 명목으로도 대출 전 선입금을 요구하지 않는다.","사기범이 사칭하는 곳은 대부분 실존하지 않는 가공의 금융회사다."],"a":4},{"t":"금융소비자보호","q":"금융사기 피해구제 절차로 <u>옳지 않은</u> 것은?","o":["송금 후에는 금융회사 콜센터나 경찰청(112)에 지급정지를 요청한다.","피해금이 남아 있으면 3일 이내 사건사고사실확인원 작성 후 환급받을 수 있다.","개인정보 노출이 우려되면 금감원 파인의 개인정보노출자 사고예방 시스템에 등록한다.","명의도용방지서비스는 금융감독원이 운영하며 대출 개설 여부를 조회한다."],"a":4},{"t":"금융소비자보호","q":"비대면 금융사기 예방 보안서비스에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["여신거래 안심차단은 모든 금융회사의 여신성 금융거래를 일괄 차단한다.","입금계좌 지정 서비스는 지정하지 않은 계좌로 금액 제한 없이 송금하게 한다.","지연이체 서비스는 이체 시 기본 3시간 후 수취인 계좌에 입금되게 한다.","해외 IP 차단은 해외 접속을 통한 이체거래를 차단한다."],"a":2},{"t":"디지털 금융","q":"디지털 금융 용어에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["디지털 은행(Neobank)은 기존 은행의 인터넷뱅킹과 동일한 개념이다.","스테이블코인은 법정화폐나 실물자산과 연동해 변동성을 최소화한다.","로보어드바이저는 /* ═══════════════ 엔진 ═══════════════ */
const NUM = ["①","②","③","④","⑤"];
const $ = id => document.getElementById(id);
const top_ = $('top'), main = $('main'), nav = $('nav');
const esc = s => s;

const ALL = {};
DATA.chapters.forEach(c => ALL[c.id] = c);
DATA.mocks.forEach(m => ALL[m.id] = m);

/* 세션 동안 유지되는 풀이 상태 (메모리) */
const S = {};
function st(id){
  if(!S[id]){
    const n = ALL[id].qs.length;
    S[id] = {pick:new Array(n).fill(0), idx:0, wrongMode:false, graded:false,
             showResult:false, t0:0, tEnd:0, order:ALL[id].qs.map((_,i)=>i)};
  }
  return S[id];
}

/* ───── 라우터 ───── */
function route(){
  const h = location.hash.replace(/^#\/?/,'');
  if(!h){ renderHome(); return; }
  const id = decodeURIComponent(h);
  if(ALL[id]) renderQuiz(id);
  else { location.hash = ''; }
}
window.addEventListener('hashchange', route);

/* ───── 홈 ───── */
function progressLabel(id){
  const s = S[id]; if(!s) return '';
  const solved = s.pick.filter(v=>v>0).length;
  if(!solved) return '';
  const ok = ALL[id].qs.filter((q,i)=>s.pick[i]===q.a).length;
  return `<span class="done">${solved}/${ALL[id].qs.length} · ${ok}정답</span>`;
}
function renderHome(){
  document.title = '금융교육 전문강사 문제집';
  top_.hidden = true; nav.hidden = true;
  const p1 = DATA.chapters.filter(c=>c.part===1), p2 = DATA.chapters.filter(c=>c.part===2);
  const tot = DATA.chapters.reduce((a,c)=>a+c.qs.length,0);
  const mtot = DATA.mocks.reduce((a,m)=>a+m.qs.length,0);
  const card = c => `<a class="item" href="#/${c.id}">
      <span class="badge">${c.no}</span>
      <span class="txt"><b>${c.title}</b><span class="sub">${c.src}</span></span>
      <span class="cnt">${c.qs.length}문항${progressLabel(c.id)}</span></a>`;
  main.innerHTML = `<div class="home">
    <header>
      <p class="eyebrow">금융감독원 금융교육 전문강사 인증시험</p>
      <h1>표준교재 문제집</h1>
      <p class="hmeta">16개 챕터 <b>${tot}문항</b> · 실전 모의고사 2회 <b>${mtot}문항</b></p>
    </header>
    <p class="sect">PART 1 · 금융의 이해</p>
    <div class="list">${p1.map(card).join('')}</div>
    <p class="sect">PART 2 · 금융교육의 이해</p>
    <div class="list">${p2.map(card).join('')}</div>
    <p class="sect">실전 모의고사 <span class="note">— 해설 없이 정답표만</span></p>
    <div class="list">${DATA.mocks.map((m,i)=>`<a class="item mock" href="#/${m.id}">
        <span class="badge">${i+1}</span>
        <span class="txt"><b>${m.title}</b><span class="sub">전 범위 · 채점 후 정답표</span></span>
        <span class="cnt">${m.qs.length}문항${progressLabel(m.id)}</span></a>`).join('')}</div>
    <footer>출처: 금융감독원 「금융교육 전문강사 표준교재」 개정판(2025.12)<br>
      풀이 기록은 페이지를 새로고침하면 초기화됩니다.</footer>
  </div>`;
  main.scrollTop = 0;
}

/* ───── 퀴즈(챕터 · 모의고사 공통) ───── */
let timerId = null;
function renderQuiz(id){
  const D = ALL[id], s = st(id), isMock = !!D.mock;
  document.title = D.title + ' · 금융교육 전문강사 문제집';
  top_.hidden = false; nav.hidden = false;

  if(isMock && !s.t0) s.t0 = Date.now();
  clearInterval(timerId);
  if(isMock && !s.graded) timerId = setInterval(()=>{
    const t = $('timer'); if(t) t.textContent = fmt(Date.now()-s.t0); else clearInterval(timerId);
  }, 1000);

  top_.innerHTML = `<div class="toprow">
      <button class="tbtn home" onclick="go('')">← 목차</button>
      ${isMock
        ? `<span class="spacer"></span><button class="tbtn" id="bGrade">채점하기</button>`
        : `<button class="tbtn" id="bWrong">오답 모아보기</button><span class="spacer"></span>`}
      <button class="tbtn" id="bReset">다시 풀기</button>
    </div>
    <div class="prog">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="pos" id="pos"></div>
      ${isMock ? '<div class="timer" id="timer">00:00</div>' : ''}
    </div>
    <div class="chname">${D.title}</div>`;

  nav.innerHTML = `<button class="nbtn" id="bPrev">← 이전</button>
                   <button class="nbtn primary" id="bNext">다음 →</button>`;

  if(!isMock) $('bWrong').onclick = ()=>{ s.wrongMode=!s.wrongMode; s.showResult=false; s.idx=0; buildOrder(id); paint(id); };
  if(isMock)  $('bGrade').onclick = ()=>grade(id);
  $('bReset').onclick = ()=>{
    if(s.pick.some(v=>v>0) && !confirm('풀이 기록을 지우고 처음부터 다시 풀까요?')) return;
    delete S[id]; const n = st(id); if(isMock) n.t0 = Date.now(); paint(id);
  };
  $('bPrev').onclick = ()=>prev(id);
  $('bNext').onclick = ()=>next(id);

  buildOrder(id);
  paint(id);
}
function go(h){ location.hash = h ? '#/'+h : '#'; if(!h) history.replaceState(null,'',location.pathname+location.search); route(); }

function fmt(ms){ const t=Math.floor(ms/1000);
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); }

function buildOrder(id){
  const D = ALL[id], s = st(id);
  s.order = s.wrongMode
    ? D.qs.map((_,i)=>i).filter(i => s.pick[i] && s.pick[i] !== D.qs[i].a)
    : D.qs.map((_,i)=>i);
}

function paint(id){
  const D = ALL[id], s = st(id), isMock = !!D.mock, n = s.order.length;

  if(n === 0){
    main.innerHTML = '<div class="empty">오답이 없습니다.<br>전체 문항으로 돌아가세요.</div>';
    $('pos').textContent='0 / 0'; $('fill').style.width='0';
    $('bPrev').disabled=true; $('bNext').disabled=true; bar(id); return;
  }
  if(s.idx >= n) s.idx = n-1;
  if(s.idx < 0) s.idx = 0;
  if(s.showResult){ isMock ? mockResult(id) : chapResult(id); return; }

  const i = s.order[s.idx], Q = D.qs[i], sel = s.pick[i];
  const done = isMock ? s.graded : sel > 0;

  let html = '<div class="card'+(done?' done':'')+'">';
  html += '<p class="tag">'+(s.idx+1)+'. '+Q.t+'</p>';
  html += '<p class="stem">'+Q.q+'</p>';
  if(Q.box) html += '<div class="box">'+Q.box+'</div>';
  html += '<ul class="opts">';
  Q.o.forEach((txt,k)=>{
    const no = k+1; let cls='', mk='';
    if(done){
      if(no===Q.a){ cls=' class="ok"'; mk='✓'; }
      else if(no===sel){ cls=' class="no"'; mk='✗'; }
    } else if(isMock && no===sel){ cls=' class="sel"'; }
    html += '<li'+cls+' data-k="'+no+'"><span class="n">'+NUM[k]+'</span>'+txt+'<span class="mk">'+mk+'</span></li>';
  });
  html += '</ul>';
  if(!isMock){
    const right = done && sel===Q.a;
    html += '<div class="exp"><span class="verdict" style="color:'+(right?'var(--ok)':'var(--no)')+'">'
          + (right ? '정답입니다' : '오답 — 정답은 '+NUM[Q.a-1]) + '</span>'+Q.e+'</div>';
  }
  html += '</div>';
  main.innerHTML = html; main.scrollTop = 0;

  const lock = isMock ? s.graded : done;
  if(!lock){
    main.querySelectorAll('ul.opts li').forEach(li=>{
      li.addEventListener('click', ()=>{
        const k = parseInt(li.dataset.k,10);
        s.pick[i] = (isMock && s.pick[i]===k) ? 0 : k;
        paint(id);
      }, {passive:true});
    });
  }

  $('pos').textContent = (s.idx+1)+' / '+n;
  $('bPrev').disabled = (s.idx===0);
  $('bNext').textContent = (s.idx===n-1)
    ? (isMock ? (s.graded?'정답표':'채점하기') : (s.wrongMode?'완료':'결과 보기'))
    : '다음 →';
  $('bNext').disabled = false;
  bar(id);
}

function bar(id){
  const D = ALL[id], s = st(id), isMock = !!D.mock;
  const solved = s.pick.filter(v=>v>0).length;
  $('fill').style.width = (solved/D.qs.length*100)+'%';
  if(isMock){
    const g = $('bGrade'); if(g) g.textContent = s.graded ? '정답표' : '채점하기 ('+solved+')';
  } else {
    const no = D.qs.filter((q,i)=>s.pick[i] && s.pick[i]!==q.a).length;
    const b = $('bWrong');
    if(b){ b.textContent = s.wrongMode ? '전체 문항' : (no?'오답 '+no:'오답 모아보기');
           b.classList.toggle('on', s.wrongMode); }
  }
}

function chapResult(id){
  const D = ALL[id], s = st(id);
  const solved = s.pick.filter(v=>v>0).length;
  const ok = D.qs.filter((q,i)=>s.pick[i]===q.a).length;
  const no = solved - ok;
  const rate = Math.round(ok/D.qs.length*100);
  main.innerHTML = `<div class="result">
    <p class="rate">${rate}<span>%</span></p>
    <p class="desc"><b>${D.qs.length}문항</b> 중 정답 <b>${ok}</b> · 오답 <b>${no}</b>${solved<D.qs.length?' · 미응답 <b>'+(D.qs.length-solved)+'</b>':''}</p>
    <div class="grid">${D.qs.map((q,i)=>{
      const c = s.pick[i]===0 ? '' : (s.pick[i]===q.a?' c':' w');
      return `<div class="chip${c}" data-i="${i}">${i+1}</div>`;}).join('')}</div>
  </div>`;
  main.scrollTop = 0;
  main.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{
    s.showResult=false; s.idx=s.order.indexOf(parseInt(el.dataset.i,10)); paint(id);
  },{passive:true}));
  $('pos').textContent='결과'; $('bPrev').disabled=false;
  $('bNext').textContent = no ? '오답 모아보기' : '처음으로';
  $('bNext').disabled=false; bar(id);
}

function mockResult(id){
  const D = ALL[id], s = st(id);
  const ok = D.qs.filter((q,i)=>s.pick[i]===q.a).length;
  const solved = s.pick.filter(v=>v>0).length;
  const rate = Math.round(ok/D.qs.length*100);
  main.innerHTML = `<div class="result">
    <p class="rate">${ok}<span> / ${D.qs.length}</span></p>
    <p class="desc">정답률 <b>${rate}%</b> · 미응답 <b>${D.qs.length-solved}</b> · 소요시간 <b>${fmt(s.tEnd-s.t0)}</b></p>
    <p class="secttl">정답표 <span>— 번호를 누르면 해당 문항으로 이동</span></p>
    <table class="key"><thead><tr><th>번호</th><th>영역</th><th>정답</th><th>내 답</th><th>결과</th></tr></thead><tbody>
    ${D.qs.map((q,i)=>{
      const my = s.pick[i] ? NUM[s.pick[i]-1] : '–';
      const good = s.pick[i]===q.a;
      return `<tr data-i="${i}"><td>${i+1}</td><td style="font-size:12.5px;color:var(--sub)">${q.t}</td>
        <td><b>${NUM[q.a-1]}</b></td><td>${my}</td><td class="${good?'o':'x'}">${good?'O':'X'}</td></tr>`;
    }).join('')}</tbody></table></div>`;
  main.scrollTop = 0;
  main.querySelectorAll('tbody tr').forEach(el=>el.addEventListener('click',()=>{
    s.showResult=false; s.idx=parseInt(el.dataset.i,10); paint(id);
  },{passive:true}));
  $('pos').textContent='결과'; $('bPrev').disabled=false;
  $('bNext').textContent='1번으로'; $('bNext').disabled=false; bar(id);
}

function grade(id){
  const s = st(id);
  const un = s.pick.filter(v=>v===0).length;
  if(!s.graded && un>0 && !confirm('아직 '+un+'문항이 미응답입니다. 채점할까요?')) return;
  if(!s.graded){ s.graded=true; s.tEnd=Date.now(); clearInterval(timerId);
                 const t=$('timer'); if(t) t.textContent=fmt(s.tEnd-s.t0); }
  s.showResult=true; paint(id);
}

function next(id){
  const D = ALL[id], s = st(id), isMock = !!D.mock;
  if(s.showResult){
    if(isMock){ s.showResult=false; s.idx=0; paint(id); return; }
    const no = D.qs.filter((q,i)=>s.pick[i] && s.pick[i]!==q.a).length;
    if(no){ s.wrongMode=true; s.showResult=false; s.idx=0; buildOrder(id); paint(id); }
    else go('');
    return;
  }
  if(s.idx === s.order.length-1){
    if(isMock){ grade(id); }
    else if(s.wrongMode){ s.wrongMode=false; s.idx=0; buildOrder(id); paint(id); }
    else { s.showResult=true; paint(id); }
  } else { s.idx++; paint(id); }
}
function prev(id){
  const s = st(id);
  if(s.showResult){ s.showResult=false; paint(id); return; }
  if(s.idx>0){ s.idx--; paint(id); }
}

/* ───── 스와이프 · 키보드 ───── */
let sx=0, sy=0;
main.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
main.addEventListener('touchend', e=>{
  if(nav.hidden) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.8){
    const b = dx<0 ? $('bNext') : $('bPrev'); if(b && !b.disabled) b.click();
  }
}, {passive:true});
document.addEventListener('keydown', e=>{
  if(nav.hidden){ return; }
  if(e.key==='ArrowRight'){ const b=$('bNext'); if(b&&!b.disabled) b.click(); }
  else if(e.key==='ArrowLeft'){ const b=$('bPrev'); if(b&&!b.disabled) b.click(); }
  else if(e.key==='Escape'){ go(''); }
  else if(['1','2','3','4'].includes(e.key)){
    const li = main.querySelector('ul.opts li[data-k="'+e.key+'"]'); if(li) li.click();
  }
});

route();
</script>
</body>
</html>
