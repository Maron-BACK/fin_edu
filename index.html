<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="금융감독원 금융교육 전문강사 인증시험 대비 문제집 — 표준교재 16개 챕터 289문항 + 실전 모의고사 2회 80문항">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="금융강사 문제집">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<title>금융교육 전문강사 문제집</title>
<style>
:root{
  --bg:#fff; --card:#fff; --ink:#16181a; --sub:#71777d; --line:#e6e8ec;
  --soft:#f4f6f8; --accent:#1f5f8b; --accent-soft:#eaf2f8;
  --ok:#12805a; --ok-bg:#e6f6ef; --ok-line:#8fd6ba;
  --no:#c8372a; --no-bg:#fdeeec; --no-line:#f2b3aa;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111315; --card:#191c1f; --ink:#e9ebed; --sub:#8b9298; --line:#2a2f34;
    --soft:#212529; --accent:#7fb6da; --accent-soft:#1b2b36;
    --ok:#4ec99a; --ok-bg:#12332a; --ok-line:#2f6b55;
    --no:#f08375; --no-bg:#3a1f1c; --no-line:#7a3a33;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.62;-webkit-text-size-adjust:100%;
  overscroll-behavior-y:contain;display:flex;flex-direction:column}

/* ───── 상단바 ───── */
.top{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:calc(var(--safe-t) + 10px) 14px 8px;border-bottom:1px solid var(--line);flex:none}
.toprow{display:flex;gap:6px;align-items:center}
.tbtn{flex:none;font-family:inherit;font-size:13px;font-weight:600;padding:8px 12px;min-height:36px;
  border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;touch-action:manipulation;white-space:nowrap}
.tbtn:active{background:var(--soft)}
.tbtn.on{background:var(--no);border-color:var(--no);color:#fff}
.tbtn.home{padding:8px 11px}
.spacer{flex:1}
.prog{margin-top:9px;display:flex;align-items:center;gap:9px}
.track{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);border-radius:2px;transition:width .28s ease}
.pos,.timer{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.chname{font-size:12.5px;color:var(--sub);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 8px}

/* ───── 홈 ───── */
.home{max-width:640px;margin:0 auto;padding-bottom:40px}
.home header{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:4px}
.eyebrow{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.04em;margin:0 0 6px}
.home h1{font-size:25px;margin:0 0 7px;letter-spacing:-.02em;line-height:1.3}
.hmeta{margin:0;font-size:13.5px;color:var(--sub)}
.hmeta b{color:var(--ink)}
.sect{margin:28px 0 10px;font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.03em}
.sect .note{font-weight:400;color:var(--sub);letter-spacing:0}
.home .list{display:flex;flex-direction:column;gap:8px}
.home a.item{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
  border-radius:12px;background:var(--card);text-decoration:none;color:inherit;min-height:62px}
.home a.item:active{background:var(--soft)}
.home .badge{flex:none;width:30px;height:30px;border-radius:9px;background:var(--soft);color:var(--sub);
  font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center}
.home a.mock .badge{background:var(--accent);color:#fff}
.home .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.home .txt b{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.home .sub{font-size:12.5px;color:var(--sub);margin-top:2px}
.home .cnt{flex:none;font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right}
.home .cnt .done{display:block;color:var(--accent);font-weight:700;font-size:11.5px}
.home footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}

/* ───── 문제 ───── */
.card{max-width:640px;margin:0 auto}
.tag{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.03em;margin:0 0 8px}
.stem{margin:0;font-size:18px;font-weight:650;line-height:1.55;letter-spacing:-.015em}
.stem u{text-underline-offset:3px;text-decoration-thickness:2px}
.box{margin:14px 0 0;padding:13px 15px;background:var(--soft);border-radius:10px;font-size:15px;line-height:1.6}
ul.opts{list-style:none;margin:18px 0 0;padding:0}
ul.opts li{position:relative;margin:9px 0;padding:13px 42px;min-height:52px;
  border:1.5px solid var(--line);border-radius:12px;background:var(--card);
  font-size:16px;line-height:1.5;cursor:pointer;touch-action:manipulation;transition:border-color .12s,background .12s}
ul.opts li:active{background:var(--soft)}
ul.opts li .n{position:absolute;left:15px;top:13px;color:var(--sub);font-weight:700;font-size:15px}
ul.opts li .mk{position:absolute;right:14px;top:12px;font-size:17px;font-weight:800;opacity:0}
ul.opts li.ok{background:var(--ok-bg);border-color:var(--ok-line)}
ul.opts li.ok .n,ul.opts li.ok .mk{color:var(--ok);opacity:1}
ul.opts li.no{background:var(--no-bg);border-color:var(--no-line)}
ul.opts li.no .n,ul.opts li.no .mk{color:var(--no);opacity:1}
ul.opts li.sel{background:var(--accent-soft);border-color:var(--accent)}
ul.opts li.sel .n{color:var(--accent);font-weight:800}
.card.done ul.opts li{cursor:default}
.exp{margin:18px 0 0;padding:14px 15px;border-radius:10px;background:var(--soft);
  font-size:14.5px;line-height:1.65;color:var(--sub);display:none;animation:up .22s ease}
.exp b{color:var(--ink);font-weight:700}
.exp .verdict{display:block;font-size:13px;font-weight:800;letter-spacing:.03em;margin-bottom:5px}
.card.done .exp{display:block}
@keyframes up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ───── 결과 ───── */
.result{max-width:640px;margin:0 auto;text-align:center;padding:30px 4px 40px}
.rate{font-size:54px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:0}
.rate span{font-size:25px;font-weight:700;color:var(--sub)}
.desc{margin:14px 0 0;font-size:15.5px;color:var(--sub)}
.desc b{color:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 0}
.chip{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--sub);
  cursor:pointer;touch-action:manipulation}
.chip.c{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.chip.w{background:var(--no-bg);border-color:var(--no-line);color:var(--no)}
.secttl{margin:26px 0 0;font-size:14px;font-weight:800;text-align:left}
.secttl span{font-weight:400;color:var(--sub);font-size:12.5px}
table.key{width:100%;border-collapse:collapse;font-size:14px;margin:14px 0 0}
table.key th,table.key td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
table.key th{color:var(--sub);font-size:12.5px;font-weight:700}
table.key td.o{color:var(--ok);font-weight:800}
table.key td.x{color:var(--no);font-weight:800}
table.key tbody tr{cursor:pointer}
.empty{max-width:640px;margin:0 auto;text-align:center;padding:60px 10px;color:var(--sub);font-size:15px}

/* ───── 하단 네비 ───── */
.nav{flex:none;position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:10px 16px calc(var(--safe-b) + 10px);display:flex;gap:10px;max-width:672px;margin:0 auto;width:100%}
.nbtn{flex:1;font-family:inherit;font-size:15.5px;font-weight:650;padding:14px 10px;min-height:50px;
  border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  cursor:pointer;touch-action:manipulation}
.nbtn:active{background:var(--soft)}
.nbtn:disabled{opacity:.32;cursor:default}
.nbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.nbtn.primary{color:#0d1417}}
[hidden]{display:none!important}
@media (max-width:359px){.tbtn{font-size:12px;padding:8px 9px}}
</style>
</head>
<body>

<div class="top" id="top"></div>
<main id="main"></main>
<div class="nav" id="nav" hidden></div>

<script>

const DATA = {"chapters":[{"id":"p1c01","part":1,"no":"01","title":"금융의 역할과 주요 금융지표","src":"pp.3–24","qs":[{"t":"경제의 순환과 금융","q":"국민경제의 순환에 관한 설명으로 옳은 것은?","o":["가계는 생산물시장에서는 공급자, 요소시장에서는 수요자가 된다.","기업은 생산물시장에서는 공급자, 요소시장에서는 수요자가 된다.","요소시장은 자동차·영화와 같이 생활에 필요한 재화와 서비스가 거래되는 시장이다.","정부는 공공서비스를 제공하는 주체이므로 시장에 수요자로만 참여한다."],"a":2,"e":"기업은 재화·서비스를 파는 생산물시장에서 공급자, 노동·자본을 사는 요소시장에서 수요자다. 가계는 그 반대. ③은 생산물시장 설명이고, 정부는 수요자·공급자 양쪽으로 참여한다."},{"t":"경제의 순환과 금융","q":"금융의 의미와 역할에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융은 돈을 빌려주고 빌려오는 행위를 의미한다.","금융이 필요한 근본적 이유는 돈이 필요한 시기와 돈을 버는 시기가 일치하지 않기 때문이다.","생애주기에서 사회 초년기에는 대체로 흑자주체, 은퇴기에는 적자주체가 된다.","금융은 흑자주체의 여윳돈을 적자주체가 쓸 수 있게 해 돈의 이용가치를 높인다."],"a":3,"e":"생애 초기에는 교육·결혼·주택자금 수요가 소득보다 커 <b>적자주체</b>이고, 경제활동이 본격화되며 <b>흑자주체</b>로 바뀐다. 순서가 반대다."},{"t":"경제의 순환과 금융","q":"교재에서 제시한 금융의 기능에 해당하지 <u>않는</u> 것은?","o":["자금의 중개","지급결제기능","위험관리 수단 제공","물가수준의 직접 결정"],"a":4,"e":"금융의 기능은 ①자금의 중개 ②지급결제 ③위험관리 수단 제공 ④시장규율의 네 가지다."},{"t":"경제의 순환과 금융","q":"다음 사례가 설명하는 금융의 기능은?","box":"부실기업이 발행한 채권은 우량기업 채권보다 금리가 높게 책정되어 조달비용이 커진다. 또 재무건전성을 해칠 것으로 평가되는 신규 사업계획을 발표하면 그 기업의 주가와 채권가격이 즉각 하락한다.","o":["자금의 중개","시장규율 기능","지급결제기능","긍정적 외부효과"],"a":2,"e":"주식·채권 가격이 발행주체의 건전성을 반영해 변동함으로써 자금수요자를 감시하는 것이 시장규율 기능이다."},{"t":"금리(이자율)","q":"은행에서 1억 원을 빌리고 1년간 자금 사용 대가로 800만 원을 지급했다. 옳은 것은?","o":["이자는 8%, 이자율은 800만 원이다.","이자는 800만 원, 이자율은 8%이다.","이자율은 원금에서 이자를 뺀 금액을 말한다.","이자율은 기간과 무관하게 표시된다."],"a":2,"e":"이자는 차입 대가로 지급하는 <b>금액</b>(800만 원), 이자율은 원금 대비 이자의 <b>백분율</b>(800만/1억=8%). 보통 1년 기준으로 표시한다."},{"t":"금리(이자율)","q":"1년 만기 정기예금의 명목금리가 4%, 같은 기간 물가상승률이 5%였다. 옳은 것은?","o":["실질금리는 9%로 구매력이 크게 증가하였다.","실질금리는 4%로 물가와 무관하게 이익이 발생하였다.","실질금리는 –1%로 실질적으로는 손해가 발생하였다.","실질금리는 5%로 명목금리보다 항상 높다."],"a":3,"e":"<b>실질 이자율 = 명목 이자율 − 인플레이션율</b> = 4% − 5% = −1%. 물가상승이 명목금리를 웃돌면 실질금리는 마이너스가 된다."},{"t":"금리(이자율)","q":"1억 원 예금에서 1년간 이자 1,000만 원이 발생했고 이자소득세율이 20%일 때, 세금을 고려한 실제 이자율은?","o":["6%","8%","10%","12%"],"a":2,"e":"세전 10%지만 세율 20%를 제하면 실수령 이자는 800만 원 → 8%. 이자소득의 실질가치는 물가상승률과 세금을 함께 봐야 한다."},{"t":"금리(이자율)","q":"한국은행 기준금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융통화위원회가 연 8회 회의를 열어 결정한다.","금융기관과 증권을 담보로 7일간 차입·대출할 때 적용하는 초단기 금리이다.","경제가 침체되었다고 판단되면 기준금리를 인상한다.","기준금리가 변하면 단기금리가 같은 방향으로 움직이고 이어서 장기금리도 조정된다."],"a":3,"e":"경제 과열·물가상승이 예상되면 인상, 경기 침체 시에는 <b>인하</b>한다."},{"t":"금리(이자율)","q":"기준금리 인하가 경제에 미치는 영향으로 <u>옳지 않은</u> 것은?","o":["부채를 진 가계·기업의 상환부담이 줄어 투자·소비 여력이 커진다.","금융자산가의 이자소득이 줄고 은퇴자의 연금소득이 감소할 수 있다.","대출을 늘려 주식·주택을 사려는 동기가 커져 자산가격 거품과 가계부채 확대를 부를 수 있다.","소비와 투자가 위축되어 물가가 하락하는 효과가 확실하게 나타난다."],"a":4,"e":"금리 인하는 소비·투자를 늘려 오히려 <b>인플레이션</b>을 부를 수 있다. 소비 위축·물가 하락은 금리 인상의 효과다."},{"t":"금리(이자율)","q":"코픽스(COFIX)에 대한 설명으로 옳은 것은?","o":["한국은행이 매월 산출·발표하는 정책금리이다.","전국은행연합회가 국내 8개 은행의 자금조달 관련 기초자료로 산출한 자금조달비용지수이다.","은행이 대출로 벌어들이는 목표 이익률을 지수화한 것이다.","2010년 도입 이후 가계대출은 대부분 CD 유통수익률 연동으로 바뀌었다."],"a":2,"e":"코픽스는 은행연합회가 8개 은행의 조달비용 자료로 산출한다. 도입 이후 가계대출금리는 CD 연동에서 <b>수신금리(조달비용) 연동</b>으로 주류가 바뀌었다."},{"t":"금리(이자율)","q":"은행의 대출금리 결정 체계에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["대출금리는 준거금리에 가산금리를 더하고 가감조정금리를 반영해 결정된다.","가산금리에는 업무원가, 리스크 관리비용, 법적 비용, 목표 이익률 등이 포함된다.","법적 비용은 신용보증기금·기술보증기금 등에 내는 출연료와 교육세를 말한다.","대출자는 신용도가 개선되어도 이미 체결된 대출의 금리인하를 요구할 수 없다."],"a":4,"e":"대출자는 직업·소득·신용도 변동을 이유로 <b>금리인하요구권</b>을 행사할 수 있고, 급여이체·카드실적 등으로 우대금리도 받을 수 있다."},{"t":"금리(이자율)","q":"장단기 시장금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["단기금리 기준으로는 콜금리, 환매조건부채권(RP) 수익률, 양도성예금증서(CD) 수익률이 쓰인다.","장기금리는 1년 이상의 국채·회사채·금융채 수익률이 기준이 된다.","일반적으로 단기금리가 장기금리보다 높다.","장기금리가 더 높은 이유는 물가상승 기대, 소득상승, 금리변동 위험을 반영하기 때문이다."],"a":3,"e":"대체로 <b>장기금리가 단기금리보다 높다</b>. 만기가 길수록 물가·금리변동 위험을 더 부담하기 때문이다."},{"t":"금리(이자율)","q":"장단기금리차에 대한 해석으로 옳은 것은?","o":["장단기금리차의 축소가 지속되면 향후 경기 침체 진입 가능성을 시사한다.","장단기금리차의 확대는 경기 침체의 신호로 해석된다.","장단기금리차는 중앙은행의 통화정책과 무관하게 결정된다.","경기 침체가 예상되면 장기자금 수요가 늘어 장기금리가 상승한다."],"a":1,"e":"축소 지속 = 침체 신호, 확대 = 확장국면 진입 가능성. 침체가 예상되면 장기자금 수요가 줄어 장기금리는 <b>하락</b>한다."},{"t":"환율","q":"환율의 개념과 표시방법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["환율은 한 나라 통화와 다른 나라 통화 간의 교환비율이다.","우리나라는 'US$1 = 1,300원'처럼 자국통화표시법을 사용한다.","유로지역은 '€1 = US$1.2'처럼 외국통화표시법을 사용한다.","환율은 정부가 물가수준을 고려해 직접 고시하는 가격이다."],"a":4,"e":"환율은 외환시장에서 외화의 <b>수요와 공급</b>에 의해 결정된다."},{"t":"환율","q":"원/달러 환율이 1,000원에서 1,300원으로 상승했을 때 나타나는 현상으로 <u>옳지 않은</u> 것은?","o":["원화 가치가 하락한 것으로 '원화 약세'라고 한다.","달러로 환산한 수출품 가격이 낮아져 수출이 늘어난다.","수입품의 원화 환산 가격이 올라 수입이 줄어든다.","외화표시 부채를 보유한 기업의 상환부담이 줄어든다."],"a":4,"e":"환율 상승은 외화부채의 원화 환산액을 키워 <b>부담이 늘어난다</b>. 금융비용이 줄어드는 것은 환율 하락 시다."},{"t":"환율","q":"미국 금리가 그대로인 상태에서 한국은행이 기준금리를 인상했을 때 예상되는 경로로 옳은 것은?","o":["원화표시 자산 수익률 상승 → 해외자본 유입 → 원/달러 환율 하락","원화표시 자산 수익률 상승 → 해외자본 유출 → 원/달러 환율 상승","국내 금리 상승 → 원화 수요 감소 → 원화 약세","국내 금리 상승 → 수출가격 하락 → 수출 증가"],"a":1,"e":"금리가 오르면 원화자산 수익률이 상대적으로 높아져 자본이 유입되고 원화가치가 올라(환율 하락), 수입은 늘고 수출은 줄어드는 방향으로 작용한다."},{"t":"주가지수","q":"우리나라 주가지수에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["코스피지수는 1980년 1월 4일을 기준시점(기준지수 100)으로 산출한다.","코스피200은 대표성 있는 200종목으로 구성되며 1994년 6월부터 발표되고 있다.","코스닥지수는 기준지수가 낮다는 지적에 따라 2004년 1월 기준지수를 1,000으로 변경하였다.","KRX300은 유가증권시장 상장종목만을 대상으로 선정한 300개 우량종목이다."],"a":4,"e":"KRX300은 <b>유가증권시장과 코스닥시장</b> 상장종목 중에서 선정한 300종목이다(2010.1.4 기준지수 1,000, 2018.2.5부터 발표)."},{"t":"주가지수","q":"주요국 주가지수에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["다우존스 산업평균지수(DJIA)는 30개 대형 기업으로 구성되며 단순가격평균 방식을 쓴다.","나스닥은 1971년부터 정보통신·산업기술 기업 주식을 전산으로 거래하는 시장이다.","S&P500지수는 NYSE 종목만으로 구성되어 시장 대표성이 제한된다.","아시아의 대표 지수로는 일본 니케이, 홍콩 항셍, 중국 상하이종합지수가 있다."],"a":3,"e":"S&P500은 NYSE 종목이 많지만 NASDAQ·AMEX 종목도 포함해 산출하므로 시장 상황을 잘 반영한다는 장점이 있다."},{"t":"주가지수","q":"주가의 고평가·저평가 판단 지표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["PER은 주가를 1주당 순이익으로 나눈 값으로, 낮을수록 저평가로 본다.","PBR은 주가를 1주당 순자산액으로 나눈 값이며, 순자산액은 자산에서 부채를 뺀 금액이다.","PBR이 높다는 것은 재무상태에 비해 주가가 높은 수준임을 뜻한다.","2025년 6월 기준 우리나라 주식시장의 PBR은 대만·일본보다 높은 수준이다."],"a":4,"e":"2025년 6월 기준 한국 PBR은 약 1.0으로 대만 2.4, 일본 1.6, 신흥국 평균 1.8보다 크게 낮다(코리아 디스카운트)."}]},{"id":"p1c02","part":1,"no":"02","title":"금융상품과 금융시장","src":"pp.25–44","qs":[{"t":"금융상품의 속성","q":"금융상품의 3대 속성에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["안전성은 원금을 어느 정도 보존할 수 있는가를 나타낸다.","수익성은 이자 수익이나 가격 상승 이익을 기대할 수 있는 정도를 말한다.","유동성은 투자한 돈을 얼마나 쉽고 빠르게 현금으로 바꿀 수 있는가를 나타낸다.","수익성이 높은 상품은 일반적으로 투자 위험도 낮다."],"a":4,"e":"<b>수익성이 좋다는 것은 그만큼 투자 위험이 크다</b>는 뜻이다. 안전성·수익성·유동성은 서로 상충관계에 있다."},{"t":"저축상품","q":"저축상품에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["저축상품은 수익성보다 안전성과 유동성이 높은 금융상품이다.","보통예금은 이자가 없거나 매우 낮은 대신 입출금·송금이 자유롭다.","정기적금은 목돈을 한꺼번에 예치해 이자를 받는 거치식 상품이다.","정기예금·정기적금은 만기 전 해약 시 약정이자보다 훨씬 낮은 이자를 받는다."],"a":3,"e":"거치식으로 목돈을 불리는 것은 <b>정기예금</b>이고, <b>정기적금</b>은 일정 기간 정기적으로 납입해 목돈을 만드는 적립식 상품이다."},{"t":"대출상품","q":"담보대출과 신용대출에 대한 설명으로 옳은 것은?","o":["담보대출은 일반적으로 신용대출보다 대출금리가 낮다.","신용대출은 저당권을 설정하고 돈을 빌려주는 방식이다.","담보대출은 금융회사 입장에서 회수 위험이 크므로 금리가 높다.","신용대출은 담보 가치의 범위 내에서만 실행된다."],"a":1,"e":"담보대출은 채무불이행 시 담보자산을 매각해 원금을 회수할 수 있어 위험이 작으므로 <b>금리가 낮다</b>."},{"t":"금융투자상품","q":"금융투자상품의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["'투자성'이란 투자한 원금의 손실 가능성이 있는 경우를 말한다.","원금까지만 손실이 발생할 가능성이 있는 것에는 주식, 채권, 펀드 등이 있다.","원금을 초과하여 손실이 발생할 가능성이 있는 것으로 파생상품이 있다.","예금은 원금손실 가능성이 있으므로 금융투자상품에 해당한다."],"a":4,"e":"예금은 원금손실 가능성이 없는 <b>비금융투자상품</b>이다. 원금손실 가능성 유무로 금융투자상품과 비금융투자상품을 나눈다."},{"t":"금융투자상품","q":"주식·채권·펀드에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["주식은 주식회사의 자본을 구성하는 단위로 주주의 권리와 지분을 나타낸다.","채권은 정기적으로 이자를 지급하고 만기에 원금을 상환할 것을 명시한 유가증권이다.","채권 수익률은 신용등급이 높을수록 높아진다.","펀드는 소액으로도 전문가에 의한 분산투자에 참여할 수 있는 장점이 있다."],"a":3,"e":"신용등급이 높을수록 부도위험이 작으므로 요구수익률이 낮다. 즉 <b>신용등급이 높을수록 채권 수익률은 낮다</b>."},{"t":"보험상품","q":"상해·질병보험의 실손형 특약과 정액형 특약에 대한 설명으로 옳은 것은?","o":["실손형은 여러 보험에 중복 가입하면 각각 전액을 중복 지급받을 수 있다.","실손형은 여러 곳에 가입해도 실제 치료비를 초과해 받을 수 없다.","정액형은 실제 발생한 치료비 범위 내에서만 지급된다.","실손형과 정액형 모두 중복 가입 시 지급액이 비례 삭감된다."],"a":2,"e":"실손형은 <b>실제 치료비 범위 내</b>에서만 보상되므로 중복 가입 실익이 없고, 정액형은 약정 금액을 <b>중복 수령</b>할 수 있다."},{"t":"직접금융과 간접금융","q":"직접금융시장과 간접금융시장에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["직접금융은 자금수요자가 발행한 증권을 공급자가 직접 매수하는 방식이다.","회사채·주식 발행을 통한 자금조달이 직접금융의 대표적 형태이다.","은행 예금자는 자신의 돈이 누구에게 대출되는지 알 수 있다.","간접금융에서는 금융회사가 예금을 받아 필요한 사람에게 대출한다."],"a":3,"e":"은행 예금자는 자금이 누구에게 대출되는지 <b>알 수 없다</b>. 자금 흐름을 알 수 있는 것은 주식·채권을 직접 매입하는 직접금융이다."},{"t":"단기·장기금융시장","q":"단기금융시장(자금시장)과 장기금융시장(자본시장)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["만기 1년 이내 상품이 거래되는 시장을 단기금융시장이라 한다.","단기금융시장에는 콜시장, CD시장, RP매매시장, 기업어음시장 등이 있다.","단기금융상품은 만기가 짧아 금리변동에 따른 손실위험이 상대적으로 작다.","장기금융시장에는 콜시장과 단기사채시장이 포함된다."],"a":4,"e":"콜시장·단기사채시장은 <b>단기금융시장</b>이다. 장기금융시장(자본시장)에는 주식시장, 채권시장, 자산유동화증권시장이 있다."},{"t":"발행시장과 유통시장","q":"발행시장과 유통시장에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["발행시장은 주식·채권을 새로 발행해 투자자로부터 자금을 조달하는 시장이다.","유통시장은 이미 발행된 증권이 투자자들 사이에서 거래되는 시장이다.","유통시장에서 시장가격이 결정되며 만기가 있는 상품도 쉽게 현금화할 수 있다.","발행시장과 유통시장은 서로 독립적이어서 한쪽의 부진이 다른 쪽에 영향을 주지 않는다."],"a":4,"e":"유통이 원활하지 않은 증권은 발행시장에서도 인기가 없고 그 반대도 마찬가지로, 두 시장은 <b>밀접하게 연결</b>되어 있다."},{"t":"장내시장과 장외시장","q":"장내시장과 장외시장에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["장내시장은 거래장소와 형식이 표준화되어 거래가 집중된다.","장내시장은 가격·거래정보가 공개되고 거래상대방의 익명성이 보장된다.","장외시장은 상대방 간 협의에 따라 표준화되지 않은 상품을 매매한다.","우리나라는 증권거래소·선물거래소·코스닥증권시장을 각각 별도로 운영하고 있다."],"a":4,"e":"세 시장은 <b>한국거래소(KRX)로 통합</b>되어 증권과 파생상품의 거래·가격형성을 담당한다."},{"t":"금융회사","q":"우리나라 특수은행에 해당하지 <u>않는</u> 것은?","o":["한국산업은행","한국수출입은행","중소기업은행","상호저축은행"],"a":4,"e":"상호저축은행은 <b>비은행 예금취급기관</b>이다. 특수은행에는 산업은행·수출입은행·중소기업은행·농협은행·수협은행이 있다."},{"t":"금융회사","q":"자본시장법상 금융투자업의 6가지 구분에 해당하지 <u>않는</u> 것은?","o":["투자매매업","집합투자업","신탁업","보험중개업"],"a":4,"e":"자본시장법상 금융투자업은 투자매매업·투자중개업·집합투자업·투자일임업·투자자문업·<b>신탁업</b>의 6가지다."},{"t":"금융회사","q":"금융투자회사에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["증권회사는 유가증권의 발행을 주선하고 매매를 중개하는 것이 주요 업무다.","자산운용사는 펀드를 설정·운용하고 그 손익을 투자자에게 배분한다.","투자일임업은 투자자에게 투자판단을 자문만 해주는 업무이다.","제도권 금융회사인지는 금융감독원의 '제도권 금융회사 조회 서비스'로 확인할 수 있다."],"a":3,"e":"자문만 해주는 것은 <b>투자자문업</b>이고, <b>투자일임업</b>은 투자판단의 전부 또는 일부를 일임받아 직접 운용하는 업무다."},{"t":"금융회사","q":"보험회사에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["생명보험은 사람의 생존과 사망에 관해 약정한 보험금을 지급한다.","생명보험과 손해보험은 원칙적으로 서로 겸업하지 않는다.","질병보험·상해보험·간병보험은 제3보험으로 생·손보사가 모두 참여할 수 있다.","재보험은 생명보험에 속하며 우리나라에는 다수의 재보험사가 있다."],"a":4,"e":"재보험은 <b>손해보험</b>에 속하며, 우리나라의 전업 재보험사는 <b>코리안리</b>가 유일하다."},{"t":"금융회사","q":"여신전문금융회사에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["고객 예금이 아니라 채권 발행 등으로 자금을 조달해 돈을 빌려준다.","신용카드회사, 리스회사, 할부금융회사, 신기술금융회사가 이에 속한다.","할부금융회사는 이름에 주로 '캐피털'이 붙는 경우가 많다.","상호저축은행은 대표적인 여신전문금융회사이다."],"a":4,"e":"상호저축은행은 예금을 받아 운용하는 <b>수신 기능이 있는</b> 비은행 예금취급기관으로, 여신전문금융회사가 아니다."},{"t":"금융유관기관","q":"금융감독원에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["1999년 은행·증권·보험감독원과 신용관리기금이 통합되어 설립되었다.","정부조직의 일부로 편입되어 행정부의 지휘를 받는 기관이다.","금융회사 검사는 임점검사와 업무보고서 기반 상시감시를 병행한다.","금융분쟁 조정 등 금융소비자 보호업무를 수행한다."],"a":2,"e":"금융감독원은 정치적 압력이나 행정부 영향력에 흔들리지 않도록 <b>정부조직과 독립된 특수법인</b>으로 설립되었다."},{"t":"금융유관기관","q":"금융감독의 유형에 대한 설명으로 옳은 것은?","o":["시스템 감독은 개별 금융회사의 자본적정성을 점검하는 감독이다.","건전성 감독은 금융시스템 전체의 안정성 확보에 주력하는 가장 넓은 개념이다.","영업행위 감독은 공시·정직·공정한 영업관행 유지를 점검하는 소비자보호 중심 감독이다.","세 가지 감독은 서로 무관하게 별개로 운영된다."],"a":3,"e":"<b>시스템 감독</b>이 가장 넓은 개념(금융시스템 안정성), <b>건전성 감독</b>은 개별 회사의 재무건전성·자본적정성, <b>영업행위 감독</b>은 소비자 보호 중심이다."},{"t":"금융유관기관","q":"예금보험공사의 예금자보호 대상에 해당하지 <u>않는</u> 것은?","o":["은행","상호저축은행","보험회사","새마을금고"],"a":4,"e":"새마을금고·신협·농수협 지역조합의 예금은 예금보험공사가 아니라 <b>각 중앙회가 설립한 기금</b>을 통해 보호된다."},{"t":"금융유관기관","q":"다음 설명에 해당하는 금융유관기관은?","box":"과중한 채무와 신용문제로 어려움을 겪는 사람에게 신속채무조정·사전채무조정·개인워크아웃 등 채무조정을 지원하고, 법원과 연계해 개인회생·파산면책 신청도 돕는 법정기구이다.","o":["서민금융진흥원","신용회복위원회","예금보험공사","저축은행중앙회"],"a":2,"e":"채무조정 3종(신속채무조정·사전채무조정·개인워크아웃)은 <b>신용회복위원회</b>의 대표 업무다. 성실 이행자에게 소액대출·소액신용카드도 지원한다."},{"t":"금융유관기관","q":"한국은행의 역할로 <u>옳지 않은</u> 것은?","o":["화폐를 발행하는 발권은행이다.","금융통화위원회가 연 8회 기준금리를 결정한다.","금융회사의 예금을 받고 대출을 해주는 '은행의 은행'이다.","금융회사에 대한 검사·제재와 금융분쟁 조정을 담당한다."],"a":4,"e":"금융회사 검사·제재와 분쟁조정은 <b>금융감독원</b>의 업무다. 한국은행은 발권, 통화신용정책, 은행의 은행, 정부의 은행 기능을 수행한다."}]},{"id":"p1c03","part":1,"no":"03","title":"저축상품과 투자상품","src":"pp.45–77","qs":[{"t":"저축과 투자","q":"저축과 투자에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["저축은 예정된 일자에 원금과 이자를 확실하게 회수하는 것을 목적으로 한다.","사후적 수익률은 실제로 실현된 수익률이므로 결과적으로 불확실성이 없다.","투자의사결정 시점에서 더 중요한 것은 사후적 수익률이다.","투자는 반드시 필요한 생활자금을 제외한 여유자금으로 하는 것이 원칙이다."],"a":3,"e":"투자 결정 시점에 중요한 것은 <b>사전적 수익률(기대수익률)</b>이다. 사후적 수익률은 이미 확정된 결과일 뿐이다."},{"t":"단리와 복리","q":"단리와 복리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["단리는 원금에 대해서만 약정 이율을 적용해 이자를 계산한다.","복리는 이자에 다시 이자가 붙는 방식이다.","복리는 투자기간이 길어질수록 원리금이 기하급수적으로 증가한다.","복리효과는 저축에만 적용되고 부채에는 적용되지 않는다."],"a":4,"e":"부채도 복리로 기하급수적으로 늘어난다. 연 24% 연체금리라면 약 3년 만에 갚을 금액이 두 배가 되는 <b>'복리의 저주'</b>가 발생한다."},{"t":"단리와 복리","q":"'72의 법칙'을 이용할 때, 연 6% 복리상품에 넣은 원금이 두 배가 되는 데 걸리는 기간은?","o":["약 6년","약 12년","약 18년","약 24년"],"a":2,"e":"72 ÷ 수익률 = 원금이 두 배가 되는 기간. 72 ÷ 6 = <b>12년</b>. 다만 근사식이므로 고금리 구간에서는 오차가 커진다."},{"t":"수익률과 리스크","q":"이자율이 연 5%이고 이자소득에 20%가 과세될 때 세후수익률은?","o":["3%","4%","4.5%","5%"],"a":2,"e":"세후수익률 = 세전수익률 × (1 − t) = 5% × (1 − 0.2) = <b>4%</b>. 수익률 계산 시에는 거래비용과 세금을 함께 고려해야 한다."},{"t":"수익률과 리스크","q":"금융에서 말하는 '리스크(risk)'에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["리스크는 불확실성에 노출된 정도를 의미한다.","리스크는 부정적 결과만을 뜻하는 위험(danger)과 구분된다.","리스크에는 부정적 상황뿐 아니라 긍정적 가능성도 포함된다.","'high risk high return'은 리스크가 큰 투자를 하면 높은 수익률이 보장된다는 뜻이다."],"a":4,"e":"'high risk high return'은 수익 보장이 아니라, 리스크를 감당하려면 <b>기대수익률이 높아야 한다</b>는 의미다."},{"t":"분산투자","q":"기대수익률이 각각 10%, 15%인 A와 B 자산에 60%와 40%의 비중으로 투자했을 때 포트폴리오의 기대수익률은?","o":["11.0%","12.0%","12.5%","13.0%"],"a":2,"e":"포트폴리오 기대수익률은 개별 자산 기대수익률의 <b>가중평균</b>: 10%×0.6 + 15%×0.4 = <b>12%</b>."},{"t":"분산투자","q":"포트폴리오의 분산효과에 대한 설명으로 옳은 것은?","o":["구성자산 간 상관관계가 낮을수록 분산효과가 커져 리스크가 감소한다.","구성자산 간 상관계수가 +1에 가까울수록 분산효과가 커진다.","포트폴리오의 리스크는 개별자산 리스크의 가중평균과 항상 같다.","분산투자를 하면 기대수익률도 함께 크게 높아진다."],"a":1,"e":"상관계수가 낮을수록(음수에 가까울수록) 분산효과가 커진다. 우산 가게와 아이스크림 가게를 함께 하는 것이 대표적 예다."},{"t":"레버리지","q":"자기자금 40만 원에 대출 60만 원을 더해 100만 원어치 주식을 매입한 뒤 주가가 20% 상승했다. 거래비용과 이자를 무시할 때 자기자금 기준 투자수익률은?","o":["20%","33%","50%","60%"],"a":3,"e":"총투자액 100만 원의 20%인 20만 원 이익을 자기자금 40만 원으로 나누면 <b>50%</b>. 투자 레버리지 = 총투자액/자기자본 = 2.5배이므로 가격변동률의 2.5배가 된다."},{"t":"레버리지","q":"레버리지에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["투자 레버리지는 총투자액을 자기자본으로 나눈 값이다.","총투자액 중 부채 비중이 커질수록 레버리지가 증가한다.","레버리지가 커지면 이익 폭은 커지지만 손실 폭은 커지지 않는다.","개인의 투자는 부채 없이 여유자금으로 하는 것이 원칙이다."],"a":3,"e":"레버리지는 <b>양날의 칼</b>이다. 수익률이 양(+)이면 이익이 확대되지만 음(−)이면 손실 폭도 똑같이 확대된다."},{"t":"저축상품","q":"MMDA·MMF·CMA에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["MMDA는 예금자보호법에 의해 보호받는 은행 상품이다.","MMF는 실적배당상품으로 예금자보호 대상이 아니며 이체·결제 기능이 없다.","CMA는 이체·결제와 ATM 입출금 기능을 갖고 있다.","증권회사의 CMA는 예금자보호 대상이지만 종합금융회사의 CMA는 아니다."],"a":4,"e":"반대다. <b>종합금융회사</b>의 CMA는 예금자보호 대상이지만 <b>증권회사</b>의 CMA는 보호 대상이 아니다."},{"t":"저축상품","q":"양도성예금증서(CD)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["최소 발행단위는 1,000만 원이고 만기는 최소 30일 이상이다.","가입자 명의가 기재되지 않는 무기명식으로 발행된다.","액면금액보다 할인되어 발행되는 방식으로 이자가 계산된다.","만기 전 중도환매가 자유로워 유동성이 높다."],"a":4,"e":"CD는 <b>중도환매가 허용되지 않는다</b>. 대신 제3자에게 양도할 수 있어 유통시장에서 매매가 가능하다."},{"t":"주식","q":"주주의 권리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["이익배당청구권·잔여재산분배청구권·신주인수권은 자익권에 속한다.","의결권·회계장부열람청구권·이사해임요구권은 공익권에 속한다.","주주는 주주평등의 원칙에 따라 보유 주식 수에 비례해 권리와 책임을 갖는다.","회사가 파산해 부채가 주주 지분을 넘으면 주주는 초과분까지 책임진다."],"a":4,"e":"주식회사 주주는 <b>유한책임</b>이 원칙으로, 출자한 자본액 한도 내에서만 책임을 진다."},{"t":"주식","q":"보통주와 우선주에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["우선주는 이익배당과 잔여재산 분배에서 보통주보다 우선적 지위를 갖는다.","우선주에는 보통주와 달리 의결권이 없다.","우리나라에서는 통상 우선주 주가가 보통주보다 높게 형성된다.","우리나라 주식 대부분은 액면가액이 기재된 액면주이며 액면가는 5,000원을 넘을 수 없다."],"a":3,"e":"우리나라에서는 우선주 주가가 보통주보다 통상 <b>20~40% 낮게</b> 형성되어 거래된다."},{"t":"주식","q":"우리나라 주식 유통시장에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["유가증권시장은 한국거래소가 개설·운영하며 엄격한 상장요건을 요구한다.","코스닥시장은 유가증권시장보다 상장기준이 완화되어 중소·벤처기업이 많다.","코넥스는 창업 초기 중소기업을 위해 2013년 개장한 코스닥 전 단계 시장이다.","K-OTC는 한국거래소가 운영하는 장내시장으로 경쟁매매 방식으로 거래된다."],"a":4,"e":"K-OTC는 <b>한국금융투자협회</b>가 운영하는 제도화된 <b>장외</b>주식시장으로, 경쟁매매가 아닌 <b>상대매매</b> 방식이다."},{"t":"주식","q":"우리나라 주식매매제도에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["매매체결은 가격우선원칙과 시간우선원칙을 적용한 개별경쟁 방식이다.","시초가와 종가는 동시호가제도를 통해 단일가격으로 결정된다.","일일 가격제한폭은 전일 종가 대비 ±15%이다.","매매가 체결된 주식의 결제시점은 체결일로부터 2영업일(D+2)이다."],"a":3,"e":"2015년 6월부터 가격제한폭은 <b>±30%</b>로 확대되었다(1998년 ±15% → 2015년 ±30%)."},{"t":"주식","q":"개인투자자의 주식 관련 세금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융소득이 연간 2,000만 원 이하이면 15.4%(소득세 14%+지방소득세 1.4%)로 분리과세된다.","금융소득이 연간 2,000만 원을 초과하면 종합과세 대상이 된다.","유가증권시장에서는 증권거래세 대신 농어촌특별세 0.15%가 부과된다.","코넥스시장의 증권거래세율은 코스닥시장보다 높다."],"a":4,"e":"코스닥은 0.15%, <b>코넥스는 0.10%</b>로 코넥스가 더 낮다."},{"t":"채권","q":"이자 지급방법에 따른 채권 분류로 <u>옳지 않은</u> 것은?","o":["이표채는 이자 지급일에 정기적으로 이자를 지급받는 가장 일반적인 형태다.","할인채는 액면금액에서 이자를 미리 공제한 금액으로 발행되며 무이표채라고도 한다.","복리채는 이자가 복리로 재투자되어 만기에 원금과 이자를 함께 지급한다.","변동금리부채권(FRN)은 발행 시 확정된 이자율이 만기까지 그대로 유지된다."],"a":4,"e":"FRN은 지급이자율이 시장금리에 연동되어 <b>매 이자지급 기간마다 재조정</b>된다(기준금리 + 발행 시 확정된 가산금리)."},{"t":"채권","q":"채권가격과 듀레이션에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["시장이자율이 상승하면 채권가격은 하락한다.","채권의 이론가격은 미래 현금흐름을 시장이자율로 할인한 현재가치이다.","듀레이션은 투자자금의 평균 회수기간으로 정의된다.","중간에 이자를 지급하는 이표채의 듀레이션은 만기보다 길다."],"a":4,"e":"이표채는 만기 전에 현금이 일부 회수되므로 듀레이션이 <b>만기보다 짧다</b>. 할인채는 듀레이션과 만기가 같다."},{"t":"채권","q":"특수한 형태의 채권에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["전환사채(CB)는 보유자의 청구에 따라 발행회사의 주식으로 전환할 수 있는 사채다.","신주인수권부사채(BW)는 채권이 존속하는 상태에서 신주인수권이 부가된 사채다.","교환사채(EB)는 발행회사가 보유 중인 다른 주식으로 교환을 청구할 수 있는 사채다.","CB·BW는 보유자에게 유리한 선택권이 있으므로 일반사채보다 높은 금리로 발행된다."],"a":4,"e":"보유자에게 유리한 권리가 붙어 있으므로 다른 조건이 같다면 일반사채보다 <b>낮은 금리</b>로 발행된다."},{"t":"채권","q":"옵션부사채에 대한 설명으로 옳은 것은?","o":["조기상환권부채권(callable bond)은 금리가 하락했을 때 발행회사가 활용하기 유리하다.","조기상환권은 채권투자자가 조기 상환을 요구할 수 있는 권리이다.","조기변제요구권부채권(puttable bond)은 금리가 하락할 때 투자자가 행사한다.","조기변제요구권부채권은 일반채권보다 높은 금리로 발행된다."],"a":1,"e":"콜옵션은 <b>발행회사</b>의 권리로, 금리가 하락하면 고금리 채권을 상환하고 저금리로 재발행하는 데 쓰인다. 풋옵션은 <b>투자자</b>의 권리로 금리 상승·신용악화 시 행사하며, 투자자에게 유리하므로 발행금리가 낮아진다."},{"t":"증권분석","q":"기본적 분석과 기술적 분석에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기본적 분석은 증권의 내재가치를 분석해 과소·과대평가 여부를 판단한다.","기술적 분석은 과거 가격·거래량의 추세와 패턴으로 미래 가격을 예측한다.","기술적 분석은 과거 가격 움직임의 양상이 미래에도 반복된다고 가정한다.","효율적 시장가설에 따르면 기본적 분석으로는 초과수익이 가능하나 기술적 분석으로는 불가능하다."],"a":4,"e":"효율적 시장가설은 현재 주가가 모든 정보를 즉각 반영하므로 <b>기본적 분석과 기술적 분석 모두</b> 지속적 초과수익을 낼 수 없다고 본다."},{"t":"증권분석","q":"재무비율 지표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["이자보상비율(영업이익/이자비용)이 1보다 작으면 영업이익으로 이자도 감당하지 못한다는 뜻이다.","당좌비율은 유동자산에서 재고자산을 제외한 뒤 유동부채로 나눈 값이다.","유동성 지표는 높을수록 무조건 바람직하다.","자기자본이익률(ROE)은 순이익을 자기자본으로 나눈 값이다."],"a":3,"e":"유동성 지표가 <b>지나치게 높으면</b> 불필요하게 많은 자금을 수익성 낮은 현금성 자산으로 운용하고 있다는 의미일 수 있다."}]},{"id":"p1c04","part":1,"no":"04","title":"다양한 투자상품과 투자유의사항","src":"pp.78–98","qs":[{"t":"펀드","q":"펀드에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["자본시장법상 '집합투자기구'로 불린다.","전문가가 운용하고 규모의 경제로 거래비용·정보취득비용을 절감할 수 있다.","다수 투자자의 자금을 모아 분산투자하고 이익을 투자지분에 따라 배분한다.","예금자보호 대상이므로 원금이 보장된다."],"a":4,"e":"펀드는 <b>예금자보호 대상이 아니며 원금손실이 가능</b>하다. 다만 펀드재산은 신탁회사가 운용사 재산과 분리 보관하므로 운용사 파산으로 투자금을 잃지는 않는다."},{"t":"펀드","q":"펀드 관련 비용에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["운용보수는 보통 매년 운용자산의 연 0.5~1% 수준을 뗀다.","판매수수료는 1회성으로 판매금액의 0.5~1.5%를 선취 또는 후취한다.","환매수수료는 정해진 기간 이전에 자금을 회수할 때 부과될 수 있다.","일반적으로 인덱스펀드 등 패시브펀드가 액티브펀드보다 운용보수가 높다."],"a":4,"e":"운용에 사람의 판단이 많이 들어가는 <b>액티브펀드의 보수가 더 높다</b>. 패시브(인덱스)펀드는 보수가 낮다."},{"t":"펀드","q":"펀드의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["공모펀드는 50인 이상 불특정 다수로부터, 일반사모펀드는 49인 이하로부터 자금을 모집한다.","주식형은 펀드재산의 60% 이상을 주식에, 채권형은 60% 이상을 채권에 투자한다.","주식혼합형은 주식 최대편입비율이 50% 이상인 펀드다.","증권펀드는 펀드재산의 100분의 30을 초과하여 증권에 투자하는 펀드다."],"a":4,"e":"증권·부동산·특별자산 펀드 모두 해당 자산에 펀드재산의 <b>100분의 50(50%)을 초과</b>하여 투자하는 펀드를 말한다."},{"t":"펀드","q":"특수한 형태의 집합투자기구에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["종류형 펀드(멀티클래스)는 판매보수·수수료가 다른 여러 종류의 집합투자증권을 발행한다.","전환형 펀드(엄브렐러)는 보유 집합투자증권을 다른 펀드로 전환할 권리를 부여한다.","모자형 펀드는 자펀드가 모펀드의 집합투자증권을 취득하는 구조다.","ETF는 상장되지 않아 실시간 매매가 불가능하다."],"a":4,"e":"ETF는 인덱스펀드와 상장주식의 성격을 겸하는 <b>상장지수펀드</b>로, 거래소에서 실시간 매매가 가능하다."},{"t":"펀드","q":"액티브펀드와 패시브펀드, 성장주펀드와 가치주펀드에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["액티브펀드는 비교대상지수(인덱스)보다 높은 수익을 추구한다.","패시브펀드는 운용주체의 의사를 배제·제한하고 지수 수익률 추적을 목표로 한다.","성장주펀드는 저PER·저PBR·고배당 종목에 주로 투자한다.","인덱스펀드는 KOSPI200 등 목표지수와 동일한 수익률을 올리도록 운용한다."],"a":3,"e":"저PER·저PBR·고배당은 <b>가치주펀드</b>의 특징이다. 성장주펀드는 고PER·고PBR·저배당 종목에 투자한다."},{"t":"펀드","q":"펀드 투자 시 유의사항으로 <u>옳지 않은</u> 것은?","o":["펀드도 섹터·테마·지역·운용회사를 분산해 투자하는 것이 바람직하다.","과거 수익률이 높은 펀드는 미래 수익률도 높으므로 최근 수익률만 보고 고르면 된다.","펀드마다 수수료·보수 체계와 환매조건이 다르므로 계약조건을 확인해야 한다.","펀드에도 'high risk high return' 원칙이 적용된다."],"a":2,"e":"많은 실증분석에서 펀드의 <b>과거 수익률과 미래 수익률은 별다른 상관관계가 없다</b>고 보고된다."},{"t":"펀드","q":"적립식 투자에 대한 설명으로 옳은 것은?","o":["매입 시점을 고민해야 하므로 시장 타이밍 판단이 반드시 필요하다.","가격이 쌀 때 많이, 비쌀 때 적게 매입되어 평균 매입단가를 낮추는 효과가 있다.","목돈이 있어야만 시작할 수 있다.","평균 매입단가는 항상 기간 중 가격의 산술평균과 같다."],"a":2,"e":"정액 분할매수의 효과다. 매월 10만 원씩 10,000원→5,000원→10,000원에 매입하면 평균 매입가는 7,500원으로 산술평균 8,333원보다 낮아진다."},{"t":"펀드 평가","q":"펀드 평가지표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["베타가 1.5인 펀드는 벤치마크가 1% 오를 때 1.5% 오르는 경향이 있다.","알파가 양(+)이면 벤치마크 시장보다 좋은 성과를 냈다는 의미다.","샤프지수가 높을수록 감수한 위험 한 단위당 얻은 수익이 크다.","표준편차가 큰 펀드일수록 안정 성향의 투자자에게 적합하다."],"a":4,"e":"표준편차는 수익률의 변동폭이므로, <b>표준편차가 작은 펀드</b>가 안정 성향 투자자에게 적합하다."},{"t":"펀드 평가","q":"어떤 펀드가 12,000원까지 올랐다가 8,000원까지 하락했다. 이 펀드의 MDD(최대낙폭)는?","o":["약 25.0%","약 33.3%","약 40.0%","약 50.0%"],"a":2,"e":"MDD = (12,000 − 8,000) ÷ 12,000 × 100 = <b>33.3%</b>. 최고점을 회복하기까지 걸린 기간은 Underwater Period라 한다."},{"t":"ETP","q":"ETF와 ETN에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["ETF는 지수와 연동되어 성과가 나타난다는 점에서 인덱스펀드와 유사하다.","ETF에는 인버스형과 레버리지형 상품도 있다.","ETN은 발행주체가 증권사이므로 발행기관의 신용위험에 노출된다.","ETN은 만기가 없어 영구적으로 상장이 유지된다."],"a":4,"e":"ETN은 <b>1~20년의 만기</b>가 정해져 있다. 인기 있는 전략은 만기가 연장되고, 그렇지 못하면 만기 시 상장폐지 절차를 밟는다."},{"t":"주가연계증권","q":"ELS·ELB·DLS·DLB에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["ELS는 개별 주식 가격이나 주가지수에 연계되어 투자수익이 결정되는 유가증권이다.","ELB는 원금보장형으로 재분류된 주가연계파생결합사채이다.","DLS는 기초자산이 파생상품인 형태로, 일반적으로 ELS보다 변동성이 크다.","DLS와 DLB는 모두 원금이 보장되는 상품이다."],"a":4,"e":"원금보장은 <b>ELB·DLB</b>만 해당한다. <b>ELS·DLS는 원금 비보장</b>이다."},{"t":"주가연계증권","q":"ELS의 손익구조 용어에 대한 설명으로 옳은 것은?","o":["녹아웃(knock-out)은 일정 수익이 발생하면 만기 전에 수익이 실현되는 구조다.","녹인(knock-in)은 기초자산 가격과 무관하게 손익구조가 고정되는 것이다.","우리나라 ELS는 초기부터 원금 비보장형이 주종을 이루었다.","ELS의 만기는 통상 5~10년이 일반적이다."],"a":1,"e":"녹인은 기초자산 가격이 일정 수준 이상 상승·하락하면 <b>새로운 손익구조가 적용</b>되는 것이다. 우리나라 ELS는 2003년 상품화 초기에 <b>원금보장형</b>이 주종이었고 만기는 <b>1~3년</b>이 일반적이다."},{"t":"파생상품","q":"선물계약과 선도계약의 차이로 옳은 것은?","o":["선도계약은 계약내용이 표준화되어 거래소에서 거래된다.","선물계약은 계약내용이 표준화되어 있고 공식 거래소를 통해 거래된다.","선물계약은 당사자가 자유롭게 계약내용을 정할 수 있다.","선도계약은 매입 측만 계약이행 의무를 진다."],"a":2,"e":"선물은 <b>표준화 + 거래소</b>, 선도는 <b>비표준화 + 당사자 간 자유로운 계약</b>이다. 선물은 선도계약 중 표준화되어 거래소에서 이루어지는 것을 한정해 지칭한다."},{"t":"파생상품","q":"선물거래의 기능에 해당하지 <u>않는</u> 것은?","o":["가격변동리스크를 줄이는 헤징 기능","현물시장의 유동성 확대에 기여","미래 현물가격을 예상하게 하는 가격예시 기능","기초자산의 원금을 보장해 손실을 없애는 기능"],"a":4,"e":"선물은 원금을 보장하지 않는다. 오히려 <b>레버리지가 높아</b> 투기적 목적으로도 활용되며 큰 손실이 발생할 수 있다."},{"t":"파생상품","q":"선물계약의 종류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융선물은 금리선물, 주식관련선물, 통화선물로 구분된다.","우리나라는 1996년 5월 KOSPI200 주가지수선물이 최초로 상장되었다.","우리나라 금리선물로는 3년·5년·10년·30년 만기 국채선물이 있다.","원유·금·농산물을 기초자산으로 하는 것은 금융선물에 속한다."],"a":4,"e":"원유·금·농산물 등은 <b>상품선물(commodity futures)</b>의 기초자산이다."},{"t":"파생상품","q":"선물계약과 옵션계약의 근본적인 차이는?","o":["선물은 쌍방이 모두 계약이행 의무를 지지만, 옵션은 보유자가 권리를 행사하지 않을 수 있다.","선물은 거래소에서만, 옵션은 장외에서만 거래된다.","선물은 기초자산이 있지만 옵션은 기초자산이 없다.","선물은 프리미엄을 지급하지만 옵션은 지급하지 않는다."],"a":1,"e":"옵션 보유자는 유리하면 행사하고 불리하면 포기할 수 있는 <b>선택권</b>을 가지며, 그 대가로 <b>옵션 프리미엄</b>을 매도자에게 지급한다."},{"t":"파생상품","q":"옵션의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["콜옵션 매입자는 기초자산을 정해진 가격에 매입할 수 있는 권리를 갖는다.","풋옵션 매입자는 기초자산을 정해진 가격에 매도할 수 있는 권리를 갖는다.","유럽식 옵션은 만기일 이전 언제라도 권리를 행사할 수 있다.","선물옵션을 행사하면 현물이 아니라 현물에 대한 선물계약을 갖게 된다."],"a":3,"e":"만기일에만 행사할 수 있는 것이 <b>유럽식</b>, 만기일까지 언제라도 행사할 수 있는 것이 <b>미국식</b> 옵션이다."},{"t":"대체투자","q":"대체투자(Alternative Investment)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["주식·채권 등 전통적 투자상품을 제외한 투자상품을 포괄하는 개념이다.","전통자산과 상관관계가 낮아 포트폴리오 변동성을 낮추는 효과를 기대할 수 있다.","부동산·인프라 등 실물자산은 인플레이션 헤지와 고정소득 창출이 강점이다.","사모시장 투자는 유동성이 높고 단기간에 회수할 수 있다는 장점이 있다."],"a":4,"e":"사모시장 투자는 공개시장보다 <b>더 오랜 투자기간이 요구되고 유동성이 떨어진다</b>는 단점이 있다."},{"t":"투자 유의사항","q":"금융투자상품 투자 시 위험 대처 방법으로 <u>옳지 않은</u> 것은?","o":["'수익'보다 '위험'을 먼저 생각해야 한다.","전세자금·치료비·노후자금 등 용도가 정해진 자금이라도 수익률이 높으면 투자할 만하다.","충분한 상담을 통해 투자정보를 얻고, 상담 직후 충동적으로 계약하지 않는다.","자본시장법은 적합성의 원칙, 설명의무, 부당권유의 금지를 규정하고 있다."],"a":2,"e":"투자는 <b>전부 잃어도 생활에 지장이 없는 여유자금</b>으로 해야 하며, 용도가 정해진 자금으로 투자해서는 안 된다."},{"t":"투자 유의사항","q":"원금보장형 금융투자상품에 대한 설명으로 옳은 것은?","o":["예금·적금과 동일하게 어떤 경우에도 원금이 보장된다.","발행회사가 파산하는 경우에는 원금손실 가능성이 있다.","파생상품이므로 원금을 초과하는 손실이 항상 발생한다.","예금자보호법에 따라 1억 원까지 보호된다."],"a":2,"e":"원금보장형이라도 <b>발행회사 파산 시에는 원금손실이 가능</b>하므로, 금융회사가 파산해도 일정 범위가 보장되는 예금·적금과는 다르다."},{"t":"불공정거래","q":"불공정거래 유형에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["서로 짜고 거래하는 통정매매, 스스로 매수·매도하는 가장매매는 시세조종에 해당한다.","고가주문·허수주문으로 주가를 인위적으로 변동시키는 행위는 시세조종이다.","회사 내부자가 중요 정보 공개 전에 매매에 이용하는 것은 미공개정보 이용이다.","시세조종 목적이 없다면 시세에 부당한 영향을 주더라도 규제 대상이 아니다."],"a":4,"e":"시세조종 목적이 없더라도 시세에 부당한 영향을 주거나 줄 우려가 있는 행위는 <b>시장질서 교란행위</b>로 규제된다."}]},{"id":"p1c05","part":1,"no":"05","title":"부채관리","src":"pp.99–112","qs":[{"t":"신용대출과 담보대출","q":"신용대출과 담보대출에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["신용대출은 담보 없이 개인신용평점·소득·기존 부채·거래이력을 보고 한도와 금리를 정한다.","담보대출은 보통 기간이 길고 금액이 크며 금리가 낮은 편이다.","2021년부터는 신용등급 대신 개인신용평점(1~1,000점) 체계를 활용한다.","담보가 동일하면 소득이나 기존 부채와 관계없이 동일한 한도가 적용된다."],"a":4,"e":"차주단위 <b>DSR</b>을 엄격히 적용하므로 담보가 같아도 <b>소득과 기존 부채</b>에 따라 한도가 달라진다(주택담보대출은 LTV도 병행)."},{"t":"대출규제 지표","q":"LTV·DTI·DSR에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["LTV는 주택가격 대비 대출금의 비율이다.","DTI는 연간 소득에 대한 연간 예상 원리금 상환액의 비율이다.","DSR은 모든 금융부채의 연간 원리금 상환액 합계를 연소득으로 나눈 비율이다.","현재는 DTI가 핵심 관리 지표이며 DSR은 보조적으로만 활용된다."],"a":4,"e":"현재는 <b>DSR이 핵심 관리 지표</b>이며 주택담보대출의 LTV를 병행 관리한다. DSR에는 주담대·신용대출·카드론·학자금이 모두 합산된다."},{"t":"대출규제 지표","q":"'스트레스 DSR'에 대한 설명으로 옳은 것은?","o":["금리 상승을 가정해 더 보수적으로 상환능력을 계산하는 방식이다.","연체가 발생한 차주에게만 적용되는 제재성 규제다.","고정금리 대출에만 적용되는 계산 방식이다.","소득이 없는 차주의 DSR을 면제해주는 제도다."],"a":1,"e":"변동·혼합금리 대출에 <b>금리 상승 시나리오</b>를 가정해 원리금 부담을 더 보수적으로 산정하는 방식이다."},{"t":"주택연금","q":"주택연금에 대한 설명으로 옳은 것은?","o":["주택을 매각한 뒤 그 대금을 연금 형태로 받는 제도다.","한국주택금융공사 보증으로, 살던 집에 계속 살면서 매달 연금처럼 받는 제도다.","부부 중 1명이 만 65세 이상이어야 가입할 수 있다.","주택 공시가격 제한 없이 누구나 가입할 수 있다."],"a":2,"e":"주택을 담보로 맡기되 <b>계속 거주하면서</b> 매달 연금을 받는다. 부부 중 1명 <b>55세 이상</b>, 공시가격 12억 이하 등의 요건이 있다."},{"t":"대출금리","q":"고정금리와 변동금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["고정금리는 대출기간 동안 약정금리가 변하지 않는다.","변동금리는 3개월·6개월 등 주기로 시장 기준금리에 연동되어 조정된다.","고정금리는 일반적으로 대출 시점의 변동금리보다 낮게 책정된다.","앞으로 금리가 오를 것으로 예상하면 고정금리가 유리할 수 있다."],"a":3,"e":"고정금리는 금리변동 위험을 대출자가 지지 않는 대신 대출 시점의 변동금리보다 <b>높게</b> 책정되는 경우가 많다."},{"t":"대출금리","q":"대출금리의 구성에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["대출금리 = 기준금리 + 가산금리 − 우대금리로 결정된다.","가산금리에는 업무원가, 법적비용, 위험프리미엄, 목표이익률 등이 포함된다.","법적비용은 보증기관 출연료와 교육세 등 각종 세금을 의미한다.","우대금리는 금융회사가 임의로 정할 수 없고 법으로 요율이 정해져 있다."],"a":4,"e":"우대금리(가감조정금리)는 <b>은행 본점이나 영업점장 전결</b>에 따라 급여이체·자동이체·카드실적 등 거래조건에 따라 조정된다."},{"t":"대출금리","q":"은행 대출 시 사용하는 기준금리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["COFIX는 은행연합회가 발표하며 잔액기준·신규취급액기준·단기 COFIX로 구분 공시된다.","CD금리는 금융투자협회가 발표하며 주로 신용대출의 기준금리로 사용된다.","KORIBOR는 15개 은행이 제시한 금리 중 상하위 3개씩을 제외한 9개의 평균금리이다.","금융채 금리는 한국은행이 직접 결정해 고시하는 정책금리이다."],"a":4,"e":"금융채 금리는 시중은행·금융회사가 발행하는 <b>무담보 채권의 시장수익률</b>로, 신용평가회사가 발표한다."},{"t":"연체이자","q":"연체이자와 금리인하요구권에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["연체이자율은 약정금리 + 최대 3%p 이내로 제한된다.","연체이자율도 법정 최고이자율(현재 연 20%)을 초과할 수 없다.","취업·승진·소득증가·신용평점 개선 시 금리인하요구권을 신청할 수 있다.","금리인하요구를 받은 금융회사는 통지 의무 없이 자율적으로 처리하면 된다."],"a":4,"e":"금융회사는 통상 <b>10영업일 이내</b>에 수용 여부와 사유를 통지해야 한다. 신청은 일반적으로 대출 후 3개월 경과 후 가능하다."},{"t":"대출금 상환방식","q":"원금균등분할상환과 원리금균등분할상환에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["원금균등분할상환은 원금을 매월 균등하게 갚고 이자는 원금 잔액에 대해 납부한다.","원금균등분할상환은 매월 상환액이 점차 줄어든다.","원리금균등분할상환은 매월 상환액이 동일해 자금계획 수립이 용이하다.","원리금균등분할상환은 매월 원금 상환액이 점차 감소한다."],"a":4,"e":"원리금균등에서는 초기에 이자 비중이 크고 시간이 갈수록 <b>원금 상환액이 증가</b>한다(이자 납입액은 감소)."},{"t":"대출금 상환방식","q":"만기일시상환과 거치식상환에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["만기일시상환은 대출기간 중 이자만 내고 원금은 만기에 일시 상환한다.","만기일시상환은 만기 부담이 크므로 금융당국이 장려하지 않는다.","거치식상환은 일정 기간 이자만 내다가 거치기간이 끝나면 원금과 이자를 나눠 갚는다.","거치식상환은 총 이자 부담이 가장 적은 방식이다."],"a":4,"e":"거치기간에는 원금이 줄지 않으므로 <b>총 이자 부담이 오히려 늘어난다</b>. 이 방식은 만기일시상환과 원리금균등의 장점을 결합한 것이다."},{"t":"차입 실무","q":"중도상환수수료에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융회사가 조기상환으로 자금운용에 공백이 생기는 것을 보상받기 위한 수수료다.","2024년 7월 개정으로 '실비용' 범위 내에서만 부과하도록 기준이 명확화되었다.","금융회사·협회를 통해 중도상환수수료율 공시가 의무화되었다.","여유자금이 생기면 수수료와 관계없이 무조건 중도상환하는 것이 유리하다."],"a":4,"e":"중도상환에 따른 <b>이자절약분과 중도상환수수료 부담을 비교</b>해 결정해야 한다."},{"t":"차입 실무","q":"원금 100만 원을 1년간 빌리면서 이자 10만 원을 미리 떼고 90만 원을 받았다면, 실질 이자율은?","o":["약 9%","약 10%","약 11%","약 20%"],"a":3,"e":"실제 사용한 원금 90만 원에 대한 이자 10만 원이므로 약 <b>11%</b>. <b>선이자</b>는 사용 가능한 원금을 줄이므로 표면 이자율보다 실질 부담이 크다."},{"t":"서민 대출제도","q":"서민 대출제도에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["새희망홀씨는 저소득·저신용 계층을 위한 은행의 서민 맞춤형 대출상품이다.","미소금융은 제도권 금융 이용이 곤란한 금융소외계층의 창업·운영자금을 지원한다.","햇살론은 서민금융진흥원이 보증하고 은행·저축은행 등이 취급하는 정책 서민금융이다.","'서민금융 잇다'는 대부업체가 운영하는 민간 대출중개 플랫폼이다."],"a":4,"e":"'서민금융 잇다'는 2024년 6월 <b>금융위원회와 서민금융진흥원</b>이 만든 서민금융 종합플랫폼이다."},{"t":"대학생 대출제도","q":"한국장학재단의 학자금 대출제도에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["취업 후 상환 학자금 대출은 소득이 발생한 시점부터 소득수준에 비례해 상환한다.","일반상환 학자금 대출은 학자금 지원구간 제한이 없다.","농어촌출신 대학(원)생 학자금 대출은 등록금 전액을 무이자로 대출한다.","농어촌출신 학자금 대출은 등록금과 생활비를 모두 무이자로 지원한다."],"a":4,"e":"농어촌출신 학자금 대출은 <b>생활비를 대출하지 않는다</b>. 생활비가 필요하면 취업 후 상환 또는 일반상환 생활비 대출을 이용해야 한다."},{"t":"핀테크 대출","q":"핀테크와 P2P(온라인투자연계금융) 대출에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["핀테크는 금융(Finance)과 기술(Technology)의 합성어다.","P2P는 2020년 온라인투자연계금융업법 시행 이후 등록업체만 영업할 수 있다.","P2P 투자상품은 예금자보호 대상이며 원금과 수익이 보장된다.","P2P는 원금과 수익의 보장이 금지되어 있어 손실 가능성이 있다."],"a":3,"e":"P2P 투자상품은 <b>예금자보호 대상이 아니며</b>, 차입자 연체 시 손실이 투자자에게 귀속된다. 등록 여부·연체율·담보구조를 확인해야 한다."},{"t":"핀테크 대출","q":"핀테크 기반 대출 이용 시 유의사항으로 <u>옳지 않은</u> 것은?","o":["금리만 낮추고 만기를 늘리면 월 상환액은 줄어도 총이자는 커질 수 있다.","표면 금리뿐 아니라 보증료·플랫폼 수수료를 더한 실질금리로 판단해야 한다.","앱에 표시된 사전 한도와 최저금리는 본심사 결과와 동일하므로 그대로 믿어도 된다.","소액후불결제(BNPL)도 대출성 소비이므로 이용 한도를 스스로 정해야 한다."],"a":3,"e":"앱의 사전 한도·최저금리는 <b>본심사 결과와 다를 수 있다</b>. 약정 전에 실제 금리, 부대비용, 중도상환수수료, 연체이자율을 약정서에서 확인해야 한다."}]},{"id":"p1c06","part":1,"no":"06","title":"신용관리","src":"pp.113–128","qs":[{"t":"신용과 신용평점","q":"개인신용평점 체계에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2021년부터 신용등급(1~10등급) 대신 개인신용평점(1~1,000점)을 사용한다.","신용평가회사(CB)가 상환이력, 채무수준, 연체 여부, 신용거래기간, 신용활용도 등으로 산정한다.","통신·전기·가스 등 비금융 납부정보는 본인 동의 시 평가에 활용될 수 있다.","점수가 낮을수록 연체·부실 가능성이 낮아 금융거래 조건이 유리해진다."],"a":4,"e":"<b>점수가 높을수록</b> 연체·부실 가능성이 낮다고 평가되어 조건이 유리해진다."},{"t":"신용과 신용평점","q":"신용조회 기록과 개인신용평점의 관계로 옳은 것은?","o":["2011년 10월 이후 CB는 신용조회기록을 개인신용평점 산정에 반영하지 않는다.","자가신용조회를 3회 이상 하면 현재도 신용평점이 하락한다.","본인이 자신의 신용정보를 열람하면 점수가 즉시 하락한다.","신용조회 기록은 보관되지 않고 즉시 삭제된다."],"a":1,"e":"서민의 금융애로를 덜기 위해 2011년 10월부터 조회기록은 평점에 반영하지 않는다. 다만 조회 이력은 일정 기간 보관되어 <b>금융회사 내부 심사 참고자료</b>로 쓰일 수 있다."},{"t":"신용관리","q":"신용관리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["신용관리에서 가장 중요한 것은 연체를 하지 않는 것이다.","대출금·카드대금뿐 아니라 세금·공과금 연체도 신용평가에 반영된다.","신용카드 현금서비스를 자주 이용하면 신용도가 낮아질 수 있다.","신용은 단기간에 나빠지기 어렵지만 단기간에 좋아지기는 쉽다."],"a":4,"e":"반대다. 신용은 <b>단기간에 나빠질 수는 있지만 단기간에 좋아지기는 어렵다</b>."},{"t":"신용관리","q":"금융감독원이 제시한 '현명한 신용관리 팁'으로 <u>옳지 않은</u> 것은?","o":["인터넷·전화 등을 통한 대출은 위험도를 높게 평가받을 수 있어 신중해야 한다.","주거래 금융회사를 정해 지속적으로 이용하면 신용평가에 긍정적일 수 있다.","여러 건의 연체가 있을 때는 가장 최근에 발생한 연체부터 상환한다.","주소·전화번호 등 연락처가 변경되면 반드시 거래 금융회사에 통보한다."],"a":3,"e":"연체는 기간이 길수록 불리하므로 <b>가장 오래된 연체 건부터</b> 상환해야 불이익을 최소화할 수 있다."},{"t":"신용관리","q":"본인의 개인신용평점 조회에 대한 설명으로 옳은 것은?","o":["신용평가회사(KCB·NICE)에서 4개월에 1회 무료로 조회할 수 있다.","연 1회만 유료로 조회할 수 있다.","한국신용정보원 크레딧포유에서 신용평점(점수)을 조회할 수 있다.","은행 앱에서는 개인신용평점을 조회할 수 없다."],"a":1,"e":"KCB·NICE에서 <b>4개월에 1회 무료</b> 조회가 가능하고 은행 앱에서도 무료 조회 서비스를 제공한다. 크레딧포유는 연체·대출·보증 등 신용정보는 조회되지만 <b>평점은 조회되지 않는다</b>."},{"t":"연체정보","q":"연체정보의 등록과 관리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["3개월(90일) 이상 연체하면 한국신용정보원에 '신용도판단정보'로 등록된다.","3개월 미만 연체는 신용평가회사가 수집해 개인신용평점에 반영한다.","연체 원리금을 모두 상환하면 한국신용정보원 등록 연체정보는 지워진다.","연체 원리금을 모두 상환하면 신용평가회사의 연체 이력도 즉시 사라진다."],"a":4,"e":"신용평가회사에는 연체가 있었던 사실이 <b>이력 형태로 일정 기간 남아</b> 평가모형에 활용되므로 점수 회복에 시간이 걸린다."},{"t":"신용카드","q":"신용카드의 기능에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["지불의 편리성 외에 결제일까지 신용을 제공받는 신용공여 기능이 있다.","동전·지폐 사용을 줄이고 지하경제 축소, 세수 투명화에 기여한다.","카드사는 연회비와 가맹점수수료를 주요 수입원으로 한다.","적격비용 체계 도입으로 가맹점수수료율이 상승해 카드 혜택이 확대되고 있다."],"a":4,"e":"적격비용 체계로 수수료율이 <b>내려가면서</b> 카드사 수입이 줄어 오히려 <b>혜택이 축소</b>되거나 조건이 까다로워지는 추세다."},{"t":"신용카드","q":"신용카드 발급 기준에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["신용카드 발급 업무는 신용대출심사의 성격을 가진다.","심사 기준일 현재 만 19세 이상이어야 한다.","월 가처분소득이 일정 금액 이상이어야 한다.","발급 요건을 모두 충족하면 연체 채무가 있어도 반드시 발급된다."],"a":4,"e":"요건을 모두 충족해도 <b>연체 채무가 있거나</b> 결제능력이 부족하다고 판단되면 카드사가 발급을 거절할 수 있다."},{"t":"신용카드","q":"신용카드의 올바른 사용방법으로 <u>옳지 않은</u> 것은?","o":["발급 즉시 카드 뒷면에 서명해야 한다.","비밀번호는 생년월일·전화번호 등 노출되기 쉬운 숫자를 피한다.","가족이나 가까운 지인에게는 카드를 빌려주어도 문제가 없다.","결제 알림 서비스를 신청하면 부정사용을 막는 데 도움이 된다."],"a":3,"e":"카드를 <b>타인에게 빌려주어 발생한 피해는 모두 본인 책임</b>이다. 가족·동거인에 의한 부정사용도 보상에서 제외된다."},{"t":"해외 카드 사용","q":"해외에서 신용카드를 사용할 때의 유의사항으로 <u>옳지 않은</u> 것은?","o":["여권상 영문이름과 카드상 이름이 다르면 결제가 거부될 수 있다.","'출입국정보 활용서비스'에 동의하면 국내 체류 중 해외 승인이 제한되어 부정사용을 예방할 수 있다.","결제통화는 원화로 선택하는 것이 수수료 면에서 유리하다.","해외 긴급대체카드는 임시 카드이므로 귀국 후 반납하고 정상 카드로 재발급해야 한다."],"a":3,"e":"원화결제(DCC)는 약 <b>3~5% 수수료</b>가 붙고 환전도 원화→달러→원화로 이중 발생하므로, <b>현지 통화로 결제</b>하는 것이 유리하다."},{"t":"지급결제서비스","q":"핀테크 지급결제서비스에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["삼성페이는 MST(마그네틱 결제기술)로 기존 카드단말기에서도 결제할 수 있다.","애플페이는 2023년 3월 현대카드와 함께 국내에 공식 도입되었다.","애플페이의 오프라인 확산은 NFC 단말기 보급률이 낮은 점에 제약을 받는다.","실물카드 없이 모바일에서 가상 카드번호를 발급받는 것은 법적으로 허용되지 않는다."],"a":4,"e":"실물카드 없이 모바일카드를 발급받는 제도가 <b>도입되어 있다</b>. 카드사는 제조비용을 절감하고 소비자는 즉시 신청할 수 있다."},{"t":"할부거래","q":"신용카드 할부거래의 청약철회권과 항변권에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["「할부거래에 관한 법률」에 따라 거래금액 20만 원 이상, 할부기간 3개월 이상인 거래가 대상이다.","청약철회권은 할부 결제 후 7일 이내에 자유의사로 청약을 철회할 수 있는 권리다.","항변권은 물품 하자나 서비스 미이행 시 잔여 할부금 지급을 거절할 수 있는 권리다.","일시불 결제도 금액과 관계없이 항변권 행사가 가능하다."],"a":4,"e":"청약철회권과 항변권은 <b>할부거래</b>(20만 원 이상, 3개월 이상)에 적용되는 권리다."},{"t":"카드 분실·도난","q":"신용카드 분실·도난 시 보상에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["신고 접수일로부터 60일 전 이후 발생한 제3자 부정사용 금액은 보상을 신청할 수 있다.","카드 뒷면에 서명하지 않은 상태에서 분실해 부정사용된 경우 회원이 책임질 수 있다.","비밀번호 유출로 인한 부정사용은 회원이 책임질 수 있다.","도난·분실을 인지한 뒤 신고를 지연해도 전액 보상받을 수 있다."],"a":4,"e":"정당한 사유 없이 <b>신고를 지연</b>하면 회원이 전부 또는 일부 책임을 진다. 카드 양도·대여, 가족·동거인 부정사용도 보상에서 제외된다."},{"t":"신용회복제도","q":"신용회복지원제도의 운영주체 구분으로 옳은 것은?","o":["개인회생·개인파산은 신용회복위원회가, 개인워크아웃은 법원이 운영한다.","개인회생·개인파산은 법원이, 신속채무조정·사전채무조정·개인워크아웃은 신용회복위원회가 운영한다.","모든 채무조정 제도를 신용회복위원회가 단독 운영한다.","모든 채무조정 제도를 법원이 단독 운영한다."],"a":2,"e":"법원 절차는 <b>개인회생·개인파산</b>, 신용회복위원회 절차는 <b>신속채무조정·사전채무조정(프리워크아웃)·개인워크아웃</b>이다."},{"t":"신용회복제도","q":"신용회복위원회 채무조정 제도의 대상 연체기간으로 옳은 것은?","o":["신속채무조정 30일 이하 → 사전채무조정 31~89일 → 개인워크아웃 90일 이상","신속채무조정 90일 이상 → 사전채무조정 31~89일 → 개인워크아웃 30일 이하","신속채무조정 31~89일 → 사전채무조정 30일 이하 → 개인워크아웃 90일 이상","세 제도 모두 연체기간과 무관하게 신청할 수 있다."],"a":1,"e":"연체 기간이 짧은 순서대로 <b>신속채무조정(30일 이하) → 사전채무조정=프리워크아웃(31~89일) → 개인워크아웃(90일 이상)</b>이다."},{"t":"신용회복제도","q":"채무조정 제도에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["개인워크아웃은 이자와 연체이자 전액을 감면해준다.","사전채무조정은 채무과중도에 따라 약정이자율의 30~70% 정도를 인하해준다.","신용회복위원회 채무조정은 세금·건강보험료 등 비금융채무도 조정할 수 있다.","개인파산은 재산 처분 후 잔여채무를 면책하는 제도다."],"a":3,"e":"신용회복위원회 채무조정은 협약 가입 채권금융회사의 채권이 대상이며, <b>세금·건보료·개인채무 등 비금융채무는 조정할 수 없다</b>."}]},{"id":"p1c07","part":1,"no":"07","title":"보험","src":"pp.129–166","qs":[{"t":"위험의 분류","q":"순수 위험과 투기적 위험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["순수 위험은 이득의 기회가 전혀 없는 상황으로 화재·지진·사망 등이 해당한다.","투기적 위험은 복권·경마·도박처럼 손실과 이득의 기회가 모두 존재한다.","전통적으로 보험은 투기적 위험만을 대상으로 발달해 왔다.","이미 발생했거나(확률=1) 전혀 발생 가능성이 없는 경우(확률=0)는 위험이라 하지 않는다."],"a":3,"e":"보험은 <b>순수 위험</b>만을 대상으로 발달했다. 순수 위험은 도덕적 해이가 상대적으로 적어 손실 발생을 더 정확히 예측할 수 있기 때문이다."},{"t":"보험대상 위험","q":"보험 대상이 되는 순수 위험의 분류에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["재산위험은 자연재해나 사고로 재산상 손실이 초래될 위험이다.","화재로 주택이 소실된 것은 직접손실, 가족의 이사비용은 간접손실이다.","인적 위험에는 사망·질병·부상·노령화·실직 등이 포함된다.","배상책임위험은 자신의 재산이 손상될 위험을 말한다."],"a":4,"e":"배상책임위험은 자신의 과실·부주의로 <b>제3자에게 피해를 입혀 법적으로 배상할 책임</b>을 지는 데서 오는 손실위험이다."},{"t":"보험의 원리","q":"보험의 적용원리에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["대수의 법칙은 반복 관찰을 통해 사건 발생 비율이 일정 확률에 수렴한다는 원리다.","수지상등의 원칙은 순보험료 총액과 지급 보험금 총액이 같아야 한다는 원칙이다.","급부·반대급부 균등의 원칙에서 위험보험료는 사고발생확률에 보험금을 곱한 값이다.","이득금지의 원칙은 보험금이 실제 손해를 초과해도 무방하다는 원칙이다."],"a":4,"e":"이득금지(실손보상)의 원칙은 보험금이 <b>실제 손해를 초과해서는 안 된다</b>는 원칙으로, 보험사기와 도덕적 위험을 방지한다."},{"t":"보험의 원리","q":"1억 원의 보험사고가 발생할 확률이 1%일 때 급부·반대급부 균등의 원칙에 따른 위험보험료는?","o":["10만 원","100만 원","1,000만 원","1억 원"],"a":2,"e":"위험보험료 = 사고발생확률 × 보험금 = 0.01 × 1억 원 = <b>100만 원</b>."},{"t":"보험의 원리","q":"보험의 사회적 기능과 비용에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험은 대규모 자본을 형성해 투자자금의 원천으로 경제성장에 기여한다.","보증보험 가입 등을 통해 개인이나 회사의 신용도를 높일 수 있다.","도덕적 해이로 인한 비용은 보험의 대표적인 사회적 비용이다.","보험사기로 발생한 비용은 보험회사만 부담하고 계약자에게는 전가되지 않는다."],"a":4,"e":"보험사기로 인한 비용은 <b>보험료 인상이나 보장 축소를 통해 모든 계약자에게 전가</b>된다."},{"t":"보험계약의 성격","q":"보험계약의 법적 성격에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["청약과 승낙의 의사표시 합치로 성립하는 불요식·낙성계약이다.","보험회사와 계약자가 상호 금전적 채무를 지는 유상·쌍무계약이다.","보험회사가 미리 만든 약관을 다수 계약자에게 동일하게 적용하는 부합계약이다.","보험증권 발급과 최초 보험료 납입은 보험계약의 성립요건이다."],"a":4,"e":"보험증권이나 최초 보험료는 <b>성립요건이나 효력발생 요건이 아니다</b>. 다만 실무상 보험회사의 <b>책임개시</b>는 최초 보험료를 받은 때부터다."},{"t":"계약의 소멸","q":"보험계약의 해지·해제·취소·무효에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["해지는 장래에 대해서만 계약의 효력을 소멸시킨다.","해제는 계약을 처음부터 하지 않은 상태로 되돌린다.","취소는 취소권자의 의사표시로 계약이 처음부터 없었던 것이 되는 것이다.","무효는 장래에 대해서만 효력을 잃고 과거 계약은 유효하게 남는다."],"a":4,"e":"무효는 <b>처음부터 법적 효력이 없으며</b> 원칙적으로 누구에게나 무효다. 장래에 대해서만 효력을 잃는 것은 해지다."},{"t":"계약의 부활","q":"보험계약의 부활에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험료 연체로 계약이 해지되었으나 해지환급금을 받지 않은 경우 부활을 청약할 수 있다.","해지된 날부터 3년 이내에 회사가 정한 절차에 따라 청약할 수 있다.","연체된 보험료에 평균공시이율 + 1% 범위 내 이율로 계산한 금액을 더해 납입한다.","부활계약에는 계약 전 알릴 의무가 적용되지 않는다."],"a":4,"e":"부활청약 시에도 <b>최초 가입과 동일하게 계약 전 알릴 의무가 적용</b>되므로, 고의·중과실로 알리지 않으면 고지의무 위반이 된다."},{"t":"계약의 기본요소","q":"보험계약의 기본요소에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험(계약)의 목적은 손해보험에만 있는 개념으로 피보험이익을 뜻한다.","보험금액은 실제 지급되는 보험금의 최고한도액이다.","10억 원 건물을 10억 원 화재보험에 가입해 5억 원 손해를 입으면 보험금은 5억 원이다.","이미 발생한 사고를 보험사고로 하는 계약도 유효하다."],"a":4,"e":"<b>이미 발생하였거나 발생할 수 없는 것</b>을 보험사고로 하는 계약은 <b>무효</b>다."},{"t":"계약의 당사자","q":"보험계약 당사자별 권한에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["손해보험에서 보험금 청구권자는 피보험자, 인보험에서는 보험수익자다.","인보험에서 피보험자는 보험사고 발생의 대상이 되는 사람이다.","계약 전 알릴 의무(고지의무)는 보험계약자와 피보험자가 부담한다.","보험료 납입 의무는 피보험자가 부담한다."],"a":4,"e":"보험료 납입 의무는 <b>보험계약자</b>가 부담한다. 청약철회·계약취소·임의해지 권한도 보험계약자에게 있다."},{"t":"계약의 성립","q":"보험계약의 성립과 승낙에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험료 상당액의 전부 또는 일부를 받은 때부터 30일 내에 승낙 여부를 통지해야 한다.","30일이 지나도 통지가 없으면 승낙한 것으로 본다.","승낙 전 사고가 발생해도 청약을 거절할 사유가 없는 한 보험금 지급책임이 있다.","생명보험의 경우 청약서 접수일부터 30일을 기산한다."],"a":4,"e":"생명보험의 경우 기산점은 <b>신체검사를 받은 날</b>이다(상법 제638조의2)."},{"t":"보험약관","q":"보험약관의 해석 원칙으로 <u>옳지 않은</u> 것은?","o":["약관과 다르게 개별 합의한 사항이 있으면 개별약정이 우선한다.","약관 내용이 애매모호하면 작성자인 보험회사에 불이익하게 해석한다.","특별약관은 보통약관보다 우선 적용된다.","약관은 상대방이 누구인지에 따라 달리 해석해야 한다."],"a":4,"e":"약관은 <b>일반적이고 객관적으로</b> 해석해야 하며, 상대방에 따라 달리 해석하지 않는다."},{"t":"보험료 산정","q":"3이원 방식의 예정률과 보험료의 관계로 <u>옳지 않은</u> 것은?","o":["예정사망률이 낮아지면 사망보험료는 싸지고 생존보험료는 비싸진다.","예정이율이 낮아지면 보험료는 비싸진다.","예정사업비율이 낮아지면 보험료는 싸진다.","예정이율이 높아지면 보험료는 비싸진다."],"a":4,"e":"예정이율(예정할인율)이 <b>높아지면 보험료는 싸진다</b>. 미래 운용수익을 더 크게 가정해 미리 할인해주기 때문이다."},{"t":"보험료 구성","q":"보험료의 구성에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["영업보험료는 순보험료와 부가보험료로 구성된다.","순보험료는 위험보험료와 저축보험료로 나뉜다.","부가보험료는 신계약비와 유지비 등 경비의 재원이며 예정사업비율을 기초로 산정한다.","저축성보험은 납입 원금 전액에 이자가 붙어 은행 예금과 동일하다."],"a":4,"e":"저축성보험은 <b>위험보험료와 부가보험료를 제외한 나머지</b>에 이자가 붙고, 사업비를 초기에 많이 공제하므로 초기 해지 시 환급금이 적거나 없을 수 있다."},{"t":"주계약과 특약","q":"주계약과 특약, 갱신형·비갱신형에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["주계약은 보장항목을 임의로 제외하거나 변경할 수 없다.","특약에는 의무부가 특약, 선택 특약, 제도적 특약이 있다.","갱신형은 초기 보험료가 저렴하지만 갱신 시점에 보험료가 인상될 가능성이 높다.","순수보장형은 만기환급금이 있어 만기환급형보다 보험료가 비싸다."],"a":4,"e":"순수보장형은 <b>만기환급금이 없는 대신 보험료가 저렴</b>하고, 만기환급형은 적립분이 있어 보험료가 더 비싸다."},{"t":"민영보험과 공영보험","q":"민영보험과 공영보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["공영보험(사회보험)에는 국민연금, 국민건강보험, 산재보험, 고용보험, 노인장기요양보험이 있다.","정액보험에는 생명·연금·상해·질병보험 등이 해당한다.","부정액(손해)보험에는 화재·해상·운송·자동차보험 등이 해당한다.","산재보험은 근로자가 전액 보험료를 부담하는 임의보험이다."],"a":4,"e":"산재보험은 국가가 <b>사업주로부터 보험료를 징수</b>해 사업주를 대신해 보상하는 <b>의무보험</b>이다."},{"t":"자동차보험","q":"자동차보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["자동차손해배상보장법에 따라 대인배상Ⅰ과 대물배상(1건당 2천만 원)은 의무가입 대상이다.","대인배상Ⅱ는 대인배상Ⅰ을 초과하는 대인사고를 보상하는 임의배상책임보험이다.","자기차량손해는 음주운전·무면허운전 사고에도 보험회사가 보상한다.","무보험자동차에 의한 상해는 대인Ⅰ·Ⅱ, 대물배상, 자기신체사고를 모두 가입해야 가입할 수 있다."],"a":3,"e":"자기차량손해에서 피보험자의 <b>음주운전·무면허운전 사고는 보험회사 면책</b>이다."},{"t":"자동차보험","q":"자동차보험료 산출에 사용되는 요율에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기본보험료는 차량 종류·배기량·용도·가입금액·성별·연령 등에 따라 정해진다.","가입자특성요율은 보험가입기간이나 법규위반경력에 따라 적용한다.","우량할인·불량할증요율은 사고발생 실적에 따라 적용한다.","사고건수별 특성요율은 직전 10년간 사고건수에 따라 적용한다."],"a":4,"e":"사고건수별 특성요율은 <b>직전 3년간</b> 사고 유무와 건수에 따라 적용한다."},{"t":"생명보험","q":"생명보험 상품에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["정기보험은 보험기간 내 사망 시에만 주계약 보험금이 지급되며 종신보험보다 보험료가 저렴하다.","종신보험은 기간을 정하지 않고 언제 사망하더라도 보험금이 지급된다.","선지급 종신보험(CI보험)은 중대질병 발생 시 사망보험금의 일부를 미리 지급한다.","생사혼합보험(양로보험)은 사망 시에만 보험금이 지급된다."],"a":4,"e":"생사혼합보험은 <b>사망 시 사망보험금, 만기 생존 시 생존보험금</b>이 모두 지급되는, 정기보험의 보장기능과 생존보험의 저축기능이 결합된 보험이다."},{"t":"생명보험","q":"변액보험과 저·무해지보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["변액보험은 실적배당형으로 투자 책임을 전적으로 계약자가 부담한다.","변액보험도 위험보험료·부가보험료를 차감한 나머지가 투자되므로 중도 해지 시 원금에 못 미칠 수 있다.","저·무해지보험은 해지환급금을 줄이거나 없애는 대신 보험료를 낮춘 상품이다.","저·무해지보험은 중도 해지해도 환급금이 충분해 단기 가입자에게 유리하다."],"a":4,"e":"저·무해지보험은 <b>일정 기간 내 해지하면 환급금이 거의 없거나 전혀 없어</b> 끝까지 유지할 사람에게 유리하다. 저축성처럼 판매하면 불완전판매 위험이 있다."},{"t":"연금저축보험","q":"연금저축보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["납입보험료에 대해 연간 최대 600만 원까지 세액공제를 받을 수 있다.","공제율은 소득 수준에 따라 12% 또는 15%가 적용된다.","연금 개시 전 중도해지 시 공제받은 금액에 대해 기타소득세(16.5%)가 부과된다.","은행·증권사의 연금저축상품과 동일하게 사망보험금 지급 기능은 없다."],"a":4,"e":"연금저축보험은 순수 적립식인 연금저축펀드·신탁과 달리 <b>사망 등 보험사고 시 사망보험금을 지급</b>받을 수 있다는 차별성이 있다."},{"t":"제3보험","q":"제3보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["생명보험의 정액보상적 특성과 손해보험의 실손보상적 특성을 동시에 갖는다.","상해보험, 질병보험, 간병보험으로 구분된다.","상해사고는 급격하고 우연한 외래의 사고로 인한 신체 손상이어야 한다.","생명보험회사만 취급할 수 있고 손해보험회사는 취급할 수 없다."],"a":4,"e":"제3보험은 <b>생명보험회사와 손해보험회사 모두 자유롭게 참여</b>할 수 있다."},{"t":"제3보험","q":"질병보험(암보험)의 책임개시와 보험금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["암은 보험기간 첫날부터 90일이 지난 날의 다음 날을 책임개시일로 한다.","가입 후 1년 이내 발병한 암은 보험금을 50% 감액해 지급할 수 있다.","암 진단확정은 병리학적 진단을 우선하되 불가능할 경우 임상학적 진단도 인정한다.","질병보험은 계약일 이전에 발병한 질병도 보험사고로 인정해 보험금을 지급한다."],"a":4,"e":"질병보험은 원칙적으로 <b>보험계약일 또는 책임개시일 이후에 발병한 질병</b>만 보험사고로 인정한다."},{"t":"실손의료보험","q":"실손의료보험에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["국민건강보험이 보장하지 않는 개인부담금을 일정 한도 내에서 보장한다.","정액보험이 아니므로 여러 개 가입해도 실제 부담 의료비를 초과해 보상받을 수 없다.","대표적인 갱신형 보험으로 나이와 손해율에 따라 보험료가 오를 수 있다.","4세대 실손의료보험의 재가입 주기는 15년이다."],"a":4,"e":"2·3세대의 재가입 주기는 15년, <b>4세대는 5년</b>이다."},{"t":"가입단계 유의사항","q":"보험 가입 단계의 유의사항으로 <u>옳지 않은</u> 것은?","o":["약관·청약서 미전달, 중요내용 미설명, 자필서명 누락 시 성립일부터 3개월 이내 취소할 수 있다.","보험설계사는 고지의무 수령권이 없으므로 청약서 질문표에 사실대로 기재해야 한다.","보험계약자와 피보험자가 다른 사망보험은 가입 전 피보험자의 서면동의를 받아야 한다.","피보험자의 서면동의를 가입 후에 받으면 계약은 유효하게 된다."],"a":4,"e":"가입 전 서면동의가 없으면 계약은 <b>무효</b>이며, 가입 후 동의·묵시적 승인·추인 등 어떤 방법으로도 유효가 되지 않는다."},{"t":"보험금 지급단계","q":"보험금 지급과 소멸시효에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험금은 서류접수 후 3영업일(조사 필요 시 10영업일) 이내에 지급해야 한다.","기간 내 지급하지 못하면 그 기간만큼 이자를 더해 지급해야 한다.","보험금 청구권은 3년간 행사하지 않으면 소멸시효가 완성된다.","금융감독원에 민원을 제기하면 소멸시효가 중단된다."],"a":4,"e":"소멸시효 중단은 <b>재판청구·압류·가압류·가처분</b> 등 법적 조치가 있어야 한다. 내용증명이나 금감원·소비자원 민원은 중단사유가 <b>아니다</b>."}]},{"id":"p1c08","part":1,"no":"08","title":"인생설계와 연금","src":"pp.167–192","qs":[{"t":"재테크와 재무설계","q":"재테크와 재무설계의 차이에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["재테크는 보유자금을 효율적으로 운용해 최대 이익을 창출하는 방법을 의미한다.","재무설계는 개인의 삶과 목표를 파악해 재무적·비재무적 자원을 관리하는 과정이다.","재무설계는 한 번의 계획과 실천으로 완성되는 일회성 작업이다.","재테크가 자산 증식에 목적이 있다면 재무설계는 증식된 자산이 재무목표에 쓰이도록 한다."],"a":3,"e":"재무목표는 시간·환경·가치관 변화에 따라 수정되므로, 재무설계는 <b>정기적으로 수정·보완되는 과정</b>이다."},{"t":"재무설계의 영역","q":"재무설계의 영역에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["위험관리는 예기치 않은 재무적 손실 노출을 관리하는 전략 수립에 중점을 둔다.","은퇴설계는 은퇴 이후 기대하는 라이프 스타일 달성에 목적을 둔다.","상속설계는 개인의 사전·사후 자산의 원활한 이전에 목적을 두며 세금설계와 깊이 연관된다.","각 재무설계 영역은 서로 독립적이므로 개별적으로만 검토하면 된다."],"a":4,"e":"모든 재무적 결정은 서로 영향을 주고받으므로 각 영역은 <b>통합적으로 고려</b>해야 한다."},{"t":"재무설계의 영역","q":"다양한 재무목표를 동시에 고려한 재무설계를 무엇이라 하는가?","o":["단일재무설계(Modular Financial Planning)","복합재무설계(Multi-purpose Financial Planning)","종합재무설계(Comprehensive Financial Planning)","부분재무설계(Partial Financial Planning)"],"a":3,"e":"하나의 목표만 다루면 <b>단일재무설계</b>, 우선순위를 두고 몇 가지를 동시에 달성하면 <b>복합재무설계</b>, 다양한 목표를 동시에 고려하면 <b>종합(생애)재무설계</b>다."},{"t":"재무설계의 과정","q":"재무설계의 과정 순서로 옳은 것은?","o":["재무목표 설정 → 재무상태 분석 → 대안 모색 및 실행 → 점검 및 수정","재무상태 분석 → 재무목표 설정 → 점검 및 수정 → 대안 모색 및 실행","대안 모색 및 실행 → 재무목표 설정 → 재무상태 분석 → 점검 및 수정","재무목표 설정 → 대안 모색 및 실행 → 재무상태 분석 → 점검 및 수정"],"a":1,"e":"①재무목표 설정 → ②재무상태 분석(자산부채상태표·현금흐름표) → ③대안 모색 및 실행 → ④점검 및 수정의 순환 과정이다."},{"t":"재무제표","q":"자산부채상태표와 현금흐름표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["자산부채상태표는 특정 시점의 자산과 부채 상태를 파악하기 위한 것이다.","자산부채상태표는 좌변의 자산 합계와 우변의 부채+순자산 합계가 일치해야 한다.","현금흐름표는 일정 기간 동안의 유입과 유출 흐름을 파악하는 것이다.","현금흐름표는 특정 시점의 순자산 규모를 보여주는 표이다."],"a":4,"e":"특정 시점의 순자산을 보여주는 것은 <b>자산부채상태표</b>다. 현금흐름표는 <b>일정 기간</b>의 자금 과부족을 분석한다."},{"t":"은퇴설계","q":"은퇴설계의 이론적 근거인 생애주기가설에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["개인은 생애 전체에 걸친 평균적인 소득을 기준으로 재무적 의사결정을 한다.","소득수준은 생애주기에 따라 차이가 있으나 소비수준은 일정하게 유지하려 한다.","소비에 비해 소득이 적은 시기에는 대출이 이루어진다.","소비에 비해 소득이 많은 시기에도 저축보다 소비를 늘리는 것이 합리적이다."],"a":4,"e":"소득이 소비보다 많은 시기에는 <b>저축 또는 부채상환</b>이 이루어진다는 것이 생애주기가설의 핵심이다."},{"t":"은퇴설계","q":"생애주기모형의 단계 구분으로 옳은 것은?","o":["사회초년기 → 가족형성기 → 가족확장기 → 가족성숙기 → 노후생활기","가족형성기 → 사회초년기 → 가족성숙기 → 가족확장기 → 노후생활기","사회초년기 → 가족확장기 → 가족형성기 → 노후생활기 → 가족성숙기","가족형성기 → 가족확장기 → 사회초년기 → 가족성숙기 → 노후생활기"],"a":1,"e":"사회초년기(20~30대) → 가족형성기(30~40대) → 가족확장기·자녀성장기(40~50대) → 가족성숙기(50~60대) → 노후생활기(60~70대 이후)."},{"t":"은퇴설계","q":"은퇴설계에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["은퇴설계에서 가장 큰 재원은 시간이므로 일찍부터 준비할수록 완성도가 높아진다.","은퇴설계는 돈만의 문제가 아니라 은퇴 후 생활양식에 관한 문제이기도 하다.","비재무적 은퇴설계에는 건강, 커리어디자인, 거주지역, 취미활동 등이 포함된다.","재무적 은퇴설계를 먼저 마친 뒤에야 비재무적 요소를 검토할 수 있다."],"a":4,"e":"거주지역 변경, 취미활동 등 <b>비재무적 요소가 재무적 은퇴설계보다 선행</b>되어야 한다."},{"t":"연금제도","q":"우리나라 연금제도의 3층 구조에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["1층은 공적연금으로 국민연금과 특수직역연금이 있다.","2층은 퇴직연금으로 민간기업의 퇴직연금과 특수직역의 퇴직수당이 있다.","3층은 개인연금으로 적격연금과 비적격연금 등이 있다.","3층 개인연금은 법률상 의무 가입 대상이다."],"a":4,"e":"개인연금은 개인이 여유 있는 생활을 위해 <b>선택적으로 가입</b>하는 연금이다."},{"t":"국민연금","q":"국민연금 급여에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["연금 급여에는 노령연금, 장애연금, 유족연금이 있다.","일시금 급여에는 반환일시금과 사망일시금이 있다.","노령연금은 가입기간 10년 이상이고 지급연령에 도달한 가입자에게 지급된다.","유족연금의 최우선 순위 유족은 부모 → 배우자 → 자녀 순이다."],"a":4,"e":"유족연금의 순위는 <b>배우자 → 자녀 → 부모 → 손자녀 → 조부모</b> 순이다."},{"t":"국민연금","q":"조기노령연금에 대한 설명으로 옳은 것은?","o":["연금 개시를 1년 앞당길 때마다 연금수령액이 6%씩 감소한다.","연금 개시를 앞당겨도 수령액은 동일하다.","연금 개시를 1년 앞당길 때마다 수령액이 6%씩 증가한다.","소득이 있어도 자유롭게 신청할 수 있으며 감액이 없다."],"a":1,"e":"조기 수령 시 <b>1년당 6%씩 감액</b>된다. 반대로 수령을 늦추면 연금액을 가산해주는 <b>연기제도</b>도 있다."},{"t":"특수직역연금","q":"군인연금이 공무원연금과 다른 점으로 <u>옳지 않은</u> 것은?","o":["전투에 종사한 기간은 기본재직기간에 2배를 가산해 총 3배로 계산한다.","퇴역연금에 연금지급개시연령을 두지 않고 최소가입기간(19년 6개월)만 충족하면 바로 지급한다.","국가보상제도로서의 특성이 강하다.","재원조달이나 연금급여 체계가 공무원연금과 전혀 다른 별개의 구조다."],"a":4,"e":"군인연금은 재원조달·연금급여 등에서 공무원연금과 <b>거의 동일한 체계</b>를 지니되 부분적으로 차이가 있다."},{"t":"기초연금","q":"기초연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["만 65세 이상이고 소득인정액이 선정기준액 이하인 사람에게 지급한다.","기준연금액은 전년도 기준연금액에 전국 소비자물가변동률을 반영해 매년 고시한다.","소득·재산이 많거나 받는 국민연금액이 많으면 적게 받을 수 있다.","만 65세 생일이 지난 뒤에만 신청할 수 있다."],"a":4,"e":"만 65세 생일이 속한 달의 <b>1개월 전부터</b> 신청할 수 있다."},{"t":"퇴직연금","q":"확정급여형(DB)과 확정기여형(DC) 퇴직연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["DB형은 회사가 적립금을 운용하고 근로자에게 정해진 금액을 지급한다.","DB형 퇴직급여는 퇴직 직전 3개월 평균급여 × 근속연수로 산정된다.","DC형은 회사가 매년 연간 임금총액의 1/12 이상을 적립하고 근로자가 운용한다.","DC형은 운용손익이 회사에 귀속되므로 근로자는 운용 결과와 무관하다."],"a":4,"e":"DC형은 <b>근로자가 직접 운용</b>하므로 운용손익도 근로자에게 귀속된다. 운용손익이 회사에 귀속되는 것은 DB형이다."},{"t":"퇴직연금","q":"퇴직연금 유형 선택에 대한 설명으로 옳은 것은?","o":["임금상승률이 높고 장기근속이 가능한 기업의 근로자에게는 DB형이 유리하다.","파산위험이 있는 회사의 근로자에게는 DB형이 유리하다.","임금피크제에 진입한 근로자에게는 DB형이 유리하다.","퇴직급여를 연금이 아닌 일시금으로 받으면 세금부담이 30% 경감된다."],"a":1,"e":"DB형은 마지막 연도 임금 기준이므로 임금상승률이 높고 장기근속이 가능할 때 유리하고, 파산위험·임금피크제 진입 시에는 <b>DC형</b>이 유리하다. 세금 30% 경감은 <b>연금</b>으로 수령할 때다."},{"t":"퇴직연금","q":"개인형퇴직연금(IRP)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["퇴직 시 수령한 퇴직급여를 운용하거나 재직 중 추가 적립할 수 있는 계좌다.","2017년 7월 이후에는 자영업자 등도 IRP를 설정할 수 있다.","개인연금(연금저축)과 합산하여 최고 900만 원까지 세액공제를 받을 수 있다.","근로자만 가입할 수 있고 세액공제 한도는 연금저축과 별도로 적용된다."],"a":4,"e":"자영업자도 가입할 수 있으며, 세액공제는 연금저축과 <b>합산해 최고 900만 원</b>까지다."},{"t":"개인연금","q":"세제적격연금(연금저축)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["납입액 중 연간 최대 600만 원에 대해 세액공제를 받을 수 있다.","총급여 5,500만 원 이하는 16.5%, 초과는 13.2%의 공제율이 적용된다.","연금 수령 시 연금소득세(3.3~5.5%)를 부담한다.","가입기간 3년 이상이고 만 45세 이후부터 연금을 수령할 수 있다."],"a":4,"e":"연금저축은 <b>가입기간 5년 이상, 만 55세 이후 10년 이상</b>에 나누어 수령해야 한다."},{"t":"개인연금","q":"연금저축 상품 비교로 <u>옳지 않은</u> 것은?","o":["연금저축신탁과 연금저축보험은 예금자보호 대상이다.","연금저축펀드는 실적배당형으로 원금손실 위험이 있다.","연금저축보험은 정해진 금액을 정해진 시기에 납부해야 한다.","종신형 연금 수령은 연금저축펀드에서만 가능하다."],"a":4,"e":"종신형 수령은 <b>생명보험회사의 연금저축보험</b>에서 가능하다. 신탁·펀드는 10년 이상 확정기간형이다."},{"t":"개인연금","q":"세제비적격연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보험료 납입 시 세제혜택이 없는 대신 일정 조건 충족 시 이자소득세 15.4%를 면제받는다.","월적립식은 연간 1,800만 원 이하로 5년 이상 납입하고 10년 이상 유지해야 비과세된다.","생명보험회사에서만 가입할 수 있다.","세제적격연금과 동일하게 만 55세부터만 연금 수령이 가능하다."],"a":4,"e":"세제비적격연금은 세제적격연금과 달리 <b>45세부터</b> 연금 수령과 <b>종신형</b> 수령이 가능하다."},{"t":"기타연금","q":"주택연금(역모기지론)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["공시가격 12억 원 이하 주택을 소유한 만 55세 이상 고령자가 가입할 수 있다.","한국주택금융공사가 은행에 보증서를 발급하고 은행이 연금을 지급하는 구조다.","부부 중 한 사람이 사망해도 연금액 감액 없이 종신으로 지급한다.","연금지급총액이 주택 처분가격을 초과하면 상속인에게 차액을 청구한다."],"a":4,"e":"연금지급총액이 처분가격을 초과해도 <b>상속인에게 청구하지 않는다</b>. 반대로 처분가격이 더 크면 차액을 상속인에게 지급한다."},{"t":"기타연금","q":"농지연금에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["한국농어촌공사가 만 60세 이상, 영농경력 5년 이상 고령농업인에게 지급한다.","연금 수령 중에도 담보농지를 직접 경작하거나 임대해 추가소득을 얻을 수 있다.","부부 중 한 사람이 사망하면 배우자에게 승계할 수 없어 연금이 종료된다.","연금채무 상환 시 부족액이 발생해도 상속인에게 청구하지 않는다."],"a":3,"e":"승계 당시 배우자가 <b>만 55세 이상</b>이면 승계하여 농지연금을 계속 지급받을 수 있다."}]},{"id":"p1c09","part":1,"no":"09","title":"금융소비자보호 주요 제도","src":"pp.193–208","qs":[{"t":"금융소비자보호의 필요성","q":"금융소비자가 금융회사에 비해 열위에 놓이는 이유로 학계가 지적하는 것에 해당하지 <u>않는</u> 것은?","o":["자본금 기준이 높아 신규 진입이 어려워 독과점적 산업구조가 형성된다.","금융회사와 소비자 사이에 교섭력의 불균형이 존재한다.","금융상품의 복잡성·전문성으로 인해 정보의 비대칭성이 존재한다.","금융상품은 일반 재화보다 가격 협상의 폭이 넓고 교체가 쉽다."],"a":4,"e":"금융상품은 일반 재화와 달리 <b>가격 협상의 폭이 제한적</b>이고, 계약 체결 후에는 추가 비용·손실 없이 교체하기 어렵다."},{"t":"금융소비자보호의 목적","q":"금융소비자보호의 목적에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["공정한 금융질서를 확립해 정보력과 협상력의 불균형을 시정한다.","금융소비자의 신뢰를 높여 금융산업의 질적 성장을 뒷받침한다.","재무웰빙은 현재 재무상태에 대한 안정감과 미래 목표 달성 확신을 포함하는 개념이다.","금융소비자보호는 장기적으로도 금융회사에 부담만 될 뿐 산업 발전에는 기여하지 못한다."],"a":4,"e":"단기적으로는 부담일 수 있으나 <b>장기적으로는 소비자 신뢰를 높이고 양질의 상품·서비스 제공을 유도</b>해 산업의 질적 성장을 뒷받침한다."},{"t":"금융소비자의 특성","q":"금융소비자의 '제한된 합리성'과 관련된 행동재무학 개념 설명으로 <u>옳지 않은</u> 것은?","o":["프레이밍 효과 — 제시 방식에 따라 태도와 행동이 달라진다.","심적회계 — 마음속 회계시스템으로 같은 돈을 다르게 인식한다.","닻내리기 효과 — 초기 정보에 과도하게 의존한다.","소유효과 — 보유 자산의 가치를 실제보다 낮게 평가한다."],"a":4,"e":"소유효과(endowment effect)는 자신이 보유한 자산의 가치를 <b>높게</b> 평가하는 경향이다."},{"t":"금융소비자의 권리","q":"금융소비자보호법이 열거한 금융소비자의 기본적 권리에 해당하지 <u>않는</u> 것은?","o":["위법한 영업행위로 인한 재산상 손해로부터 보호받을 권리","합리적인 금융생활을 위해 필요한 교육을 받을 권리","권익 증진을 위해 단체를 조직하고 활동할 권리","금융회사의 상품 가격을 직접 결정할 권리"],"a":4,"e":"금소법상 기본적 권리는 ①손해로부터 보호받을 권리 ②지식·정보를 제공받을 권리 ③정책에 의견을 반영시킬 권리 ④신속·공정한 보상을 받을 권리 ⑤교육받을 권리 ⑥단체를 조직·활동할 권리의 <b>6가지</b>다."},{"t":"국제기준","q":"OECD 금융소비자보호 10대 원칙(2011)에 해당하지 <u>않는</u> 것은?","o":["법, 규제, 감독체계 마련","감독기구 역할 강화","금융회사의 수익성 극대화","경쟁적 환경조성을 통한 선택권 보장"],"a":3,"e":"10대 원칙은 ①법·규제·감독체계 ②감독기구 역할 ③공정하고 공평한 대우 ④공시와 투명성 ⑤금융교육·인식 ⑥책임영업행위 ⑦자산 보호 ⑧개인정보 보호 ⑨불만처리·피해구제 ⑩경쟁환경 조성이다."},{"t":"국제기준","q":"OECD 금융소비자보호 원칙과 세계은행 모범규준에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["OECD 10대 원칙은 2011년 G20 정상회의에서 채택되었다.","OECD 원칙은 금융기관 직원 보수가 책임 있는 영업을 유도하도록 고안되어야 한다고 본다.","세계은행 모범규준은 2012년 6월 발표되었다.","세계은행 모범규준은 금융회사 내부 규정만을 다루며 분쟁해결제도는 포함하지 않는다."],"a":4,"e":"세계은행 모범규준은 금융소비자보호기관, 공시제도와 영업행위, 고객계좌 취급, 프라이버시·데이터 보호, <b>분쟁해결제도</b>, 지급보증·보상제도, 금융이해력, 경쟁까지 포괄한다."},{"t":"실태평가","q":"금융감독원 금융소비자보호 실태평가에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융소비자에게 거래 금융회사 선택에 유용한 정보를 제공하는 것이 목적이다.","계량항목은 민원·소송사항, 금융사고, 휴면자산 환급 등으로 구성된다.","비계량항목은 소비자보호 조직·제도, 민원관리시스템 등을 조사해 평가한다.","평가 결과는 금융회사 내부 자료로만 활용되고 대외에 공개되지 않는다."],"a":4,"e":"평가 결과는 <b>대외에 공표</b>되며, 각 금융회사·협회 홈페이지 등을 통해 항목별 등급과 내역을 공개해야 한다."},{"t":"금융소비자보호법","q":"금융소비자보호법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2020년 3월 제정되어 2021년 시행되었다.","금융상품을 예금성·대출성·보장성·투자성의 네 유형으로 구분한다.","개별 법령에 분산되어 있던 소비자보호 규정을 하나의 틀로 묶었다.","보호 대상은 전문금융소비자로 한정되며 일반금융소비자는 제외된다."],"a":4,"e":"보호 대상은 주로 <b>일반금융소비자</b>다. 전문금융소비자 중 영세하거나 개인인 경우 의사를 밝히면 일반금융소비자로서 보호받을 수 있다."},{"t":"6대 판매규제","q":"적합성 원칙과 적정성 원칙의 차이로 옳은 것은?","o":["적합성 원칙은 판매업자의 계약 체결 권유가 있는 경우에, 적정성 원칙은 소비자가 자발적으로 계약 의사를 밝힌 경우에 적용된다.","적합성 원칙은 소비자가 자발적으로 구매할 때, 적정성 원칙은 권유가 있을 때 적용된다.","두 원칙 모두 예금성 상품에 우선 적용된다.","적정성 원칙의 대상 상품 범위가 적합성 원칙보다 넓다."],"a":1,"e":"<b>권유가 있으면 적합성</b>, <b>소비자가 자발적으로 구매하려 하면 적정성</b>이다. 적정성 원칙의 대상 상품 범위가 적합성보다 <b>좁다</b>."},{"t":"6대 판매규제","q":"금융소비자보호법상 6대 판매규제에 해당하지 <u>않는</u> 것은?","o":["설명의무","불공정영업행위 금지","부당권유행위 금지","최저수익 보장의무"],"a":4,"e":"6대 판매규제는 ①적합성 원칙 ②적정성 원칙 ③설명의무 ④불공정영업행위 금지 ⑤부당권유행위 금지 ⑥광고규제다."},{"t":"6대 판매규제","q":"설명의무에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["계약 체결을 권유하거나 소비자가 설명을 요청하는 경우 중요사항을 설명해야 한다.","설명서 및 핵심(요약)설명서를 일반금융소비자에게 제공해야 한다.","설명 내용을 소비자가 이해하였음을 확인하여야 한다.","중요사항 중 불리한 내용은 소비자 혼란을 막기 위해 생략할 수 있다."],"a":4,"e":"중요사항을 <b>거짓 또는 왜곡하여 설명하거나 누락해서는 안 된다</b>."},{"t":"보호 체계","q":"사전적 금융소비자보호와 사후적 금융소비자보호의 구분으로 <u>옳지 않은</u> 것은?","o":["약관심사와 영업행위준칙 감독은 사전적 보호에 속한다.","금융상품 공시 의무화와 금융소비자교육은 사전적 보호에 속한다.","민원처리, 분쟁조정, 소송은 사후적 보호에 속한다.","금융소비자교육은 사후적 보호의 대표적 수단이다."],"a":4,"e":"금융소비자교육은 금융상품 공시와 함께 <b>사전적</b> 금융소비자보호의 핵심이다."},{"t":"금융소비자교육","q":"금융소비자교육과 금융상품 공시에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["OECD 산하 금융교육 국제협의체 INFE는 조기 금융교육의 중요성을 강조한다.","우리나라는 금융위원회와 금융감독원이 주축이 되어 금융교육을 운영한다.","금융감독원은 '금융상품 한눈에'를 운영해 유사 상품의 주요 특성을 비교할 수 있게 한다.","공시자료는 정보 제공 목적일 뿐 분쟁 발생 시 책임소재 기준으로는 활용될 수 없다."],"a":4,"e":"공시자료는 시장의 데이터베이스로 기능하며 <b>분쟁 발생 시 책임소재의 기준</b>이 될 수 있다."},{"t":"사후적 보호","q":"금융민원과 금융분쟁조정에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융감독원은 통합콜센터 '1332'를 운영하여 상담을 제공한다.","금융회사를 거치지 않은 민원은 민원인과 금융회사 간 자율조정을 거친다.","분쟁조정은 양 당사자가 조정안을 수락하면 화해가 성립된다.","소액 분쟁이라도 금융회사가 수락하지 않으면 어떠한 법적 구속력도 생기지 않는다."],"a":4,"e":"<b>소액 분쟁</b>의 경우 소비자만 수락해도 금융회사의 동의와 무관하게 법적 구속력이 발생할 수 있다(편면적 구속력)."},{"t":"사후적 보호","q":"민사소송을 통한 피해구제에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["소송 절차는 소장접수 → 소장심사 → 답변서 제출 → 변론절차 → 판결 순이다.","법원 홈페이지 전자소송을 이용해 직접 소장을 제출할 수 있다.","대한법률구조공단은 경제적으로 어려운 국민에게 법률상담·소송대리를 지원한다.","소비자가 조정안을 거부하고 금융회사만 수락한 경우 금융감독원이 소송을 지원한다."],"a":4,"e":"금감원의 소송지원은 <b>소비자는 조정안을 수락했으나 금융회사가 수락하지 않아</b> 소송을 제기하는 경우에 이루어진다."}]},{"id":"p1c10","part":1,"no":"10","title":"금융소비자보호 관련 주요 이슈","src":"pp.209–232","qs":[{"t":"감독 수단","q":"금융감독원의 미스터리 쇼핑에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2009년부터 펀드, 변액보험, 파생결합증권 등에 대해 실시하고 있다.","상품추천 과정에서 적합성 원칙과 설명의무 준수 여부를 확인한다.","결과는 금융회사에 송부하여 개선계획을 점검하도록 한다.","결과는 내부 참고용일 뿐 소비자경보 발령 등에는 활용되지 않는다."],"a":4,"e":"미스터리 쇼핑 결과는 <b>소비자경보 발령이나 소비자유의사항 발표</b>에도 활용된다."},{"t":"공평한 대우","q":"금융소비자보호법상 소비자에 대한 공평한 대우 규정에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["정당한 사유 없이 성별·학력·장애·사회적 신분 등을 이유로 부당하게 차별할 수 없다.","이 조항은 선언적 성격으로 처벌 규정이 직접 명시되어 있지는 않다.","차별로 피해가 발생하면 손해배상책임이 성립할 수 있다.","처벌 규정이 없으므로 금융회사의 평판이나 신뢰에는 아무런 영향이 없다."],"a":4,"e":"처벌 규정이 없더라도 차별 행위는 <b>금융회사의 평판과 신뢰에 부정적 영향</b>을 미친다."},{"t":"소비자 자산 보호","q":"소비자의 자산 보호와 관련한 설명으로 <u>옳지 않은</u> 것은?","o":["대표적인 금융범죄로 보이스피싱, 스미싱, 파밍, 메신저 피싱 등 전기통신금융사기가 있다.","2011년 '전기통신금융사기 피해 방지 및 피해금 환급에 관한 특별법'이 제정·시행되었다.","금융회사는 이상거래탐지시스템(FDS)을 구축해 운영한다.","보이스피싱은 2006년 최초 발생 이후 현재까지 계속 급증하고 있다."],"a":4,"e":"검찰·경찰·금융당국의 예방·수사 노력으로 <b>최근에는 다소 감소하는 추세</b>다."},{"t":"경쟁","q":"금융소비자 선택권과 경쟁에 대한 설명으로 옳은 것은?","o":["약관의 규제에 관한 법률은 계약의 해제·해지를 배제하거나 제한하는 조항을 무효로 본다.","소비자의 탈퇴권을 제한해야 금융회사 간 경쟁이 촉진된다.","금융회사 간 이동을 어렵게 해야 소비자 보호에 유리하다.","경쟁은 독점·과점 상태에서 가장 활발하게 이루어진다."],"a":1,"e":"소비자의 <b>탈퇴권을 보장</b>하여 금융회사·상품 간 이동을 쉽게 함으로써 선의의 경쟁을 촉진한다."},{"t":"비대면 금융거래","q":"비대면 금융거래 확대의 배경과 혜택으로 <u>옳지 않은</u> 것은?","o":["2016년 비대면 실명확인 허용 이후 모바일 금융거래가 일상화되었다.","오픈뱅킹·마이데이터로 여러 기관의 상품을 비교해 자산관리를 효율화할 수 있다.","금융회사의 운영비 절감으로 수수료 인하 여지가 생긴다.","비대면 거래가 확대되면 금융회사 간 경쟁이 줄어 서비스 품질이 낮아진다."],"a":4,"e":"비대면거래 활성화는 오히려 <b>금융회사 간 경쟁을 자극</b>해 상품·서비스 품질 개선을 촉진한다."},{"t":"비대면 금융거래","q":"비대면 금융거래로 인한 소비자 문제로 <u>옳지 않은</u> 것은?","o":["상품설명서나 약관을 충분히 읽고 이해했는지 확인하기 어려워 불완전판매 위험이 있다.","온라인에서는 수익률 상위 상품이나 계열사 상품이 먼저 노출되어 적합성원칙 구현이 어렵다.","전 과정을 소비자가 직접 결정하므로 자기책임원칙이 강조된다.","디지털역량이 부족한 소비자도 온라인 채널을 통해 금융 접근성이 크게 향상된다."],"a":4,"e":"디지털역량이 부족한 소비자는 오히려 <b>금융소외</b>가 심화된다. 점포 폐쇄까지 겹치면 고령자 등 취약계층은 상담·민원 채널 이용조차 어려워진다."},{"t":"불완전판매","q":"불완전판매(mis-selling)에 해당하지 <u>않는</u> 것은?","o":["펀드 판매 과정에서 투자 원금이나 수익률을 보장한다고 말하는 행위","사실에 근거하지 않은 판단 자료를 제시하는 행위","펀드 가치에 중대한 부정적 영향을 미치는 사항을 알고도 알리지 않고 판매하는 행위","소비자의 투자성향을 확인한 뒤 적합한 상품을 권유하는 행위"],"a":4,"e":"적합성 원칙에 따라 투자성향을 확인하고 적합한 상품을 권유하는 것은 <b>정상적인 판매 절차</b>다."},{"t":"불완전판매","q":"불완전판매의 원인에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융시장은 진입 제한으로 독과점적 경쟁 특성을 갖는다.","금융상품의 구조가 복잡해 소비자가 직원의 권유·조언에 크게 의존한다.","판매 경쟁 심화로 직원이 충분한 이해 없이 판매 성과만 추구하는 경향이 있다.","소비자에게 모든 정보가 주어지면 언제나 합리적인 의사결정이 이루어진다."],"a":4,"e":"모든 정보가 주어져도 소비자는 정보 부족·정보 과부하·<b>제한된 합리성</b> 등으로 비합리적 행동을 하는 경우가 많다."},{"t":"불완전판매","q":"불완전판매 방지를 위한 노력으로 <u>옳지 않은</u> 것은?","o":["금융회사는 신의성실·이해상충 관리 의무와 적합성·적정성·설명의무·부당권유금지를 준수해야 한다.","설명 항목이 지나치게 많으면 책임소재 전가라는 부작용이 생길 수 있다.","소비자는 서명 전에 위험·비용·만기구조·중도해지 제한 등을 다시 점검해야 한다.","설명 항목을 최대한 늘리고 일괄 '이해하였다' 서명을 받는 것이 가장 바람직하다."],"a":4,"e":"수많은 설명 내용에 <b>일괄 서명을 유도</b>하는 것은 책임소재 전가 부작용을 낳는다. 설명의 분량·시점을 개선하고 용어를 평이하게 다듬어야 한다."},{"t":"불완전판매 사례","q":"국내 불완전판매 사례에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["OO파워인컴펀드는 안전한 정기예금처럼 안내되었으나 실제로는 장외파생상품 투자 상품이었다.","저축은행 후순위채는 위험성 설명 없이 고금리를 강조해 판매되어 사회문제가 되었다.","해외금리연계 DLF는 '손실확률 0%', '안전한 상품' 등을 강조하며 판매되었다.","불완전판매가 인정되어도 분쟁조정위원회는 손해액 전액 배상만을 결정한다."],"a":4,"e":"분쟁조정위원회는 사안별로 <b>손해금액의 일정 비율</b>을 배상하도록 결정한다(예: 파워인컴펀드 50%, DLF 40~80%)."},{"t":"개인정보보호","q":"개인정보의 정의에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["살아있는 개인에 관한 정보로서 개인을 알아볼 수 있는 정보를 말한다.","그 정보만으로는 알아볼 수 없어도 다른 정보와 쉽게 결합해 알아볼 수 있으면 포함된다.","익명 처리되어 누구에 관한 정보인지 식별이 안 되는 정보도 개인정보에 해당한다.","IT기술 발달로 생체정보 등 보호 범위가 넓어지고 있다."],"a":3,"e":"익명 처리되어 <b>식별이 불가능하면 개인정보에 속하지 않는다</b>. 이는 OECD·EU의 개인정보보호 지침과도 같은 입장이다."},{"t":"개인정보보호","q":"개인정보보호의 기본원칙에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["개인정보 자기결정권은 자신의 정보가 언제·어디까지 이용될지 스스로 결정할 권리다.","개인정보처리자는 목적 달성에 필요한 최소한의 범위로 수집을 제한해야 한다.","최소수집에 대한 입증책임은 정보주체(소비자)에게 있다.","2020년 데이터 3법 개정으로 가명정보 개념이 도입되었다."],"a":3,"e":"최소수집에 대한 <b>입증책임은 개인정보처리자</b>에게 있다."},{"t":"금융사기","q":"투자사기의 전형적 수법에 해당하지 <u>않는</u> 것은?","o":["'수익 확정지급', '원금보장', '금융기관 지급보증' 등을 강조","투자자 모집 및 추천수당 지급 등 다단계 방식 활용","유명 연예인 광고나 정·관계 유력인사와의 친분 과시","투자설명서를 교부하고 원금손실 가능성을 명확히 고지"],"a":4,"e":"원금손실 가능성을 명확히 고지하는 것은 <b>정상적인 판매 절차</b>다. 투자사기는 오히려 원금보장·확정수익을 강조한다."},{"t":"금융사기","q":"대출사기에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융회사·공공기관을 사칭해 대출을 미끼로 수수료 등을 편취하는 사기 형태다.","보증보험료, 공증료, 공탁금 등 명목으로 금전을 요구하는 유형이 있다.","체크카드·통장사본·신분증사본을 수집해 대포통장으로 활용하기도 한다.","사기범이 사칭하는 곳은 대부분 실존하지 않는 가공의 금융회사다."],"a":4,"e":"불법사금융피해신고센터 접수 분석 결과, 사기범은 캐피탈·저축은행·은행 등 <b>실제로 존재하는 제도권 금융회사</b>를 주로 사칭한다."},{"t":"금융사기","q":"전기통신금융사기 수법에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["보이스피싱은 '음성·개인정보·낚시'의 합성어로 전화를 통해 정보를 빼내거나 이체를 유도한다.","메신저피싱은 타인의 메신저 계정을 탈취해 지인으로 가장한 뒤 긴급 자금을 요구한다.","파밍은 악성코드나 도메인 조작으로 가짜 홈페이지에 접속시켜 정보를 입력하게 한다.","스미싱은 전화 통화만으로 이루어지며 악성 앱 설치와는 무관하다."],"a":4,"e":"스미싱은 <b>문자메시지(SMS) + 피싱</b>의 합성어로, 문자 링크를 클릭하면 <b>악성 앱·악성코드가 설치</b>되어 소액결제나 금융정보 탈취로 이어진다."},{"t":"금융사기","q":"다단계사기에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["인·허가를 받지 않은 불법자금 모집업체에 투자했다가 피해를 보는 유형이다.","하위 투자자의 자금으로 상위 투자자에게 배당금을 지급하는 형식으로 자금을 모집한다.","불법자금 모집업체 투자금도 예금자보호법에 따라 보호받을 수 있다.","잔여재산이 없거나 재산을 은닉해 회수가 어려운 경우가 많다."],"a":3,"e":"불법자금 모집업체에 투자한 돈은 <b>예금자보호법상 보호 대상이 아니어서</b> 일체의 보장을 받을 수 없다."},{"t":"피해 예방","q":"금융사기 피해 예방 요령으로 <u>옳지 않은</u> 것은?","o":["공공기관·금융회사는 어떤 경우에도 금전 이체를 요구하거나 금융거래정보를 수집하지 않는다.","대출받기 전에 선입금을 요구하면 100% 대출사기다.","출처가 불분명한 파일이나 인터넷 주소가 포함된 메시지는 클릭하지 않고 즉시 삭제한다.","가까운 지인에게는 통장이나 현금카드, 계좌 비밀번호를 빌려주어도 무방하다."],"a":4,"e":"통장을 <b>대여하거나 사고파는 행위는 명백한 불법</b>으로 형사처벌을 받을 수 있다."},{"t":"피해구제","q":"금융사기 피해구제 절차에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["사기범에게 속아 송금한 경우 금융회사 콜센터나 경찰청(112)에 지급정지를 요청한다.","피해금이 인출되지 않고 남아 있으면 피해금 환급제도로 소송 없이 되찾을 수 있다.","통장·현금카드를 분실하거나 대여·양도한 경우 금융회사에 이용정지를 요청해야 한다.","지급정지만 해두면 별도 조치 없이 자동으로 피해금이 환급된다."],"a":4,"e":"피해금 환급을 받으려면 <b>3일 이내 사건사고사실확인원을 작성</b>하는 등 환급 절차를 밟아야 한다."},{"t":"피해구제","q":"개인정보 유출 대응 수단에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["개인정보노출자 사고예방 시스템은 금감원 파인에 등록해 명의도용을 예방한다.","계좌정보통합관리서비스로 본인 모르게 개설된 계좌나 대출을 확인할 수 있다.","명의도용방지서비스로 본인 명의 휴대전화 가입 현황을 조회할 수 있다.","개인정보침해신고센터는 금융감독원이 운영하며 대표번호는 1332이다."],"a":4,"e":"개인정보침해신고센터는 <b>한국인터넷진흥원(KISA)</b>이 운영하며 대표번호는 <b>118</b>이다."},{"t":"피해 예방","q":"비대면 금융사기 예방을 위한 보안서비스에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["비대면 계좌개설 안심차단은 모든 금융회사의 비대면 수시입출식 계좌개설을 일괄 차단한다.","여신거래 안심차단은 모든 금융회사의 여신성 금융거래를 일괄 차단한다.","지연이체 서비스는 이체 시 수취인 계좌에 기본 3시간 후 입금되도록 한다.","입금계좌 지정 서비스는 지정하지 않은 계좌로도 금액 제한 없이 송금할 수 있게 한다."],"a":4,"e":"입금계좌 지정 서비스는 미리 지정하지 않은 계좌로는 <b>소액 송금만</b> 가능하도록 제한하는 서비스다."}]},{"id":"p1c11","part":1,"no":"11","title":"디지털 금융의 이해","src":"pp.233–256","qs":[{"t":"디지털 전환","q":"금융의 디지털 전환에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["기존 금융의 종합금융서비스를 개별 서비스 단위로 분리해체(Unbundling)한다.","간편결제, 간편송금, 조각투자, 로보어드바이저 등 특화된 서비스로 확장한다.","디지털 전환은 금융의 본질과 기능 자체를 근본적으로 바꾸는 변화이다.","금융기능을 제공하는 주체와 방법의 변화이지 기능 자체의 변화는 아니다."],"a":3,"e":"디지털 전환은 <b>주체(by whom)와 방법(how to)의 변화</b>이지 객체인 <b>기능(what to)의 변화가 아니다</b>. 즉 '방법론적 혁신적 변화'다."},{"t":"핀테크","q":"핀테크 산업이 부상하게 된 배경으로 <u>옳지 않은</u> 것은?","o":["2008년 금융위기로 기존 금융에 대한 신뢰가 깨지고 대안 금융 수요가 증가했다.","인터넷 발달로 소비자가 과거보다 많은 금융정보에 접근할 수 있게 되었다.","모바일 기술 발전과 MZ세대의 기술친화력으로 모바일 금융거래가 급증했다.","금융회사의 오프라인 점포가 급격히 늘어나 대면 서비스 수요가 커졌다."],"a":4,"e":"오히려 <b>비대면·모바일 채널</b>의 확산이 핀테크 성장 환경을 조성했다."},{"t":"규제 샌드박스","q":"규제 샌드박스에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["영국 금융행위감독청(FCA)이 2016년 최초로 도입했다.","혁신적 아이디어를 규제 유예·면제하에 일정기간 시장에서 테스트할 수 있게 하는 제도다.","한국은 2019년 4월 「금융혁신지원 특별법」 제정으로 본격 시행했다.","혁신금융서비스로 지정되면 기간 제한 없이 영구적으로 규제가 면제된다."],"a":4,"e":"혁신금융서비스로 지정되면 <b>최대 4년까지</b> 기존 규제의 제약 없이 서비스를 실험할 수 있다."},{"t":"블록체인","q":"블록체인 기술에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["정보를 분산 저장하고 참여자 누구나 진위를 검증할 수 있도록 설계된 기술이다.","블록은 거래정보를 담는 단위이고 체인은 블록이 시간 순서로 연결되는 구조다.","네트워크 참여자 전체가 공동으로 장부를 소유·유지하는 분산원장이다.","한 번 기록된 원장은 어떤 경우에도 절대 변경할 수 없다."],"a":4,"e":"'51% 룰'에 따라 네트워크의 <b>51%가 동의하면 원장도 변경 가능</b>하다. 동의를 얻기가 매우 어렵다는 것이지 원천적으로 차단된 것은 아니다."},{"t":"빅데이터","q":"빅데이터의 5V에 해당하지 <u>않는</u> 것은?","o":["Volume(데이터 양)","Velocity(생성·처리속도)","Variety(유형 및 다양성)","Visibility(가시성)"],"a":4,"e":"5V는 Volume, Velocity, Variety(3V)에 <b>Veracity(신뢰성·정확성)</b>와 <b>Value(가치)</b>를 더한 것이다."},{"t":"빅데이터","q":"빅데이터에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["사진, 글, 목소리, 좋아요 수, 댓글 등 비정형 데이터도 포함한다.","빅데이터는 단순히 데이터의 양이나 크기를 의미하는 개념이다.","Veracity는 오류·누락·편향이 없는 신뢰 가능한 데이터 확보를 의미한다.","Value는 단순 수집이 아니라 분석을 통해 유의미한 인사이트를 도출하는 것을 뜻한다."],"a":2,"e":"빅데이터는 <b>다양한 범주의 데이터를 총칭</b>하는 개념이지, 데이터의 양이나 크기만을 의미하지 않는다."},{"t":"디지털 금융 용어","q":"디지털 화폐(CBDC)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["각국 중앙은행이 발행하는 디지털 형태의 법정통화다.","중앙집중형 시스템에서 유통된다.","중국의 디지털 위안화, 유럽의 디지털 유로가 관련 사례다.","중앙은행이 국민 개별계좌를 관리하게 되므로 사생활 침해 우려가 전혀 없다."],"a":4,"e":"중앙은행이 개별계좌 관리 주체가 되면 <b>사생활 침해의 개연성</b>이 발생하므로, 대부분의 국가가 매우 신중하게 접근하고 있다."},{"t":"디지털 금융 용어","q":"암호자산과 스테이블코인에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["암호자산을 보관·거래하려면 디지털 지갑이 필요하며 이는 소프트웨어다.","스테이블코인은 법정화폐나 실물자산과 1:1 연동해 가격 변동성을 최소화한다.","각국 규제당국은 비트코인을 화폐가 아닌 암호화된 자산으로 정리하고 있다.","모든 스테이블코인은 테더처럼 법정화폐 담보 방식으로만 운영된다."],"a":4,"e":"<b>알고리즘</b>으로 안정성을 유지하거나 <b>다른 암호자산을 담보</b>로 활용하는 스테이블코인도 있다."},{"t":"디지털 금융 용어","q":"디지털 은행(Neobank)에 대한 설명으로 옳은 것은?","o":["전통적 오프라인 지점 없이 온라인으로만 운영되는 은행으로 '인터넷 전문은행'이라고도 한다.","기존 은행이 제공하는 인터넷뱅킹과 동일한 개념이다.","반드시 오프라인 지점을 일정 수 이상 보유해야 한다.","국내에는 아직 사례가 없다."],"a":1,"e":"기존 은행의 인터넷뱅킹과는 <b>구별</b>되며, 해외는 Revolut·Monzo, 국내는 케이뱅크·카카오뱅크·토스뱅크가 사례다."},{"t":"디파이","q":"디파이(DeFi)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["블록체인에서 가상자산과 스마트계약을 기반으로 운영되며 중개기관 없이 작동한다.","금융회사(중앙주체)의 승인·허가를 필요로 하지 않는다.","거래매체로는 가치 안정성이 중요하므로 스테이블코인이 활용된다.","디파이에서 서비스 이행의 주체는 서비스를 개발한 개발자이다."],"a":4,"e":"디파이에서 서비스 이행 주체는 개발자가 아니라 <b>블록체인 네트워크 자체</b>다. 그래서 네트워크가 유지되는 한 기계적으로 이행된다."},{"t":"디파이","q":"디파이와 기존 금융회사 서비스의 차이로 옳은 것은?","o":["디파이는 별도의 자본금이나 전산설비 투자 없이도 누구나 금융서비스의 주체가 될 수 있다.","디파이도 기존 금융회사처럼 물적·인적 요건을 충족해야 서비스를 제공할 수 있다.","디파이는 중개비용이 기존 금융보다 훨씬 크다.","디파이는 서비스 규칙을 생성하는 주체를 금융당국이 엄격히 제한한다."],"a":1,"e":"디파이는 진입 요건이 없어 누구나 서비스를 만들 수 있고, 이용자는 <b>중개비용을 크게 줄일</b> 수 있다. 다만 그만큼 위험요인도 크다."},{"t":"디파이","q":"디파이 금융의 문제점으로 <u>옳지 않은</u> 것은?","o":["스마트계약의 작은 버그나 보안결함이 큰 금전적 손실로 이어질 수 있다.","명확한 규제 틀이 미비해 사용자와 개발자가 법적 리스크에 노출된다.","블록체인 거래는 확정되면 취소·수정이 거의 불가능해 실수나 해킹 시 복구가 어렵다.","완전히 분산되어 있어 단일 장애점(Single Point of Failure)이 존재하지 않는다."],"a":4,"e":"대부분의 디파이 프로젝트가 특정 스마트계약·플랫폼·스테이블코인에 의존해 있어 <b>단일 장애점이 존재</b>한다."},{"t":"포용금융","q":"디지털 포용금융에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융소외계층이 차별 없이 금융서비스에 접근하도록 지원하는 정책·서비스의 총체다.","세계은행은 비용효율적 디지털 수단으로 지속가능하게 서비스를 제공하는 것으로 정의한다.","케냐의 M-Pesa는 은행 없이 휴대폰만으로 송금·결제가 가능하게 한 사례다.","인도의 Aadhaar·UPI는 민간 기업이 단독으로 구축한 폐쇄형 결제 시스템이다."],"a":4,"e":"인도의 Aadhaar·Jan Dhan Yojana·UPI는 <b>국가 인프라 기반</b> 사례로, 생체인식 디지털 ID와 대국민 계좌 개설, 실시간 결제 인프라를 구축한 것이다."},{"t":"위험요소","q":"디지털 금융서비스의 위험요소와 제도적 경감방안 연결로 <u>옳지 않은</u> 것은?","o":["사이버리스크 — 데이터 보안정책 수립과 주기적 사이버보안 평가","무분별한 정보수집 및 동의 — 순차적 동의, 유효기간 설정 등 선택적 동의 방식","알고리즘의 오류나 남용 — 알고리즘의 설명 가능성 및 투명성 개선","고령소비자 소외 — 오프라인 통합지점을 폐쇄하고 온라인 전환을 가속"],"a":4,"e":"고령소비자 소외의 경감방안은 <b>대면 통합지점 활용</b>, 고령층 전용앱, 특화 금융교육 제공 강화다."},{"t":"디지털 금융교육","q":"디지털 금융교육의 핵심요소로 <u>옳지 않은</u> 것은?","o":["예금·대출·이자·신용 등 기초 금융지식의 습득","피싱·스미싱 등 금융사기 예방 및 개인정보보호","생성형 AI가 제공하는 금융정보는 항상 정확하므로 그대로 신뢰하고 활용하기","책임 있는 소비와 윤리적 금융행동에 대한 이해"],"a":3,"e":"AI 도구를 <b>비판적으로 활용</b>하는 'AI 리터러시'가 새로운 핵심요소다. 정보를 선별하고 교차 검증하는 비판적 사고력이 필수적이다."},{"t":"관련 법률","q":"디지털 금융 관련 법률에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["전자금융거래법은 전자금융거래의 안전성·신뢰성 확보와 접근매체 관리의무를 규정한다.","신용정보법은 2020년 개정을 통해 마이데이터 산업의 근거를 마련하였다.","금융혁신지원 특별법은 금융규제 샌드박스 운영의 근거 법률이다.","특정금융정보법(특금법)은 가상자산사업자를 규제 대상에서 제외하고 있다."],"a":4,"e":"2023년 3월 시행된 개정안을 통해 <b>가상자산사업자(VASP)도 규제 대상에 포함</b>되어 실명확인 입출금계좌 사용의무가 부여되었다."},{"t":"관련 법률","q":"마이데이터 제도에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2020년 1월 데이터 3법 개정 시 신용정보법 개정에 포함되었다.","2022년 1월부터 본격 시행되었다.","개인에게 자신의 금융정보를 통합 조회·관리하고 제공할 주체적 권한을 부여한다.","사업자는 별도의 등록 절차 없이 자유롭게 마이데이터 사업을 할 수 있다."],"a":4,"e":"마이데이터 사업자는 <b>금융위원회 등록 의무</b>가 있으며, 개인정보의 안전한 전송과 정보주체 동의절차가 강화되어 있다."},{"t":"관련 법률","q":"가상자산 관련 국내 법제화에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2024년 7월 '가상자산이용자보호법'이 시행되었다.","가상자산이용자보호법은 거래소 보관·감독 강화와 이용자 보호조치를 포함한다.","디지털자산기본법은 사업자 등록제, 시장 감시체계, 투자자 보호 장치 등을 담고 있다.","유럽연합의 암호자산 규제법(MiCA)은 한국의 법제화를 뒤따라 제정되었다."],"a":4,"e":"EU는 <b>2024년 말 MiCA를 통과</b>시켜 2025년부터 적용하는 등, 오히려 국제적으로 규제 정비가 앞서 진행되었다."}]},{"id":"p2c01","part":2,"no":"01","title":"금융교육의 기본 개념","src":"pp.259–272","qs":[{"t":"금융교육의 의미","q":"금융교육(financial education)의 범위에 대한 설명으로 옳은 것은?","o":["정부 예산, 세입·세출 등 거시 금융을 주로 다룬다.","기업의 사업자금 조달, 주식·채권 발행 등 기업 금융을 주로 다룬다.","개인이나 가계의 돈 흐름과 자산관리를 다루는 개인 금융에 특화된 교육이다.","개인 금융, 기업 금융, 거시 금융을 모두 균등하게 다룬다."],"a":3,"e":"금융교육은 <b>개인 금융(personal finance)</b>에 특화한 교육으로, 소득·소비·저축·투자·보험·대출·신용·연금·금융사기 예방 등을 주요 내용으로 한다."},{"t":"금융교육의 필요성","q":"금융역량 부족이 초래하는 문제에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["OECD는 개별 경제주체의 금융이해력 부족이 글로벌 경제위기를 심화시킨 원인 중 하나라고 지적했다.","금융 문맹자가 많은 사회는 불안정한 금융시장, 사기 피해 증가 등 사회 전체의 문제로 이어진다.","2011년 상호저축은행 영업정지 사태와 2024년 홍콩 ELS 사태는 금융역량의 중요성을 보여준다.","금융역량 부족은 해당 개인의 문제일 뿐 국가 경제에는 부담을 주지 않는다."],"a":4,"e":"금융역량 부족 문제를 해결하기 위해 <b>많은 사회적 비용</b>을 치러야 하므로 국가 경제에도 부담을 준다."},{"t":"환경 변화","q":"금융교육의 필요성이 커진 환경 변화에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["복잡하고 다양한 금융상품이 등장해 의사결정이 까다로워졌다.","기대수명 연장으로 장수 리스크에 대비할 필요가 커졌다.","저성장·저금리 고착화로 절약과 저축만으로 미래를 대비하기 어려워졌다.","금리가 낮아져 72의 법칙을 적용하면 금리 2%일 때 원금이 2배가 되는 데 약 20년이 걸린다."],"a":4,"e":"72 ÷ 2 = <b>36년</b>이 걸린다. 인플레이션까지 고려하면 실질금리는 0%대이거나 마이너스에 머문다."},{"t":"금융역량","q":"금융교육 분야에서 구분하는 금융역량의 세 범주로 옳은 것은?","o":["금융지식 — 금융행위 — 금융태도","금융지식 — 금융자산 — 금융소득","금융이론 — 금융실무 — 금융윤리","금융정보 — 금융기술 — 금융제도"],"a":1,"e":"OECD DeSeCo 프로젝트의 지식·기능·태도 구분이 금융교육에 적용되어 <b>금융지식·금융행위·금융태도</b>의 세 범주가 되었다."},{"t":"금융교육의 방향","q":"금융교육의 방향과 목표에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["금융지식 전달만으로는 합리적 선택이나 바람직한 금융행위가 보장되지 않는다.","인지적·기능적·정의적 측면에서 두루 강조되어야 한다.","금융교육이 궁극적으로 기대하는 목표는 금융 웰빙이다.","금융태도는 개인의 가치관 문제이므로 교육의 대상이 아니다."],"a":4,"e":"금융태도도 소홀히 해서는 안 되며, <b>가치의 지속적 내면화</b>를 통해 올바른 가치관과 바람직한 금융태도를 지니도록 해야 한다."},{"t":"금융 웰빙","q":"금융 웰빙(financial well-being)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["미국 CFPB는 금융 충격으로부터 안전하고 목표 달성에 필요한 금융 선택을 자유롭게 할 수 있는 상태로 정의한다.","미국은 금융교육 비전을 '모든 미국인과 가족의 지속적인 금융 웰빙'으로 구체화했다.","영국은 국가 전략의 명칭을 '금융 웰빙을 위한 전략'으로 정했다.","우리나라 금융위원회는 금융 웰빙을 자산 규모가 상위 10%에 드는 상태로 정의했다."],"a":4,"e":"우리나라 금융위원회는 금융 웰빙을 '금융소비자가 일상생활에서 <b>금융 문제를 스스로 처리</b>할 수 있고, <b>금융 충격으로부터 안전한 상태</b>'로 정의했다."},{"t":"학교 금융교육","q":"학교 금융교육이 중요한 이유로 <u>옳지 않은</u> 것은?","o":["사회 진출 후에는 금융교육 기회가 적고 활용하기도 어려우므로 진출 전에 역량을 갖춰야 한다.","학생들도 이미 어엿한 금융소비자이며, 어릴 적 형성된 금융 습관이 평생 지속된다.","소득·직업·지역과 관계없이 모든 학생에게 평등한 금융교육 기회를 제공한다.","가정 금융교육만으로도 충분하므로 학교 금융교육은 보조적 역할에 그쳐야 한다."],"a":4,"e":"가정 금융교육은 <b>부모의 금융역량</b>이 전제되어야 하는데 현실은 그렇지 못하다. 실제로 부모의 절반 이상이 <b>학교</b>를 가장 효과적인 금융교육 주체라고 믿고 있다."},{"t":"평생 금융교육","q":"학교 금융교육과 평생 금융교육의 역할 분담으로 옳은 것은?","o":["학교 금융교육은 기초적인 핵심 금융역량 습득에, 평생 금융교육은 생애주기별 맞춤형 교육에 초점을 둔다.","학교 금융교육이 평생에 필요한 모든 금융역량을 미리 학습시켜야 한다.","평생 금융교육은 기초 금융역량만 다루고 심화 내용은 학교가 담당한다.","평생 금융교육은 오프라인 집합교육만으로 충분히 수행할 수 있다."],"a":1,"e":"미래의 금융상품·제도 변화를 미리 학습시킬 수 없으므로 두 교육은 <b>양립</b>해야 한다. 평생 금융교육은 지리적·시간적 제약 때문에 <b>온라인 교육</b>의 역할이 상대적으로 크다."},{"t":"평생 금융교육","q":"금융감독원의 생애주기별 맞춤형 금융교육 구분에 해당하지 <u>않는</u> 것은?","o":["미혼기 — 학자금 대출 관리, 결혼 자금 마련","신혼기 — 대출 상환 관리, 주택 자금 마련","자녀 성년기 — 퇴직금 운용, 자녀 결혼 자금 포트폴리오","은퇴기 — 창업 자금 조달과 기업 지배구조 설계"],"a":4,"e":"자녀 독립기 및 은퇴기의 내용은 <b>상속 설계, 장수·건강 위험 관리, 은퇴 자산 운용</b>이다. 기업 지배구조는 개인 금융교육의 범위가 아니다."}]},{"id":"p2c02","part":2,"no":"02","title":"주요국과 우리나라의 금융교육","src":"pp.273–294","qs":[{"t":"금융 포용","q":"금융 포용(financial inclusion)에 대한 설명으로 옳은 것은?","o":["금융 소외의 반대 개념으로, 필요한 금융상품·서비스를 지불 가능한 비용으로 활용할 수 있는 상태다.","고액자산가에게 우선적으로 금융서비스를 제공하는 정책이다.","금융회사가 취급 상품 수를 늘리는 것을 뜻한다.","국가가 모든 국민에게 동일한 금액의 금융자산을 배분하는 것이다."],"a":1,"e":"금융 포용은 개인이 자신에게 필요한 금융상품과 서비스를 <b>지불 가능한 비용</b>으로 활용할 수 있는 상태를 의미한다."},{"t":"미국","q":"미국의 금융교육 제도 발전에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2002년 재무부에 '금융교육실'을 신설했다.","2003년 금융이해력 및 금융교육 진흥법을 제정했다.","2011년 소비자금융보호국(CFPB)을 설립했다.","미국 상원은 매년 9월을 국가 금융이해력의 달로 공식 승인했다."],"a":4,"e":"미국 상원은 매년 <b>4월</b>을 국가 금융이해력의 달로 공식 승인했다."},{"t":"미국","q":"미국의 FLEC(금융이해력 및 교육위원회)에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["재무부 장관이 의장을 맡는다.","금융교육 포털사이트 MyMoney.gov를 구축·운영한다.","금융교육 국가 전략을 수립·추진한다.","민간 금융회사만으로 구성된 순수 민간 협의체이다."],"a":4,"e":"FLEC에는 재무부·교육부·노동부·연방준비제도이사회·CFPB 등 <b>미국 주요 부처와 관련 기관 24개</b>가 참여하는 범정부 기구다."},{"t":"미국","q":"미국 금융교육 교재·프로그램의 가장 중요한 특징은?","o":["암기 위주의 지식 전달을 강조한다.","역할 놀이, 시뮬레이션, 집단 활동 등 체험을 통한 학습을 강조한다.","교사 강의만으로 진행하도록 설계되어 있다.","유료로만 제공되어 접근이 제한적이다."],"a":2,"e":"<b>체험을 통한 학습</b>이 핵심 특징이다. JA의 Finance Park, Financial Reality Fair, Money Smart 등 체험 학습 프로그램이 풍부하게 개발되어 있다."},{"t":"미국","q":"미국 학교 금융교육의 현황과 과제에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["CEE가 개발한 자발적 금융교육 표준안은 강제성은 없지만 중요한 준거 자료로 활용된다.","2024년 기준 51개 주 가운데 48개 주가 교육 표준안에 금융 내용을 포함하고 있다.","고등학교에서 금융 과목을 필수로 개설하도록 요구하는 주가 크게 증가했다.","금융교육이 확산되면서 이를 가르칠 교사가 충분히 확보되어 문제가 없다."],"a":4,"e":"금융교육이 급속히 확산되면서 오히려 <b>가르칠 교사가 부족</b>하다는 문제가 드러나, 일반 교사 자격증만으로 담당하게 하는 등 임시방편을 쓰고 있다."},{"t":"영국","q":"영국의 금융교육에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["초기에는 금융감독청(FSA)이 주도했으나 글로벌 금융위기 책임으로 해산되었다.","2020년 이후에는 자금연금청(MaPS)을 중심으로 추진하고 있다.","MaPS는 금융교육의 궁극적 목표를 금융역량 향상을 통한 금융 웰빙 지향으로 천명했다.","2014년 교육과정 개편에서 금융교육을 선택 요소로만 남겨두었다."],"a":4,"e":"2014년 교육과정 개편에서 처음으로 금융교육을 <b>교육과정의 필수 요소</b>로 포함했다."},{"t":"영국","q":"영국 하원 교육위원회(2024)가 지적한 학교 금융교육의 문제점으로 <u>옳지 않은</u> 것은?","o":["초등학교의 금융교육이 부족하고 중등학교의 교육 시간이 미흡하다.","교사 및 교육 자원이 부족하고 평가·감독체계가 미비하다.","거주 지역에 따라 학생들의 금융교육 기회가 차별화되고 있다.","PISA 금융이해력 평가에 참여해 국제 비교 정보가 지나치게 많다."],"a":4,"e":"영국은 PISA 금융이해력 평가에 <b>참여하지 않아</b> 국제 비교 및 진단 기회를 놓치고 있다는 것이 지적 사항이다."},{"t":"일본","q":"일본의 금융교육에 대한 설명으로 <u>옳지 않은</u> 것은?","o":["2024년 4월 금융경제교육추진기구(J-FLEC)를 설립해 업무를 개시했다.","일본에서는 '금융경제교육'이라는 용어를 사용한다.","우리나라처럼 금융경제교육 전문강사를 인증하고 파견하는 제도를 운영한다.","일본의 금융교육은 소비자교육과 완전히 분리된 독립 영역으로 운영된다."],"a":4,"e":"일본 금융교육의 특징은 <b>소비자교육의 일환</b>으로 이루어진다는 점이다. 2012년 소비자교육추진법으로 초·중·고 소비자교육이 의무화되었다."},{"t":"우리나라 학교 금융교육","q":"2022 개정 교육과정의 금융
